/* ===== بطاقة تحدي البكالوريا ===== */
.bac-card{margin:18px 0;padding:18px;border:1px solid rgba(157,184,232,.35);border-radius:16px;background:linear-gradient(125deg,rgba(140,170,215,.07),rgba(157,184,232,.06))}
.bac-head{font-weight:900;color:var(--pink);margin-bottom:10px;font-size:16px}
.bac-p{color:var(--text-dim);line-height:2;margin:0 0 6px}
.bac-part{display:flex;gap:10px;align-items:flex-start;margin:10px 0;color:var(--text);line-height:1.95}
.bac-part .pn{flex:0 0 26px;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:rgba(157,184,232,.14);color:#9db8e8;font-weight:900;font-size:13px}
.bac-sol{margin-top:14px;border-top:1px dashed rgba(157,184,232,.4);padding-top:12px}
.bac-sol summary{cursor:pointer;color:#9db8e8;font-weight:800;font-size:14px}
.bac-steps{margin:12px 18px 0;color:#cdd6e0;line-height:2.05}
.bac-steps li{margin-bottom:10px}
/* ===== رؤوس الفصول الثلاثة ===== */
.term-header{margin:6px 16px 0;padding:14px 22px;display:flex;align-items:center;gap:10px;border-radius:18px}
.term-header b{font-size:17px;color:var(--cyan)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
  font-family:'Tajawal',system-ui,'Segoe UI',sans-serif;
  background:var(--bg-0);color:var(--text);
  min-height:100vh;line-height:1.8;overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(ellipse at 12% 8%,rgba(100,181,239,.16),transparent 40%),
    radial-gradient(ellipse at 88% 18%,rgba(157,184,232,.18),transparent 42%),
    radial-gradient(ellipse at 62% 84%,rgba(140,170,215,.10),transparent 43%),
    radial-gradient(ellipse at 25% 70%,rgba(130,158,188,.14),transparent 47%),
    linear-gradient(145deg,#0e1621 0%,#080b20 34%,#0c0c29 68%,#0e1621 100%);
}
#bg-canvas{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.16}
#app{position:relative;z-index:1;min-height:100vh;padding-bottom:40px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#0e1621}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#6ab3f3,#685cff 55%,#e0975f);border-radius:10px;border:2px solid #0e1621}

/* ===== Glass & cards ===== */
.glass{background:linear-gradient(145deg,rgba(15,23,58,.72),rgba(14,22,33,.68));border:1px solid var(--border);border-radius:20px;backdrop-filter:blur(20px) saturate(155%);-webkit-backdrop-filter:blur(20px) saturate(155%);box-shadow:0 14px 40px rgba(0,0,0,.34),inset 0 1px 0 rgba(244,246,238,.07)}
.glass-strong{background:linear-gradient(145deg,rgba(18,25,65,.92),rgba(14,22,33,.94));border:1px solid rgba(101,225,255,.30);border-radius:20px;backdrop-filter:blur(24px) saturate(165%);-webkit-backdrop-filter:blur(24px) saturate(165%);box-shadow:0 20px 65px rgba(0,0,0,.5),0 0 38px rgba(82,136,193,.10),inset 0 1px 0 rgba(244,246,238,.09)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:13px;border:1px solid rgba(120,175,225,.38);background:linear-gradient(125deg,rgba(82,136,193,.22),rgba(100,181,239,.13));color:#f2f5f8;font-weight:700;cursor:pointer;font-family:inherit;font-size:15px;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.btn:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 10px 30px rgba(100,181,239,.16)}
.btn-primary{background:linear-gradient(115deg,#3390ec 0%,#2b7fc4 52%,#6f8fc0 100%);border-color:rgba(255,255,255,.18);color:#fff}
.btn-success{background:linear-gradient(120deg,#078f9f,#147b71 60%,#28bd93);border-color:rgba(94,200,140,.5)}
.btn-ghost{background:rgba(11,19,32,.6);color:var(--text-dim)}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:11px}
button:focus-visible,a:focus-visible,summary:focus-visible,[role=button]:focus-visible{outline:2px solid #8cc7f5;outline-offset:3px}

/* ===== Navbar ===== */
.navbar{position:sticky;top:10px;z-index:100;margin:10px 14px;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:18px;background:rgba(7,10,28,.8);border:1px solid rgba(117,143,255,.2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 12px 36px rgba(0,0,0,.26)}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;cursor:pointer;flex-shrink:0}
.logo-mark{width:42px;height:42px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:#0a0a0a;border:1px solid var(--border);box-shadow:0 3px 12px rgba(100,181,239,.15)}
.logo-mark svg{width:100%;height:100%;display:block}
.logo-text{font-weight:900;font-size:19px;color:var(--text);letter-spacing:.5px}
.nav-links{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nav-link{padding:8px 14px;border-radius:11px;cursor:pointer;color:var(--text-dim);font-weight:700;font-size:14px;border:1px solid transparent}
.nav-link:hover,.nav-link.active{background:linear-gradient(125deg,rgba(100,181,239,.12),rgba(157,184,232,.15));color:#fff;border-color:rgba(140,200,240,.25)}
.nav-side{display:flex;align-items:center;gap:8px;flex-shrink:0}
.mobile-menu-btn{display:none;background:transparent;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:6px}
.mobile-menu{display:none;position:fixed;top:76px;right:12px;left:12px;z-index:99;padding:14px;flex-direction:column;gap:6px}
.mobile-menu.show{display:flex}

/* ===== Hero ===== */
.hero{margin:14px 16px 8px;padding:clamp(28px,5vw,54px) clamp(18px,4vw,44px);text-align:center;border-radius:26px;border:1px solid rgba(140,200,240,.22);background:radial-gradient(ellipse at 20% 0%,rgba(82,136,193,.2),transparent 55%),radial-gradient(ellipse at 95% 80%,rgba(139,92,246,.22),transparent 45%),linear-gradient(135deg,#0a1525,#0b2340 55%,#10152d);box-shadow:0 18px 50px rgba(0,0,0,.3),0 0 35px rgba(82,136,193,.08);position:relative;overflow:hidden}
.ver-badge{display:inline-block;margin-bottom:12px;padding:5px 16px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.5px;color:#a8d4f5;background:rgba(82,136,193,.1);border:1px solid rgba(140,200,240,.35)}
.hero h1{font-size:clamp(26px,5vw,52px);font-weight:900;line-height:1.25;background:linear-gradient(105deg,#f5f7ff 0%,#71f6ff 23%,#9ea2ff 53%,#f0b95e 78%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px}
.hero p{color:#cbd4f7;font-size:clamp(14px,2vw,18px);max-width:800px;margin:0 auto 24px}
.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hero-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.hstat{padding:10px 18px;border-radius:14px;background:rgba(5,9,17,.5);border:1px solid var(--line);font-size:13px;color:var(--text-dim)}
.hstat b{color:var(--cyan);font-size:16px;margin-inline-end:6px}

/* ===== Layout grids ===== */
.subjects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;padding:26px 16px;max-width:1200px;margin:0 auto}
.subject-card{padding:32px 26px;cursor:pointer;position:relative;overflow:hidden;transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease;min-height:230px;display:flex;flex-direction:column;justify-content:space-between}
.subject-card:hover{transform:translateY(-6px);border-color:rgba(140,200,240,.46);box-shadow:0 18px 45px rgba(0,0,0,.38),0 0 28px rgba(130,158,188,.12)}
.subject-icon{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:36px;margin-bottom:16px}
.subject-icon.math{background:linear-gradient(140deg,#185cba,#5559ff 54%,#9c50ef);box-shadow:0 0 26px rgba(120,175,225,.24)}
.subject-icon.phys{background:linear-gradient(140deg,#007d98,#3554db 58%,#a842d0);box-shadow:0 0 26px rgba(100,181,239,.18)}
.subject-card h3{font-size:25px;font-weight:900;margin-bottom:8px}
.subject-card p{color:var(--text-dim);margin-bottom:16px;font-size:14px}
.subject-meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(120,175,225,.12);border:1px solid rgba(130,158,188,.26);color:#d4dbe3}
.section-header{padding:26px 16px 6px;max-width:1400px;margin:0 auto}
.section-header h2{font-size:clamp(22px,3.5vw,34px);font-weight:900;margin-bottom:6px;background:linear-gradient(120deg,#78efff,#9db8e8);-webkit-background-clip:text;background-clip:text;color:transparent}
.section-header p{color:var(--text-dim);font-size:14px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;padding:18px 16px;max-width:1400px;margin:0 auto}
.info-card{padding:22px;cursor:pointer;position:relative;overflow:hidden;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;background:linear-gradient(145deg,rgba(14,25,43,.85),rgba(14,22,33,.9));border:1px solid rgba(140,200,240,.16);border-radius:18px}
.info-card:hover{transform:translateY(-4px);border-color:rgba(140,200,240,.42);box-shadow:0 16px 40px rgba(0,0,0,.32),0 0 25px rgba(82,136,193,.08)}

/* ---------------- 2. تحويل LaTeX إلى نص مقروء (بديل KaTeX) ---------------- */
var TEXMAP={pi:'π',alpha:'α',beta:'β',gamma:'γ',theta:'θ',lambda:'λ',mu:'μ',omega:'ω',Delta:'Δ',delta:'δ',varepsilon:'ε',epsilon:'ε',phi:'φ',sigma:'σ',tau:'τ',rho:'ρ',infty:'∞',times:'×',cdot:'·',div:'÷',le:'≤',leq:'≤',ge:'≥',geq:'≥',ne:'≠',neq:'≠',approx:'≈',equiv:'≡',pm:'±',mp:'∓',Rightarrow:'⇒',rightarrow:'→',to:'→',mapsto:'↦',iff:'⇔',Longleftrightarrow:'⇔',implies:'⇒',in:'∈',notin:'∉',cup:'∪',cap:'∩',subset:'⊂',emptyset:'∅',varnothing:'∅',sum:'Σ',prod:'∏',int:'∫',angle:'∠',perp:'⊥',parallel:'∥',triangle:'△',because:'∵',therefore:'∴',cos:'cos',sin:'sin',tan:'tan',ln:'ln',log:'log',exp:'exp',lim:'lim',land:'∧',lor:'∨',uparrow:'↑',downarrow:'↓',nearrow:'↗',searrow:'↘',mid:'|',gcd:'gcd',max:'max',min:'min',arccos:'arccos',arcsin:'arcsin',arctan:'arctan',overrightarrow:'',vec:'',mathbb:'',mathcal:'',left:'',right:'',displaystyle:'',limits:'',quad:'',text:'',overline:'',bar:'',hat:'',begin:'',end:'',cases:'',aligned:'',array:'',overset:'',stackrel:'',longrightarrow:'⟶',longmapsto:'⟼',Gamma:'Γ',Omega:'Ω',deg:'deg',qquad:'  ',widehat:'',cdots:'⋯',ell:'ℓ',pmod:' mod ',bmod:' mod ',not:'¬',exists:'∃',forall:'∀'};
var SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','+':'⁺','n':'ⁿ','i':'ⁱ'};
var SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','n':'ₙ','k':'ₖ','i':'ᵢ','a':'ₐ','e':'ₑ','x':'ₓ','f':'ꜰ','A':'ₐ','B':'ᴃ','c':'с'};
function supConv(s){var o='',u;for(var i=0;i<s.length;i++){u=SUP[s[i]];if(u===undefined)return '^('+s+')';o+=u}return o}
function subConv(s){var o='',u;for(var i=0;i<s.length;i++){u=SUB[s[i]];if(u===undefined)return '_('+s+')';o+=u}return o}
function texFallback(tex){
  var s=tex;
  s=s.replace(/\\\\/g,'   ');
  s=s.replace(/\\tfrac/g,'\\frac');
  for(var it=0;it<6;it++){
    var m=s.match(/\\frac\{([^{}]*)\}\{([^{}]*)\}/);
    if(!m)break;
    s=s.replace(m[0],'('+m[1]+')∕('+m[2]+')');
  }
  s=s.replace(/\\sqrt\{([^{}]*)\}/g,'√($1)');
  s=s.replace(/\\sqrt\[(.*?)\]\{([^{}]*)\}/g,'$2^(1/$1)');
  s=s.replace(/\\overrightarrow\{([^{}]*)\}/g,'$1⃗');
  s=s.replace(/\\vec\{([^{}]*)\}/g,'$1⃗');
  s=s.replace(/\\mathbb\{([A-Z])\}/g,function(_,c){return {R:'ℝ',N:'ℕ',Z:'ℤ',Q:'ℚ',C:'ℂ'}[c]||c});
  s=s.replace(/\\lim\{\\limits\}?\{([^{}]*)\}/g,'lim');
  s=s.replace(/\\lim_{([^{}]*)}/g,'lim($1) ');
  s=s.replace(/\\text\{([^{}]*)\}/g,'$1');
  s=s.replace(/\^\{([^{}]*)\}/g,function(_,g){return supConv(g)});
  s=s.replace(/\^([A-Za-z0-9\-+])/g,function(_,g){return supConv(g)});
  s=s.replace(/_\{([^{}]*)\}/g,function(_,g){return subConv(g)});
  s=s.replace(/_([A-Za-z0-9])/g,function(_,g){return subConv(g)});
  s=s.replace(/\\([A-Za-z]+)/g,function(_,w){var t=TEXMAP[w];if(t!==undefined)return t;return ''});
  s=s.replace(/[{}]/g,'');
  return s;
}

/* ---------------- 3. تنسيق المعادلات ---------------- */
var KAT=null; /* null: غير معروف بعد، true: KaTeX متاح، false: بديل */
function typesetApp(){
  var app=document.getElementById('app');if(!app)return;
  if(KAT===true){try{renderMathInElement(app,{delimiters:[{left:'$$',right:'$$',display:true}],throwOnError:false});return}catch(e){KAT=false}}
  if(KAT===false){
    app.querySelectorAll('.math-block[data-tex]:not([data-done])').forEach(function(el){
      el.textContent=texFallback(el.dataset.tex);el.classList.add('math-fallback');el.dataset.done='1';
    });
    return;
  }
  setTimeout(function(){KAT=(typeof renderMathInElement==='function');typesetApp()},900);
}

/* ---------------- 4. العرض: أنواع الأقسام ---------------- */
function escAttr(s){return String(s).replace(/"/g,'&quot;')}
function mathBlock(tex){return '<div class="math-block" data-tex="'+escAttr(tex)+'">$$'+tex+'$$</div>'}
function secHTML(s){
  if((s.k==='ul'||s.k==='ol'||s.k==='warn'||s.k==='sum'||s.k==='method')&&!s.i&&Array.isArray(s.x)){s.i=s.x}
  switch(s.k){
    case 'h2':return '<h2>'+s.x+'</h2>';
    case 'h3':return '<h3>'+s.x+'</h3>';
    case 'p':return '<p>'+s.x+'</p>';
    case 'def':return '<div class="definition"><p><span class="dt">📘 '+(s.t||'تعريف')+' —</span> '+s.x+'</p></div>';
    case 'note':return '<div class="note-box"><b>💡 ملاحظة:</b> '+s.x+'</div>';
    case 'law':return '<div class="lawcard"><div class="lt"><span class="num">'+(s.n||'§')+'</span>'+s.t+'</div>'+mathBlock(s.m)+(s.x?'<div class="ln">'+s.x+'</div>':'')+'</div>';
    case 'math':return mathBlock(s.x);
    case 'ul':return '<ul>'+s.i.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul>';
    case 'ol':return '<ol>'+s.i.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ol>';
    case 'ex':return '<div class="example"><p><span class="dt">✍️ '+(s.t||'مثال محلول')+' —</span></p><p>'+String(s.x).replace(/\n/g,'<br>')+'</p></div>';
    case 'exer':return '<div class="exer"><p class="eq"><span class="qn">'+(s.n||'?')+'</span>'+s.q+'</p><details><summary>📝 اعرض الحل المفصل</summary><ol class="sol">'+s.s.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ol></details></div>';
    case 'warn':return '<div class="warning-box"><span class="dt">⚠️ أخطاء شائعة — تجنّبها:</span><ul>'+s.i.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul></div>';
    case 'sum':return '<div class="summary-box"><span class="dt">📌 الخلاصة الذهبية:</span><ul>'+s.i.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul></div>';
    case 'method':return '<div class="method"><div class="mt">🧭 '+(s.t||'منهجية الحل')+'</div><ol>'+s.i.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ol></div>';
    case 'tbl':return '<div class="tblwrap"><table class="dtable"><thead><tr>'+s.h.map(function(t){return '<th>'+t+'</th>'}).join('')+'</tr></thead><tbody>'+s.r.map(function(row){return '<tr>'+row.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
    case 'map':return '<div class="cmap">'+s.i.map(function(m,idx){return '<div class="cm"><span class="n">'+(idx+1)+'</span><div><b>'+m.t+'</b><small>'+m.d+'</small></div></div>'}).join('')+'</div>';
    case 'svg':return '<div class="figwrap">'+s.x+(s.cap?'<div class="figcap">'+s.cap+'</div>':'')+'</div>';
  }
  return '';
}
function secsHTML(list){return list.map(secHTML).join('')}

  var h=location.hash.replace(/^#\/?/,'');var p=h.split('/').filter(Boolean);

  if(p.length){ROUTE.page=p[0];if(p[1])ROUTE.subject=p[1];if(p[2])ROUTE.chapter=p[2]}

}

/* ---------------- 9. الخلفية الهندسية المستقرة ---------------- */
function initField(){
  var cv=document.getElementById('bg-canvas');if(!cv)return;
  var ctx;try{ctx=cv.getContext('2d')}catch(e){return}
  var DPR=Math.min(window.devicePixelRatio||1,1.5);
  var W,H;
  function resize(){W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
  resize();window.addEventListener('resize',resize);
  var reduced=false;
  try{reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  /* نقاط تنجرف في خطوط مستقيمة (حركة سلسة تمامًا بلا اهتزاز) */
  var N=Math.max(18,Math.min(42,Math.round(W*H/26000)));
  var pts=[];
  for(var i=0;i<N;i++){
    pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.08,vy:(Math.random()-0.5)*0.08,r:1.1+Math.random()*1.6});
  }
  /* مضلعات هندسية كبيرة تدور ببطء شديد */
  var polys=[
    {n:6,r:170,x:0.18,y:0.22,a:0,va:0.00055},
    {n:4,r:120,x:0.82,y:0.62,a:1.1,va:-0.00048},
    {n:3,r:145,x:0.55,y:0.88,a:0.4,va:0.0004}
  ];
  var run=true,last=0;
  document.addEventListener('visibilitychange',function(){
    var wasRun=run;run=!document.hidden;
    if(run&&!wasRun)requestAnimationFrame(frame);
  });
  function frame(t){
    if(!run)return;
    requestAnimationFrame(frame);
    if(t-last<40)return; /* تثبيت ~25 إطارًا/ث لأداء مستقر */
    last=t;
    ctx.clearRect(0,0,W,H);
    var k=reduced?0:1;
    for(var p=0;p<polys.length;p++){
      var P=polys[p];P.a+=P.va*k;
      var px=P.x*W,py=P.y*H;
      ctx.beginPath();
      for(var v=0;v<=P.n;v++){
        var ang=P.a+v*2*Math.PI/P.n;
        var X=px+Math.cos(ang)*P.r,Y=py+Math.sin(ang)*P.r;
        if(v===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);
      }
      ctx.strokeStyle='rgba(140,200,240,0.05)';ctx.lineWidth=1.4;ctx.stroke();
    }
    var md=Math.min(165,W/6),md2=md*md;
    for(var i2=0;i2<N;i2++){
      var a2=pts[i2];
      a2.x+=a2.vx*k;a2.y+=a2.vy*k;
      if(a2.x<-24)a2.x=W+24;else if(a2.x>W+24)a2.x=-24;
      if(a2.y<-24)a2.y=H+24;else if(a2.y>H+24)a2.y=-24;
      ctx.beginPath();ctx.arc(a2.x,a2.y,a2.r,0,6.2832);
      ctx.fillStyle='rgba(120,175,225,0.20)';ctx.fill();
    }
    for(var i3=0;i3<N;i3++){
      for(var j=i3+1;j<N;j++){
        var A=pts[i3],B2=pts[j];
        var dx=A.x-B2.x,dy=A.y-B2.y,d2=dx*dx+dy*dy;
        if(d2<md2){
          var o=1-Math.sqrt(d2)/md;
          ctx.strokeStyle='rgba(94,234,212,'+(o*0.05).toFixed(3)+')';
          ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B2.x,B2.y);ctx.stroke();
        }
      }
    }
  }
  requestAnimationFrame(frame);
}

/* ---------------- 15.2 الصوت ---------------- */
function xSound(kind){
  if(!XCFG.sound||!XCFG.beep)return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!xSound.ctx)xSound.ctx=new AC();var ctx=xSound.ctx;
    if(ctx.state==='suspended')ctx.resume();
    var seq=(kind==='success')?[[660,.0,.09],[880,.10,.12]]:(kind==='error')?[[220,.0,.16]]:[[520,.0,.07]];
    for(var i=0;i<seq.length;i++){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.frequency.value=seq[i][0];o.type='sine';
      g.gain.setValueAtTime(0.0001,ctx.currentTime+seq[i][1]);
      g.gain.exponentialRampToValueAtTime((XCFG.vol/10)*0.18,ctx.currentTime+seq[i][1]+.01);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+seq[i][1]+seq[i][2]);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+seq[i][1]);o.stop(ctx.currentTime+seq[i][1]+seq[i][2]+.02);
    }
  }catch(e){}
}

function signupSubmit(){
  AUTH.email=(gid('a-email')||{}).value||AUTH.email;AUTH.pass=(gid('a-pass')||{}).value||'';AUTH.pass2=(gid('a-pass2')||{}).value||'';

  if(AUTH.pass.length<6)aErr('pass','كلمة المرور 6 أحرف على الأقل');

function loginSubmit(){

  if(!SB.ready){aErr('top','تسجيل الدخول غير متاح حاليًا: '+sbStatus());render();return}

function answerQuiz(idx){answerQuiz14(idx);try{var r=gid('app');if(r)r.innerHTML+=renderBottomNav()}catch(e){}}
function xTotalLessons(){return CH_MATH.length+CH_PHYS.length}
function xStats(){
  var doneK=Object.keys(STATE.done||{}),startK=Object.keys(STATE.started||{});
  var quizK=Object.keys(STATE.quiz||{});
  var quizDone=0,quizPerfect=0;
  for(var i=0;i<quizK.length;i++){var q=STATE.quiz[quizK[i]];if(q&&q.total){quizDone++;if(q.best>=q.total)quizPerfect++}}
  var pct=Math.round(100*doneK.length/xTotalLessons());
  return {done:doneK.length,started:startK.length,quizAtt:quizK.length,quizDone:quizDone,quizPerfect:quizPerfect,pct:pct,total:xTotalLessons(),saved:(STATE.saved||[]).length};
}
function xSync(){
  if(!SB.ready||!USER.session)return;
  try{
    if(xSync.t)clearTimeout(xSync.t);
    xSync.t=setTimeout(function(){
      SB.client.from('progress').upsert({user_id:USER.session.user.id,
        data:{done:STATE.done,saved:STATE.saved,quiz:STATE.quiz,started:STATE.started,last:STATE.lastLesson}}).then(function(r){if(r.error)console.warn('sync',r.error.message)}).catch(function(e){});
    },800);
  }catch(e){}
}
function xPull(uid){
  if(!SB.ready)return;
  SB.client.from('progress').select('data,updated_at').eq('user_id',uid).maybeSingle().then(function(r){
    if(r.error||!r.data||!r.data.data)return;
    var d=r.data.data||{};
    var i,k;
    if(d.done)for(k in d.done)STATE.done[k]=d.done[k];
    if(d.started)for(k in d.started)STATE.started[k]=1;
    if(d.quiz)for(k in d.quiz){var a=STATE.quiz[k],b=d.quiz[k];if(!a||!b||(b.best>a.best))STATE.quiz[k]=b}
    if(d.saved&&d.saved.length){var set={};for(i=0;i<STATE.saved.length;i++)set[STATE.saved[i]]=1;for(i=0;i<d.saved.length;i++)if(!set[d.saved[i]]){set[d.saved[i]]=1;STATE.saved.push(d.saved[i])}}
    if(!STATE.lastLesson&&d.last)STATE.lastLesson=d.last;
    saveState();render();
    toast('☁️ تم استرجاع تقدمك من حسابك');
  }).catch(function(e){});
}

function parseHash(){
  var h=location.hash.replace(/^#\/?/,'');var p=h.split('/').filter(Boolean);
  ROUTE={page:'home',subject:null,chapter:null};
  var known=['home','subject','lesson','quiz','dash','profile','settings','admin','auth'];
  if(p.length){ROUTE.page=p[0];if(known.indexOf(ROUTE.page)<0)ROUTE.page='home';if(p[1])ROUTE.subject=p[1];if(p[2])ROUTE.chapter=p[2]}
  if(ROUTE.page==='lesson'||ROUTE.page==='quiz'){if(!ROUTE.subject||!findChapter(ROUTE.subject,ROUTE.chapter||'')){ROUTE.page='home'}}
}

/* ---- 16.3 أيقونة التطبيق (تُرسم برمجيًا — لا تحتاج ملفات صور) ---- */
function xIconData(size){
  try{
    var cv=document.createElement('canvas');cv.width=size;cv.height=size;
    var g=cv.getContext('2d');if(!g)return null;
    var r=size*0.225;
    g.beginPath();
    g.moveTo(r,0);g.lineTo(size-r,0);g.quadraticCurveTo(size,0,size,r);
    g.lineTo(size,size-r);g.quadraticCurveTo(size,size,size-r,size);
    g.lineTo(r,size);g.quadraticCurveTo(0,size,0,size-r);
    g.lineTo(0,r);g.quadraticCurveTo(0,0,r,0);
    g.closePath();
    g.fillStyle='#0a0a0a';g.fill();
    var gr=g.createLinearGradient(0,0,size,size);
    gr.addColorStop(0,'#ff6b5e');gr.addColorStop(.45,'#f51d0d');gr.addColorStop(1,'#8f0b02');
    g.save();g.translate(size/2,size/2);
    g.fillStyle=gr;
    var bw=size*0.74,bh=size*0.2;
    g.rotate(Math.PI/4);g.fillRect(-bw/2,-bh/2,bw,bh);
    g.rotate(-Math.PI/2);g.fillRect(-bw/2,-bh/2,bw,bh);
    g.restore();
    var d=cv.toDataURL('image/png');
    return (d&&d.indexOf('data:image')===0)?d:null;
  }catch(e){return null}
}

function xPickAvatar(){
  var inp=null;
  try{inp=document.createElement('input');inp.type='file';inp.accept='image/*'}catch(e){toast('ℹ️ تغيير الصورة يحتاج متصفحًا حقيقيًا');return}
  inp.onchange=function(){
    var f=(inp.files&&inp.files[0]);if(!f)return;
    try{
      var rd=new FileReader();
      rd.onload=function(){
        try{
          var img=new Image();
          img.onload=function(){
            try{
              var cv=document.createElement('canvas');cv.width=96;cv.height=96;
              var g=cv.getContext('2d');if(!g){toast('❌ تعذرت معالجة الصورة');return}
              var iw=img.width||96,ih=img.height||96,m=Math.min(iw,ih);
              g.drawImage(img,(iw-m)/2,(ih-m)/2,m,m,0,0,96,96);
              var d=cv.toDataURL('image/png');
              if(d&&d.indexOf('data:image')===0){
                USER.profile.avatar_url=d;x18SaveUser(USER.profile);
                toast('✅ تم تحديث صورتك');render();
              }else{toast('❌ تعذرت معالجة الصورة')}
            }catch(e){toast('❌ تعذرت معالجة الصورة')}
          };
          img.src=rd.result;
        }catch(e){toast('❌ تعذرت معالجة الصورة')}
      };
      rd.readAsDataURL(f);
    }catch(e){toast('❌ تعذر قراءة الصورة')}
  };
  try{inp.click()}catch(e){}
}

<script>
/* ============================================================

APP_META.ver='21.0';APP_META.date='2026-10-30';APP_META.notes='الإصدار 21 — تصحيح شامل للأخطاء: إصلاح الصفحة الفارغة على بعض الأجهزة والتعامل مع تعطيل التخزين.';

var LOGO='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%"><defs><linearGradient id="x20g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#54C7F0"/><stop offset=".45" stop-color="#229ED9"/><stop offset="1" stop-color="#0F6FA8"/></linearGradient><filter id="x20p" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1.5" dy="1.8" stdDeviation="1.6" flood-color="#083A57" flood-opacity=".55"/></filter></defs><rect width="64" height="64" rx="14" fill="#0E1621"/><circle cx="12" cy="14" r="1" fill="#54C7F0" opacity=".5"/><circle cx="52" cy="9" r="1.2" fill="#2AABEE" opacity=".45"/><circle cx="56" cy="50" r="1" fill="#54C7F0" opacity=".4"/><circle cx="8" cy="49" r="1.1" fill="#2AABEE" opacity=".4"/><g filter="url(#x20p)"><rect x="8" y="26" width="48" height="12" rx="5.5" fill="url(#x20g)" transform="rotate(45 32 32)"/><rect x="8" y="26" width="48" height="12" rx="5.5" fill="url(#x20g)" transform="rotate(-45 32 32)"/></g><rect x="10" y="27" width="44" height="2.6" rx="1.3" fill="#ffffff" opacity=".35" transform="rotate(45 32 32)"/><rect x="10" y="27" width="44" height="2.6" rx="1.3" fill="#ffffff" opacity=".35" transform="rotate(-45 32 32)"/></svg>';

function x20Online(){try{return navigator.onLine!==false}catch(e){return true}}
var X20OUT='x20_outbox';
function x20OutRead(){try{return JSON.parse(localStorage.getItem(X20OUT)||'[]')}catch(e){}try{var __ov=stGet(X20OUT,null);return (__ov&&__ov.slice)?__ov:[]}catch(e2){return []}}

function x20OutShift(){try{var q=x20OutRead();q.shift();x20OutSave(q)}catch(e){}}
function x20OutCount(){try{return x20OutRead().length}catch(e){return 0}}
function x20SendForm(p,ok,fail){
  /* الطلب الأساسي: XMLHttpRequest + FormData — «طلب بسيط» لا يستدعي فحص CORS
     المسبق الذي كانت بعض المتصفحات ترفضه فيظهر خطأ «غير متصل» زائفًا */
  var fin=false;var done=function(g){if(fin)return;fin=true;try{(g?ok:fail)()}catch(e){}};
  try{
    var fd=new FormData();
    for(var k in p){if(p.hasOwnProperty(k))fd.append(k,p[k])}
    var x=new XMLHttpRequest();
    x.open('POST','https://formsubmit.co/ajax/'+XOWNER_MAIL,true);
    x.timeout=12000;
    x.onreadystatechange=function(){if(x.readyState===4){done(x.status>=200&&x.status<300)}};
    x.onerror=function(){done(false)};
    x.ontimeout=function(){done(false)};
    x.send(fd);
  }catch(e){done(false)}
}
function x20SendFetch(p,ok,fail){
  /* المحاولة الثانية: fetch + FormData بلا ترويسات مخصصة (لا فحص مسبق أيضًا) */
  try{
    var fd=new FormData();
    for(var k in p){if(p.hasOwnProperty(k))fd.append(k,p[k])}
    fetch('https://formsubmit.co/ajax/'+XOWNER_MAIL,{method:'POST',body:fd})
    .then(function(r){if(r&&r.ok){ok()}else{fail()}})
    .catch(function(){fail()});
  }catch(e){try{fail()}catch(e2){}}
}

}
function x20Flush(quiet){
  try{
    if(!x20Online()||!x20OutCount())return;
    var p=x20OutRead()[0];
    x20SendForm(p,function(){x20OutShift();toast('✅ وصل إشعارك المؤجل إلى بريد المنصة','success');x20Flush(quiet)},function(){

    });

{k:'ex',t:'مثال محلول بالتفصيل',x:'حدد مجموعة تعريف الدالة f المعرفة بـ: f(x) = (x + 3) ∕ (x² − 4).\nالمقام x² − 4 يجب ألا يساوي صفرًا: x² − 4 = 0 يعطي x = 2 أو x = −2.\nإذن المجموعة المطلوبة هي كل ℝ ما عدا 2 و −2:\nD_f = ℝ ∖ {−2 , 2} أي: ]−∞ , −2[ ∪ ]−2 , 2[ ∪ ]2 , +∞[.'},

{k:'law',t:'العلاقة الجوهرية',m:'M(x\\,;\\,y)\\in \\Gamma_f\\;\\iff\\;x\\in D_f\\;\\land\\;y=f(x)',x:'النقطة M من المنحنى إذا وفقط إذا كان فاصلتها في مجموعة التعريف وترتيبتها هو الصورة f(x). هذه العلاقة أساس كل تمثيل بياني.'},
{k:'note',x:'حل المعادلة f(x) = k هندسيًا يعني البحث عن فواصل نقاط تقاطع المنحنى Γ_f مع المستقيم (d) ذي المعادلة y = k. عدد الحلول = عدد نقاط التقاطع.'},

{k:'law',t:'نتيجة مهمة في التساوي الشكلي',m:'f=g\\;\\iff\\;\\begin{cases}D_f=D_g\\\\\\forall x\\in D_f:\\;f(x)=g(x)\\end{cases}',x:'غياب شرط واحد يسقط التساوي. هاتان الدالتان: f(x)=(x²−1)/(x−1) و g(x)=x+1 غير متساويتين رغم أن الصيغةتين تتشابهان بعد التبسيط، لأن D_f = ℝ∖{1} بينما D_g = ℝ.'},

{k:'tbl',h:['الدالة المرجعية','مجموعة التعريف','السلوك (التزايد)','شكل المنحنى'],r:[

{k:'h3',x:'كيف نستثمر هذا الجدول؟ الدوال المركبة من مرجعية'},
{k:'p',x:'معظم دوال البكالوريا تُبنى بقولنا: f = g ∘ u حيث g مرجعية و u دالة مساعدة. مثال: f(x) = √(x² + 1) هي g ∘ u مع u(x) = x² + 1 و g(x) = √x. لدراسة تزايد f ندرس تزايد u على مجال جزئي ثم نطبق قاعدة الحفاظ على السلوك.'},
{k:'law',t:'قاعدة السلوك بالتركيب',m:'a<b\\;\\Rightarrow\\;u(a)<u(b)\\;\\Rightarrow\\;g(u(a))<g(u(b))',x:'إذا كانت u تزايدية على I و g تزايدية على u(I) فإن g∘u تزايدية على I. القاعدة العملية: «التزايد مع التزايد يعطي تزايدًا»، «التناقص مع التزايد يعطي تناقصًا»، «التناقص مع التناقص يعطي تزايدًا». نستعملها كثيرًا في دراسة دوال مثل √u و 1/u و u² دون حساب النهايات.'},
{k:'h2',x:'4. دراسة منحنى دالة: التزايد والقيم القصوى'},
{k:'def',t:'تعريف — التزايد الصارم',x:'نقول إن f تزايدية صرامةً على مجال جزئي I من D_f إذا كان لكل عنصرين a و b من I: a < b يستلزم f(a) < f(b). وبالمثل التناقص الصارم: a < b يستلزم f(a) > f(b). إذا كانت إحدى العلاقات غير صارمة (≤ أو ≥) نتحدث عن تزايد أو تناقص غير صارم.'},

{k:'math',x:'\\tau_{f}(a\\,;\\,b)=\\frac{f(b)-f(a)}{b-a}'},
{k:'law',t:'الرابط بين المعدل والسلوك',m:'\\forall a,b\\in I:\\;\\frac{f(b)-f(a)}{b-a}\\;\\ge\\;0\\;\\iff\\;f\\uparrow\\;\\text{on}\\;I',x:'المعدل الموجب بين كل نقطتين يعني تزايدًا، والمعدل السالب يعني تناقصًا (ونستبدل ≥ بـ ≤ و↑ بـ ↓). هذه المساواة أصل مفهوم الاشتقاقية لاحقًا: الاشتقاقية هي نهاية معدلات التغير عندما يقترب b من a. لاحظ أن b − a و f(b) − f(a) نفس الإشارة عند التزايد، وإشارتان مختلفتان عند التناقص.'},
{k:'ex',t:'مثال محلول',x:'برهن أن الدالة f(x) = x² تناقصية على ]−∞ , 0].\nنأخذ عددين a و b من المجال بحيث a < b ≤ 0 ونحسب المعدل:\nτ = (b² − a²)/(b − a) = (b − a)(b + a)/(b − a) = a + b.\nبما أن a < b ≤ 0 فإن a + b < 0، أي المعدل سالب، إذن f تناقصية على المجال.∎'},
{k:'ex',t:'مثال: الدالة المقلوب',x:'الدالة f(x) = 1/x تناقصية على كل من المجالين ]−∞ , 0[ و ]0 , +∞[ منفصلين، لكنها ليست تناقصية على اتحادهما! خذ a = −1 و b = 1: لدينا a < b بينما f(a) = −1 < f(b) = 1 وهو ما يناقض التناقص. هذا خطأ كلاسيكي في الفروض.'},
{k:'def',t:'تعريف — القيمة القصوى المطلقة',x:'نقول إن f تقبل قيمة قصوى مطلقة M على D_f عند العدد a إذا كان: f(a) = M و f(x) ≤ M لكل x من D_f. وبالمثل القيمة الصغرى المطلقة m عند a إذا كان f(x) ≥ m لكل x.'},
{k:'def',t:'تعريف — القيمة القصوى النسبية (المحلية)',x:'M قيمة قصوى نسبية للدالة f عند a إذا وُجد مجال جزئي I يحوي a تكون فيه f(a) القيمة القصوى لـ f على I. القيمة القصوى المطلقة هي قصوى نسبية، والعكس غير صحيح.'},
{k:'ex',t:'مثال محلول بالتفصيل (طريقة الشكل الرأسي)',x:'f(x) = −2x² + 8x − 3 على ℝ.\nنكتب الشكل الرأسي: x² − 4x = (x − 2)² − 4 وبالتالي:\nf(x) = −2[(x − 2)² − 4] − 3 = −2(x − 2)² + 5.\nبما أن −2(x − 2)² ≤ 0 دائمًا، فإن f(x) ≤ 5 لكل x، والمساواة عند x = 2 فقط.\nالنتيجة: f تقبل قيمة قصوى مطلقة تساوي 5 عند x = 2 (الرأس S(2 , 5) للقطع المكافئ).'},
{k:'exer',n:'3',q:'بين أن الدالة f(x) = x + 4/x على ]0 , +∞[ تقبل قيمة صغرى مطلقة وحددها.',s:['لأجل x > 0 نجمع بالمتطابقة الشهيرة: x + 4/x = (√x − 2/√x)² + 4.','في الواقع: (√x − 2/√x)² = x − 4 + 4/x، ومنه f(x) = (√x − 2/√x)² + 4 ≥ 4.','المساواة تحقق عندما √x = 2/√x أي x = 2.','القيمة الصغرى المطلقة هي 4 وتُدرَك عند x = 2.']},
{k:'h2',x:'5. تركيب الدوال'},
{k:'p',x:'تخيّل الدالتين كآلتين: f تأخذ العدد وتعطينا نتيجة، ثم تأخذ g هذه النتيجة وتعطينا النتيجة النهائية. هذا هو التركيب g∘f ونقرؤه «g تركيب f» — ببساطة: أقواس الداخل أولًا.'},
{k:'def',t:'الدالة المركبة',x:'إذا كانت f معرفة على D_f وكانت صور f تقبل في g، فإن g∘f هي الدالة التي تحقق (g∘f)(x)=g(f(x)): نُدخل x إلى f أولًا ثم نعطي ناتجها لـ g.'},
{k:'svg',x:'<svg viewBox="0 0 340 120" width="340"><rect x="15" y="38" width="70" height="46" rx="10" class="shape"/><text x="50" y="67" text-anchor="middle">f</text><rect x="165" y="38" width="70" height="46" rx="10" class="shape2"/><text x="200" y="67" text-anchor="middle">g</text><path class="ax" d="M92 61 H160"/><path class="ax" d="M242 61 H300"/><path class="ax" d="M300 61 l-10 -5 m10 5 l-10 5"/><path class="ax" d="M160 61 l-10 -5 m10 5 l-10 5"/><text x="8" y="66">x</text><text x="128" y="50">f(x)</text><text x="308" y="66">g(f(x))</text></svg>',cap:'التركيب: يدخل x إلى الآلة f أولًا، ثم تذهب نتيجتها إلى الآلة g'},
{k:'ex',t:'مثال بسيط جدًا',x:'لتكن f(x)=x+1 و g(x)=x².\\n(g∘f)(3): الداخل أولًا: f(3)=4 ثم g(4)=16.\\n(f∘g)(3): الداخل أولًا: g(3)=9 ثم f(9)=10.\\nالترتيب يغيّر النتيجة — حدد دائمًا أي الدالتين «داخل» وأيهما «خارج».'},
{k:'warn',t:'خطأ شائع',x:['(g∘f)(x) ليست g(x)×f(x) — التركيب ليس ضربًا.','قبل التركيب تأكد أن صور f تقبل داخل g وإلا فالمركبة غير معرفة.']},
{k:'h2',x:'6. استنتاج منحنى دالة انطلاقًا من منحنى أخرى'},
{k:'p',x:'بدل رسم منحنى من الصفر، نستغل منحنى C_f المعروف ونستنتج منه منحنيات «قريبة» بحركات هندسية بسيطة — أسئلة الرسوم في البكالوريا تعتمد عليها كليًا.'},
{k:'tbl',h:['الانتقال إلى','الحركة الهندسية','ماذا يحدث للمنحنى'],r:[
['y=f(x)+b','انسحاب عمودي','يصعد b وحدة إذا b>0 وينزل إذا b<0'],
['y=f(x+a)','انسحاب أفقي','يزحج يسارًا بمقدار a إذا a>0، ويمينًا إذا a<0'],
['y=|f(x)|','طي ما تحت المحور','ما كان تحت المحور الأفقي ينعكس فوقه وما فوقه يبقى كما هو'],
['y=f(−x)','تناظر يميني/يساري','المنحنى ينعكس حول محور الفواصل']]},
{k:'ex',t:'مثال قراءة',x:'نعلم أن f(2)=3 وأن المنحنى يقطع المحور عند x=5.\\nمنحنى y=|f(x)|: يملك نفس القيمة 3 عند x=2 (كانت فوق المحور فبقيت)، ويقطع المحور عند 5 (النقط الملامسة لا تتحرك).\\nمنحنى y=f(x)−2: عند x=2 قيمته 3−2=1 — المنحنى كله نزل وحدتين.'},
{k:'h2',x:'7. تغيير المعلم'},
{k:'p',x:'الشكل لا يتغير، لكن نصفحه بإحداثيات جديدة: نختار مبدأً جديدًا Ω(α , β) ومحاور موازية للقديمة. فائدة ذلك: معادلة معقدة تصبح معادلة بسيطة لو وضعنا «مركز» الشكل مبدأً جديدًا.'},
{k:'law',t:'علاقة الإحداثيات بين المعلمين',m:'x=X+\\alpha\\;\\;\\;;\\;y=Y+\\beta',x:'الإحداثية القديمة = الجديدة + إحداثيات المبدأ الجديد Ω(α , β).'},
{k:'ex',t:'لماذا نغيّر المعلم؟ مثال يشرح كل شيء',x:'المنحنى y=x²−4x+1. نختار Ω(2 , −3): أي x=X+2 و y=Y−3.\\nنعوض: Y−3=(X+2)²−4(X+2)+1=X²−3 فنحصل على Y=X².\\nإذن في المعلم الجديد المعادلة أشهر دالة مرجعية! تغيير المعلم لا يغير الشكل بل يبسط معادلته — وΩ هو في الحقيقة رأس القطع المكافئ.'},
{k:'note',t:'خلاصة الباب',x:'المنحنى واحد والأوصاف تتغير حسب المعلم: اختر المبدأ الجديد في «مركز» الشكل (رأس قطع مكافئ، مركز دائرة، مركز تناظر) لتصبح المعادلة نظيفة.'},
{k:'h2',x:'8. الزوجية والفردية'},
{k:'def',t:'تعريف — الدالة الزوجية',x:'نقول إن f زوجية إذا تحقق: (1) D_f متماثلة بالنسبة إلى 0 (أي إذا كان x ∈ D_f فإن −x ∈ D_f أيضًا)، و (2) لكل x من D_f: f(−x) = f(x). منحنى الدالة الزوجية متماثل محوريًا بالنسبة إلى محج الترتيب (محور الفواصل).'},
{k:'def',t:'تعريف — الدالة الفردية',x:'نقول إن f فردية إذا تحقق: (1) D_f متماثلة بالنسبة إلى 0، و (2) لكل x من D_f: f(−x) = −f(x). منحنى الدالة الفردية متماثل مركزيًا بالنسبة إلى مبدأ المعلم.'},
{k:'method',t:'منهجية إثبات الزوجية أو الفردية (خطوات الفرض)',i:['الخطوة 1 — نتحقق أن D_f متماثلة بالنسبة إلى 0 (وإلا الدالة ليست زوجية ولا فردية أبدًا).','الخطوة 2 — نحسب f(−x) ونحاول كتابته بدلالة f(x).','الخطوة 3 — نقارن: إذا حصلنا f(−x) = f(x) فالدالة زوجية، وإذا حصلنا f(−x) = −f(x) فهي فردية، وإذا لا هذا ولا ذاك فهي ليست زوجية ولا فردية.']},
{k:'ex',t:'مثال محلول كامل',x:'f(x) = x³ − 3x على ℝ (D_f = ℝ متماثلة).\nنحسب: f(−x) = (−x)³ − 3(−x) = −x³ + 3x = −(x³ − 3x) = −f(x).\nالنتيجة: f فردية، ومنحنيها متماثل مركزيًا بالنسبة إلى المبدأ. (لاحظ: x³ دالة فردية و 3x دالة فردية ومجموع دالتين فرديتين فردي).'},
{k:'ex',t:'مثال ثانٍ',x:'g(x) = x² + |x| على ℝ:\ng(−x) = x² + |x| = g(x) إذن g زوجية.\nحيلة عملية: مجموع دالتين زوجيتين زوجي دائمًا، ومجموع دالتين فرديتين فردي دائمًا، بينما مجموع زوجية وفردية ليس زوجيًا ولا فرديًا عمومًا.'},
{k:'exer',n:'4',q:'ادرس زوجية الدالة h(x) = (x² − 1)/(x² + 1) ثم الدالة k(x) = 1/(x − 1).',s:['h: المجموعة ℝ متماثلة، و h(−x) = ((−x)² − 1)/((−x)² + 1) = (x² − 1)/(x² + 1) = h(x): الدالة h زوجية.','k: مجموعة تعريفها ℝ ∖ {1} غير متماثلة بالنسبة إلى 0 (لأن −1 يوجد في D لكن 1 لا يوجد... الهدف: 1 ∉ D بينما −1 ∈ D)، إذن k ليست زوجية ولا فردية دون أي حساب إضافي.']},
{k:'warn',i:['إهمال شرط تماثل D_f بالنسبة إلى 0 — يكفي هذا وحده لإسقط الزوجية والفردية معًا.','الخلط بين التماثل المحوري (زوجية) والمركزي (فردية) في الرسم.','القول إن 1/x تناقصية على D_f كله — الصحيح: على كل مجال جزئي منفرٍ عن الصفر.','نسيان أن القيمة القصوى النسبية قد لا تكون مطلقة — مثال: منحنى بعدة «قمم» و«قيعان».']},
{k:'sum',i:['D_f أولًا: قيود المقام ≠ 0 والجذر ≥ 0 وتقاطع القيود.','M(x ; y) ∈ Γ_f ⟺ x ∈ D_f و y = f(x).','تساوي دالتين = نفس D + نفس الصور (الشرطان معًا).','التزايد ⇔ معدل التغير موجب، والتناقص ⇔ معدل سالب، بين أي نقطتين.','الزوجية: f(−x) = f(x) وتماثل محوري؛ الفردية: f(−x) = −f(x) وتماثل مركزي.','الشكل الرأسي a(x − α)² + β يعطي فورًا القيمة القصوى للقطع المكافئ.']}
]});

CH_MATH.push({id:'ma2',title:'كثيرة الحدود',icon:'🧩',sem:1,
desc:'كثيرات الحدود: تعريف ودرجة، العمليات، طرق التفكيك، المعادلات والمتراجحات من الدرجة الثانية، مجموع وجداء الحلين، إشارة كثيرة الحدود، مضاعفة التربيع والمعادلات الصماء.',
keys:['كثيرة الحدود','درجة','جذر','قسمة إقليدية','باقي','عامل','تفكيك','متطابقات'],
obj:'تتقن كتابة كثيرات الحدود وتحديد درجتها وجذورها، إنجاز القسمة الإقليدية، تطبيق نظريتي الباقي والعامل، وتفكيك كثيرة حدود إلى جداء عوامل من الدرجة الأولى أو الثانية.',
take:['P(α) = 0 يعني أن (x − α) عامل لـ P — مفتاح كل تفكيك.','القسمة الإقليدية: P = B×Q + R مع درجة R أصغر تمامًا من درجة B.','الباقي في قسمة P على (x − α) يساوي بالضبط P(α).','المتطابقات الشهيرة (a² − b²) و (a³ ∓ b³) توفر نصف زمن التمرين.'],
sections:[
{k:'h2',x:'1. كثيرات الحدود: تعريف ودرجة'},
{k:'def',t:'تعريف',x:'كثيرة الحدود هي دالة معرفة على ℝ جميعها بشكل: P(x) = a_nx^n + a_{n−1}x^{n−1} + ... + a_1x + a_0 حيث الأعداد a_n , ... , a_0 معاملات حقيقية و n عدد صحيح طبيعي. إذا كان a_n ≠ 0 نسمي n درجة P ونرمزها deg(P).'},
{k:'ul',i:['كثيرة الحدود الصفرية (كل معاملاتها 0) ليس لها درجة.','درجة المجموع (P + Q) أصغر من أو تساوي أكبر الدرجمتين (تصبح أقل عند حذف الحد الأعلى).','درجة الجداء (P × Q) = deg(P) + deg(Q) دائمًا (إذا كان P و Q غير صفرين).']},
{k:'def',t:'تعريف — جذر كثيرة الحدود',x:'نقول إن العدد الحقيقي α جذر (صفر) لكثيرة الحدود P إذا كان P(α) = 0. الجذور هي المفاتيح التي تفكك بها P وتحل بها المعادلات P(x) = 0.'},
{k:'h2',x:'2. العمليات على كثيرات الحدود'},
{k:'def',t:'تعريف — القسمة الإقليدية لكثيرتي حدود',x:'قسمة كثيرة الحدود P (المقسوم) على كثيرة الحدود B ≠ 0 (المقسوم عليه) هي كتابة فريدة: P = B × Q + R حيث Q هي الخارجة (خارج القسمة) و R الباقي، بشرط أن يكون الباقي صفرًا أو درجته أصغر صرامةً من درجة B.'},
{k:'law',t:'الصيغة المؤسِّسة',m:'\\deg P\\ge \\deg B:\\quad P=B\\times Q+R\\quad\\text{مع}\\quad \\deg R<\\deg B',x:'إذا كان R = 0 نقول إن B يقسم P (الباقي صفر). درجات: deg(Q) = deg(P) − deg(B).'},
{k:'method',t:'خطوات إنجاز القسمة اليدوية (طريقة الحذف المتتالي)',i:['رتب الحدود تنازليًا في P و B (احتفظ بالحدود الصفرية الناقصة بمكانها مثل + 0x).','اقسم الحد الأعلى للمقسوم على الحد الأعلى للمقسوم عليه: أول حد للخارجة Q.','اضرب B في هذا الحد واطرح النتيجة من P: تحصل على باقٍّ أول بدرجة أصغر.','كرر العملية حتى تصبح درجة الباقي الحالي أصغر من درجة B: هذا هو R.']},
{k:'ex',t:'مثال محلول بالتفصيل الكامل',x:'أنجز القسمة الإقليدية لـ P(x) = x³ − 2x² − 5x + 6 على B(x) = x − 1.\nالخطوة 1: x³ ÷ x = x². نحسب P − x²B = (x³ − 2x² − 5x + 6) − (x³ − x²) = −x² − 5x + 6.\nالخطوة 2: (−x²) ÷ x = −x. نحسب (−x² − 5x + 6) − (−x)(x − 1) = (−x² − 5x + 6) − (−x² + x) = −6x + 6.\nالخطوة 3: (−6x) ÷ x = −6. نحسب (−6x + 6) − (−6)(x − 1) = (−6x + 6) − (−6x + 6) = 0.\nالنتيجة: Q(x) = x² − x − 6 و R = 0، أي: x³ − 2x² − 5x + 6 = (x − 1)(x² − x − 6).'},
{k:'note',x:'لاحظ أن R = 0 يعني أن القسمة تنقسم تمامًا، وأن x = 1 جذر لـ P (تحقق: P(1) = 1 − 2 − 5 + 6 = 0). هذا ليس صدفة — إنه مضمون نظرية العامل أسفله.'},
{k:'ex',t:'مثال ثانٍ: قسمة بباقٍ غير صفري',x:'قسم P(x) = x³ + x + 1 على B(x) = x + 1.\nالخطوة 1: x³ ÷ x = x². P − x²B = (x³ + x + 1) − (x³ + x²) = −x² + x + 1.\nالخطوة 2: (−x²) ÷ x = −x. (−x² + x + 1) − (−x)(x + 1) = (−x² + x + 1) − (−x² − x) = 2x + 1.\nالخطوة 3: (2x) ÷ x = 2. (2x + 1) − 2(x + 1) = 2x + 1 − 2x − 2 = −1. درجة −1 هي 0 < 1 = deg B: توقف.\nالنتيجة: x³ + x + 1 = (x + 1)(x² − x + 2) − 1 مع الباقي R = −1. لاحظ أن P(−1) = −1 − 1 + 1 = −1 = R تمامًا (نظرية الباقي).'},
{k:'law',t:'نظرية الباقي',m:'P(x)\\;=\\;(x-\\alpha)\\,Q(x)\\;+\\;P(\\alpha)',x:'بصيغة أوضح: الباقي في القسمة الإقليدية لكثيرة الحدود P على (x − α) يساوي P(α). التطبيق العملي: بحساب P(α) مباشرة تحصل على الباقي دون إنجاز أي قسمة!'},
{k:'law',t:'نظرية العامل (التفكيك)',m:'(x-\\alpha)\\mid P(x)\\;\\iff\\;P(\\alpha)=0',x:'إذا كان α جذرًا لـ P فإن (x − α) يقسم P بالضبط، أي: P(x) = (x − α)Q(x) حيث Q كثيرة حدود درجتها deg(P) − 1 تُحسب بالقسمة أو بالتصميم (طريقة Horner الذهنية).'},
{k:'ex',t:'مثال: توظيف النظرتيين معًا',x:'لدينا P(x) = 2x³ + x² − 5x + 2.\n(1) هل x = 1 جذر؟ P(1) = 2 + 1 − 5 + 2 = 0 نعم، إذن (x − 1) عامل من P.\n(2) القسمة تعطي: P(x) = (x − 1)(2x² + 3x − 2).\n(3) نفكك الثاني: 2x² + 3x − 2 = (2x − 1)(x + 2).\nالنتيجة النهائية: P(x) = (x − 1)(2x − 1)(x + 2)، والجذور هي: 1 و 1/2 و −2.'},
{k:'law',t:'خاصية التساوي',m:'\\sum a_kx^k=\\sum b_kx^k\\;\\iff\\;a_k=b_k\\;\\forall k',x:'كثيرتا حدود متساويتان على ℝ إذا وفقط إذا تساوت معاملاتهما حدًّا بحد. هذه الخاصية تحل تمارين «تحديد معاملات» دون قسمة.'},
{k:'ex',t:'مثال',x:'حدد a و b بحيث يكون: (x + 1)(ax + b) = 2x² + 5x + 3 لكل x من ℝ.\nنفتح: (x + 1)(ax + b) = ax² + (a + b)x + b.\nبمطابقة المعاملات: a = 2 ، a + b = 5 (أي b = 3) ، b = 3 (متوافق ✓). النتيجة: a = 2 و b = 3.'},
{k:'warn',i:['تذكر أن درجة الجداء = مجموع الدرجتين، وأن الحد الأعلى قد يختفي بالجمع — راقب deg(P + Q).','استعمال نظرية العامل دون التحقق من أن P(α) = 0 فعلًا.','نسيان التحقق النهائي من التفكيك بقيمة عدد سهل — خطأ حسابي واحد يهدم كل النتيجة.','القول إن كثيرة حدود من الدرجة n تقبل بالضرورة n جذرًا حقيقيًا — الصحيح: على الأكثر n جذرًا في ℝ.']},
{k:'h2',x:'3. طرق تفكيك كثيرات الحدود'},
{k:'law',t:'متطابقة الفرق (الدرجة 2)',m:'a^2-b^2=(a-b)(a+b)',x:'أشهر متطابقة: فرق مربعين يساوي جداء مجموع وفرق. استعملها فورًا عند رؤية x² − c أو x⁴ − 16 (لأن x⁴ = (x²)²).'},
{k:'law',t:'متطابقات المجموع والفرع (الدرجة 3)',m:'a^3-b^3=(a-b)(a^2+ab+b^2)\\\\ a^3+b^3=(a+b)(a^2-ab+b^2)',x:'خطأ شائع: الخلط بين إشارات الوسط! لفرع المكعبات وسط موجب (+ab)، ولمجموع المكعبات وسط سالب (−ab). المتطابقة الأولى ذات صلة مباشرة بـ (a − b) عامل.'},
{k:'law',t:'المتطابقة المزدوجة والرباعية',m:'a^2-2ab+b^2=(a-b)^2\\qquad a^4+4b^4=(a^2+2ab+2b^2)(a^2-2ab+2b^2)',x:'الأولى تمكنك من كشف جذر مزدوج (مثلا x² − 4x + 4 = (x − 2)² جذره 2 مضاعف). الثانية (متطابقة صوفي جيرمان) نادرة لكنها تظهر في أسئلة التمييز.'},
{k:'method',t:'خوارزمية تفكيك كثيرة حدود من الدرجة 3 أو 4',i:['ابحث عن «جذر واضح» بالتجريب على الأعداد الصغيرة: 0 ، ±1 ، ±2 ، ±3 (ومضاعفات المعاملات مثل ±1/2).','إذا وجدت جذرًا α: اكتب P(x) = (x − α)Q(x) بالقسمة الإقليدية.','فكك Q (درجتها أقل): إما بجذر آخر أو بالمتطابقات أو بحساب المميز لدرجة 2.','توقف عندما تصبح كل العوامل من الدرجة الأولى أو من الدرجة الثانية بمميز سالب (عوامل غير قابلة للتفكيك في ℝ).','تحقق في النهاية بفتح الأقواس أو بحساب قيمة عند عدد سهل.']},
{k:'ex',t:'مثال محلول من البداية للنهاية',x:'فكك P(x) = x³ − 3x² + 4.\n(1) جذر واضح: P(2) = 8 − 12 + 4 = 0 إذن (x − 2) عامل.\n(2) القسمة: x³ − 3x² + 0x + 4 = (x − 2)(x² − x − 2).\n(3) نفكك x² − x − 2 = (x − 2)(x + 1).\nالنتيجة: P(x) = (x − 2)²(x + 1). لاحظ أن الجذر 2 مضاعف (مزدوج) و −1 بسيط. تحقق: عند x = −1: −1 − 3 + 4 = 0 ✓'},
{k:'exer',n:'1',q:'فكك كثيرة الحدود P(x) = x⁴ − 16 ثم حل المتراصة P(x) = 0.',s:['x⁴ − 16 = (x²)² − 4² = (x² − 4)(x² + 4) = (x − 2)(x + 2)(x² + 4).','العامل x² + 4 لا يفكك في ℝ (مميزه −16 < 0)، إذن حلول المتراصة في ℝ هي x = 2 و x = −2 فقط.','P(x) = 0 ⟺ (x − 2)(x + 2)(x² + 4) = 0 ⟺ x ∈ {−2 , 2}.']},
{k:'exer',n:'2',q:'حدد a و b بحيث تكون كثيرة الحدود P(x) = x³ + ax² + bx − 6 تقبل الجذرين 1 و −2، ثم فككها.',s:['P(1) = 1 + a + b − 6 = 0 أي a + b = 5.','P(−2) = −8 + 4a − 2b − 6 = 0 أي 2a − b = 7.','بجمع المسألتين: 3a = 12 أي a = 4 ومنه b = 1.','P(x) = x³ + 4x² + x − 6 = (x − 1)(x + 2)(x + 3): نجرب P(−3) = −27 + 36 − 3 − 6 = 0 ✓']},
{k:'exer',n:'3',q:'بين أن P(x) = x⁵ − x يقبل الجذر 0 مضاعفًا فرديًا، وفكك P تمامًا في ℝ.',s:['P(x) = x(x⁴ − 1) = x(x² − 1)(x² + 1) = x(x − 1)(x + 1)(x² + 1).','الجذر 0 بسيط (وليس مضاعفًا)، والجذور 1 و −1 بسيطة.','العامل x² + 1 لا يفكك في ℝ (مميز سالب) — التفكيك الكامل: x(x−1)(x+1)(x²+1).']},
{k:'h2',x:'4. المعادلات من الدرجة الثانية'},
{k:'p',x:'هي الجواب النموذجي لكل معادلة على الشكل ax²+bx+c=0 حيث a≠0. الفكرة العبقرية: عدد واحد اسمه المميز يخبرك قبل الحساب كم حلًا لديك.'},
{k:'def',t:'المميز',x:'لكل معادلة من الدرجة الثانية نميز لها العدد Δ=b²−4ac: به نحسم مصير المعادلة دون حلها.'},
{k:'law',t:'الحلول عندما Δ≥0',m:'x=\\frac{-b\\pm\\sqrt{\\Delta}}{2a}',x:'إذا Δ<0 فلا حل في ℝ — الجذور موجودة لكنها مركبة (برنامج السنة الثالثة).'},
{k:'tbl',h:['إشارة Δ','عدد الحلول','شكل المنحنى y=ax²+bx+c'],r:[

{k:'svg',x:'<svg viewBox="0 0 340 175" width="340"><path class="ax" d="M20 90 H325"/><path class="ax" d="M325 90 l-10 -5 m10 5 l-10 5"/><path class="cv" d="M60 20 Q165 240 270 20"/><path class="aux" d="M165 20 V155"/><circle cx="99" cy="90" r="5" class="pt"/><circle cx="231" cy="90" r="5" class="pt"/><text x="92" y="112">x₁</text><text x="225" y="112">x₂</text><text x="150" y="150">x₀</text><text x="290" y="80">Δ&gt;0</text></svg>',cap:'مقطع مكافئ (a>0) مع مميز موجب: تقاطعان مع المحور الأفقي و x₀ منتصف بينهما'},
{k:'ex',t:'مثال محلول بالتفصيل',x:'نحل 2x²−5x+2=0.\\n(1) Δ=b²−4ac=25−16=9>0 إذن حلان.\\n(2) x=(5±3)/4: الجذران x₁=2 و x₂=1/2.\\n(3) تحقق: 2(2)²−5(2)+2=0 ✓ و 2(1/4)−5/2+2=0 ✓.'},
{k:'exer',n:'1',q:'حل المعادلات: x²−6x+9=0 و x²+x+1=0.',s:['الأولى: Δ=36−36=0 حل مزدوج x=3 (المنحنى يلامس المحور).','الثانية: Δ=1−4=−3<0 لا حل في ℝ — وصلنا للنتيجة دون أي حساب طويل: هذه قوة المميز.']},
{k:'p',x:'«وسيطة» أي تحوي معاملًا مجهولًا m أو مجهولًا يظهر بصيغتين مختلفتين. الأسلوبان الأمّان: التعويض أو مناقشة المميز حسب قيم m.'},
{k:'ex',t:'النمط الأول: تعويض X=2^x',x:'4^x−5×2^x+4=0.\\nلاحظ أن 4^x=(2^x)²: نضع X=2^x فتصبح X²−5X+4=0.\\nالجذران X=1 و X=4: أي 2^x=1 يعطي x=0، و 2^x=4 يعطي x=2.\\nالحل: S={0 , 2}.'},
{k:'ex',t:'النمط الثاني: مناقشة معامل مجهول',x:'ليكن m عددًا حقيقيًا، ولنناقش x²−2x+m=0.\\nΔ=4−4m: إذا m<1 حلان مختلفان، إذا m=1 حل مزدوج x=1، إذا m>1 لا حل في ℝ.\\nبمقارنة m بالعدد 1 أجبنا عن كل قيم m دفعة واحدة — هذا هو جوهر أسئلة المناقشة في البكالوريا.'},
{k:'exer',n:'2',q:'ناقش حسب قيم m عدد حلول المعادلة mx²+x−1=0 (m∈ℝ).',s:['إذا m=0 تصبح x−1=0: حل وحيد x=1 (لا ننسَ الحالة المستثناة!).','إذا m≠0: Δ=1+4m: حلان مختلفان إذا m>−1/4، حل مزدوج إذا m=−1/4، لا حل إذا m<−1/4.','المنهجية: استثني الحالة الخاصة أولًا ثم ناقش الحالة العامة بالمميز.']},

{k:'method',t:'خطوات حل متراجحة من الدرجة الثانية',i:['احسب Δ والجذور (إن وُجدت).','أنشئ جدول الإشارات: «إشارة a خارج الجذور» وتتناوب داخلها.','اقرأ الفترات التي تحقق المطلوب (≥0 أو ≤0).','اكتب المجموعة بصيغة اتحاد/تقاطع فترات — لا تنسَ الجذور نفسها عند ≥ أو ≤.']},
{k:'ex',t:'مثال محلول',x:'نحل 2x²−5x+2≤0: من المثال السابق الجذران 1/2 و 2 و a=2>0.\\nالإشارة: موجبة قبل 1/2، سالبة بين الجذور، موجبة بعد 2 (إشارة a خارج الجذور).\\nالحل: S=[1/2 , 2] — الجذران مقبولان لأن المطلوب ≤.'},
{k:'h2',x:'6. مجموع وجداء حلي معادلة من الدرجة الثانية'},

{k:'warn',t:'انتبه',x:['إذا Δ<0 في معادلة t²−St+P فلا يوجد عددان حقيقيان مجموعهما S وجداؤهما P — اذكر ذلك صراحة في حلك.','الجذران متماثلان: لا يهم أيهما سميت x₁ وأيهما x₂ — المجموع والجداء لا يتغيران.']},

{k:'method',t:'الخطوات الذهبية',i:['ضع X=x² وحوّل المعادلة إلى معادلة في X.','حل معادلة X (بالمميز أو التفكيك).','استبدل X بـ x² واحسب x مع تذكر أن x² لا يكون سالبًا أبدًا: القيم السالبة لـ X تُرفض.','في المتراجحة: أنشئ جدول إشارات مع ملاحظة أن X=x²≥0 دائمًا.']},
{k:'ex',t:'مثال محلول بالتفصيل',x:'x⁴−5x²+4=0: نضع X=x² فتصبح X²−5X+4=0.\\nالجذران X₁=1 و X₂=4 (تحقق: 1+4=5 المجموع و 1×4=4 الجداء ✓).\\nالعودة إلى x: x²=1 يعطي x=±1، و x²=4 يعطي x=±2.\\nالحل النهائي: S={−2 , −1 , 1 , 2} — أربعة حلول كما يُتوقع من معادلة درجة رابعة!'},

{k:'law',t:'الشرطان الأساسيان',m:'\\sqrt{f(x)}=g(x)\\Rightarrow f(x)\\geq0\\;;\\;g(x)\\geq0',x:'ما تحت الجذر يجب أن يكون موجبًا أو معدومًا، والطرف الثاني موجبًا أو معدومًا (لأن الجذر لا يعطي قيمة سالبة أبدًا).'},
{k:'ex',t:'مثال محلول بكل الشروط',x:'√(2x+3)=x:\\n(1) الشرطان: 2x+3≥0 و x≥0 أي x≥0.\\n(2) نربّع: 2x+3=x² أي x²−2x−3=0.\\n(3) الجذران: x=3 و x=−1 — لكن −1 يرفضه الشرط!\\n(4) الحل: S={3}. تحقق: √9=3 ✓ — لو قبلنا −1 لطلبنا √(−1) وهذا مستحيل.'},
{k:'warn',t:'الأخطاء القاتلة',x:['تربيع الطرفين دون كتابة الشرطين = فقدان نقاط حتى لو كانت النتيجة صحيحة.','(x+1)²=x²+1؟ خطأ! التربيع يعطي x²+2x+1 — استعمل المتطابقات دائمًا.']},

sections:[

{k:'p',x:'أريد معرفة «سلوك» المنحنى عند نقطة بعينها: هل يصعد؟ ينزل؟ وبأي ميل؟ نأخذ نقطة A(a ; f(a)) من المنحنى ونقطة قريبة M(a+h ; f(a+h))، فميل المستقيم (AM) هو معدل التغير. عندما تقترب M من A (أي عندما يميل h إلى 0)، المستقيم (AM) يستقر نحو وضع وحيد: المماس للمنحنى عند A.'},
{k:'law',t:'معدل التغير بين a و a+h',m:'\\tau_h=\\frac{f(a+h)-f(a)}{h}',x:'هذا المعدل هو ميل المستقيم القاطع (AM). لاحظ أنه تعميم للمعدل المألوف بين نقطتين، حيث كتبنا b = a + h.'},
{k:'def',t:'تعريف — الاشتقاقية في نقطة',x:'نقول إن الدالة f قابلة للاشتقاق في العدد a إذا كان لمعدل التغير τ_h نهاية حقيقية وحيدة عندما يميل h إلى 0 (بقيم h ≠ 0). هذه النهاية تسمى العدد المشتق لـ f عند a ونرمزها f′(a).'},
{k:'math',x:'f\'(a)=\\lim_{h\\to 0}\\frac{f(a+h)-f(a)}{h}'},
{k:'def',t:'تعريف — الدالة المشتقة',x:'إذا كانت f قابلة للاشتقاق في كل نقطة x من مجال جزئي I، فإن الدالة التي تربط كل x من I بعدده المشتق f′(x) تسمى الدالة المشتقة لـ f على I ونرمزها f′.'},
{k:'law',t:'معادلة المماس عند النقطة ذات الفاصلة a',m:'(T):\\;\\;y=f\'(a)(x-a)+f(a)',x:'المماس هو المستقيم الذي يمر بالنقطة A(a ; f(a)) وميله هو f′(a). عند الرسم: علامة f′(a) تعطي اتجاه المماس، وقيمته المطلقة تعطي حدّة الميل.'},
{k:'ex',t:'مثال محلول: من التعريف إلى المماس مباشرة',x:'لنفهم بالتعريف: f(x) = x² عند a = 3.\nالمعدل: τ_h = ((3+h)² − 9)/h = (9 + 6h + h² − 9)/h = (6h + h²)/h = 6 + h.\nعندما h → 0: f′(3) = 6.\nمعادلة المماس: y = 6(x − 3) + 9 أي y = 6x − 9. تحقق هندسي: منحنى x² عند 3 يصعد بقوة — الميل 6 موجب ✓.'},
{k:'ex',t:'مثال ثانٍ: المشتقة من التعريف لدالة الجذر',x:'f(x) = √x عند a > 0:\nτ_h = (√(a+h) − √a)/h. نضرب ونقسم على العدد المرافق (√(a+h) + √a):\nτ_h = [(a + h) − a] / [h(√(a+h) + √a)] = h / [h(√(a+h) + √a)] = 1/(√(a+h) + √a).\nعندما h → 0: f′(a) = 1/(2√a). لذلك: (√x)′ = 1/(2√x).'},
{k:'h2',x:'2. التقريب الأفيني لدالة'},
{k:'p',x:'قرب نقطة a يكون المنحنى والمماس شبه متطابقين — وهذه هدية تُغنينا عن الحاسبة: لحساب f قرب a نستبدل المنحنى بمستقيم المماس الذي حسابه سهل.'},
{k:'def',t:'التقريب الأفيني',x:'إذا كانت f قابلة للاشتقاق عند a فإنه يوجد ε(h) تقبل 0 عند 0 بحيث: f(a+h)=f(a)+h·f′(a)+h·ε(h) — الحد الأول f(a)+h·f′(a) هو «الجزء الأفيني» ونرمز له بـ p(h).'},
{k:'svg',x:'<svg viewBox="0 0 340 175" width="340"><path class="ax" d="M20 155 H325"/><path class="ax" d="M325 155 l-10 -5 m10 5 l-10 5"/><path class="ax" d="M40 10 V160"/><path class="cv" d="M40 140 Q120 40 300 60"/><path class="sol" d="M60 96 L280 28"/><circle cx="145" cy="70" r="5" class="pt"/><path class="aux" d="M145 70 V155" /><path class="aux" d="M60 96 V155" /><text x="140" y="150">a</text><text x="56" y="150">a+h</text><text x="300" y="20">المماس p</text><text x="290" y="52">المنحنى C_f</text><text x="152" y="62">A</text></svg>',cap:'قرب النقطة A يكاد المماس يلتصق بالمنحنى: p(h)=f(a)+h·f′(a) تقريب جيد لـ f(a+h)'},
{k:'law',t:'التقريب العملي (الصيغة التي تُستعمل في التمارين)',m:'f(a+h)\\approx f(a)+h\\,f\'(a)',x:'كلما صغر h صغر الخطأ — لهذا تنجح الطريقة في تقدير القيم مثل √4,02 دون حاسبة.'},
{k:'ex',t:'تقدير √4,02 باليد',x:'نأخذ f(x)=√x عند a=4 (لأن 4,02 قريبة جدًا من 4).\\n(1) f(4)=2 و f′(x)=1/(2√x) إذن f′(4)=1/4=0,25.\\n(2) 4,02=4+0,02 أي h=0,02.\\n(3) f(4,02)≈2+0,02×0,25=2,005 — والحاسبة تعطي 2,00499…: دقة مذهلة بثلاث أرقام صحيحة!'},
{k:'warn',t:'حدود الاستعمال',x:['التقريب محلي: لا يصلح إذا ابتعد h كثيرًا عن 0 — عندها يبتعد المماس عن المنحنى.','لا تخلط بين التقريب الأفيني (قرب a) والمماس نفسه: التقريب هو استعمال المماس كقيمة مقربة للدالة.']},
{k:'note',t:'الترتيب النهائي لدراسة الاشتقاقية',x:['المعدل (f(x)−f(a))/(x−a) ثم النهاية → f′(a).','المماس معادلته: y=f′(a)(x−a)+f(a) — وهي أساس التقريب الأفيني.','جدول المشتقات + قواعد العمليات = أدوات الحساب.','إشارة f′ تكشف الرتابة والمحاور الشبكية للمنحنى.']},
{k:'h2',x:'3. حساب مشتقات الدوال المألوفة'},

{k:'h2',x:'4. قواعد حساب المشتقات'},
{k:'law',t:'الجمع والجداء بمرشد',m:'(u+v)\'=u\'+v\'\\qquad\\qquad (ku)\'=k\\,u\'',x:'مشتقة المجموع هي مجموع المشتقات، والمرشد الثابت k يخرج دون تغيير. هاتان القاعدتان لا خطأ فيهما تقريبًا إذا حفظت الجدول المرجعي.'},
{k:'law',t:'مشتقة الجداء (قاعدة الفروض رقم 1)',m:'(uv)\'=u\'\\,v+u\\,v\'',x:'الخطأ القاتل: الظن أن (uv)′ = u′v′! الصحيح: «مشتقة الأول × الثاني + الأول × مشتقة الثاني». تحقق من نفسك: (x·x)′ = 1·x + x·1 = 2x وهو مطابق لمشتقة x² ✓.'},
{k:'law',t:'مشتقة المقلوب',m:'\\left(\\frac{1}{v}\\right)\'=\\frac{-v\'}{v^2}\\qquad(v\\neq 0)',x:'الإشارة السالبة في البسط هي المزلق الأشهر في التصحيح. مثال سريع: (1/x)′ = −1/x² وهو مطابق للجدول المرجعي ✓.'},
{k:'law',t:'مشتقة الخارج (قاعدة الفروض رقم 2)',m:'\\left(\\frac{u}{v}\\right)\'=\\frac{u\'\\,v-u\\,v\'}{v^2}\\qquad(v\\neq 0)',x:'«مشتقة البسط × المقام − البسط × مشتقة المقام، الكل على مربع المقام». رتب الحدود بترتيب الجملة حتى لا تقلب الطرح.'},
{k:'law',t:'مشتقات الدوال المركبة من مرجعية',m:'(u^2)\'=2u\'u\\qquad(\\sqrt{u})\'=\\frac{u\'}{2\\sqrt{u}}\\qquad\\left(\\frac{1}{u}\\right)\'=\\frac{-u\'}{u^2}',x:'حيث u دالة قابلة للاشتقاق (وشرط u > 0 لدالة الجذر). هذه القواعد الثلاث هي «صندوق الأدوات» لأغلب تمارين 2AS: مثل مشتقة (x²+1) هي 2×(2x)=4x... احترس: المثال الصحيح (x²+1)² ′ = 2(x²+1)(2x).'},
{k:'ex',t:'مثال محلول: تطبيق متدرج',x:'احسب مشتقة الدالة f(x) = (x² + 1)√x على ]0 , +∞[.\nنكتب u = x² + 1 و v = √x: لدينا u′ = 2x و v′ = 1/(2√x).\nالقاعدة: f′ = u′v + uv′ = 2x√x + (x² + 1)/(2√x).\nنجمع على مقام مشترك 2√x: f′(x) = (4x·x + x² + 1)/(2√x) = (5x² + 1)/(2√x).'},
{k:'ex',t:'مثال محلول: خارج',x:'f(x) = (2x + 3)/(x² + 1) على ℝ.\nu = 2x + 3 و v = x² + 1: u′ = 2 و v′ = 2x.\nf′(x) = [2(x² + 1) − (2x + 3)(2x)]/(x² + 1)² = (2x² + 2 − 4x² − 6x)/(x² + 1)² = (−2x² − 6x + 2)/(x² + 1)² = −2(x² + 3x − 1)/(x² + 1)².'},
{k:'exer',n:'1',q:'انجز اشتقاق الدالة g(x) = √(x² + 3) ثم احسب g′(1).',s:['نكتب g = √u مع u(x) = x² + 3: لدينا u′ = 2x.','القاعدة: g′(x) = u′(x)/(2√u(x)) = 2x/(2√(x² + 3)) = x/√(x² + 3).','عند x = 1: g′(1) = 1/√4 = 1/2.']},
{k:'exer',n:'2',q:'اكتب معادلة المماس لمنحنى الدالة f(x) = x³ − 3x في النقطة ذات الفاصلة a = 2.',s:['f′(x) = 3x² − 3 ومنه f′(2) = 12 − 3 = 9.','f(2) = 8 − 6 = 2 إذن النقطة A(2 ; 2).','المماس: y = 9(x − 2) + 2 أي y = 9x − 16.']},
{k:'h2',x:'5. تطبيقات الاشتقاقية'},
{k:'law',t:'النظرية الأساسية (الإشارة والسلوك)',m:'f\'>0\\;\\Rightarrow\\;f\\;\\nearrow\\qquad\\qquad f\'<0\\;\\Rightarrow\\;f\\;\\searrow',x:'إذا كانت المشتقة موجبة صرامةً على مجال جزئي I فإن f تزايدية على I، وإذا كانت سالبة صرامةً فإن f تناقصية على I. وعندما تعدم المشتقة وتغيّر إشارتها عند a: تحصل قيمة قصوى نسبية.'},
{k:'method',t:'منهجية دراسة دالة كاملة (نموذج البكالوريا)',i:['حدد D_f (قيود المقام والجذر).','احسب f′(x) وافصلها إلى جداء عوامل (لتسهيل دراسة الإشارة).','أدرس إشارة كل عامل ثم ابنِ جدول إشارة f′.','استنتج جدول تغيرات f: أسهم صعود/هبوط + القيم القصوى عند تحول الإشارة.','اكتب معادلات المماسات المطلوبة، وارسم (C_f) بالنقاط والمماسات الرئيسية.']},
{k:'ex',t:'مثال محلول كامل: دراسة دالة من الدرجة 3',x:'f(x) = x³ − 3x + 1 على ℝ.\n(1) الاشتقاق: f′(x) = 3x² − 3 = 3(x − 1)(x + 1).\n(2) جدول الإشارة: f′ موجبة على ]−∞ , −1[ ، سالبة على ]−1 , 1[ ، موجبة على ]1 , +∞[.\n(3) جدول التغيرات: f تزايدية ثم تناقصية ثم تزايدية؛ قيمة قصوى عظمى عند x = −1: f(−1) = −1 + 3 + 1 = 3، وقيمة صغرى عند x = 1: f(1) = 1 − 3 + 1 = −1.\n(4) المماس عند x = 0: f′(0) = −3 و f(0) = 1: y = −3x + 1 (المنحنى يهبط عند نقطة (0 ; 1)).'},
{k:'exer',n:'3',q:'ادرس التغيرات للدالة h(x) = 1/(x² + 1) على ]0 , +∞[ وبيّن أنها تقبل قيمة صغرى مطلقة.',s:['h(x) = 1/v مع v = x² + 1 (v′ = 2x): h′(x) = −2x/(x² + 1)².','على ]0 , +∞[ لدينا −2x < 0 و (x² + 1)² > 0 إذن h′(x) < 0: الدالة تناقصية صرامةً.','h تناقصية على المجال وقيمتها عند 0 هي h(0) = 1، وإلى +∞ تقترب من 0 دون بلوغه.','على المجال المفتوح لا قيمة صغرى مطلقة (الحد 0 غير مبلوغ). أما على [0 , +∞[ فالصغرى المطلقة 1 عند 0 — دقة الصيغة تهم!']},
{k:'warn',i:['(uv)′ = u′v′ خطأ شنيع — القاعدة فيها جمع بعد التوزيع.','قلب ترتيب الطرح في مشتقة الخارج: (u′v − uv′) وليس (uv′ − u′v).','نسيان شرط v ≠ 0 عند استعمال قاعدة الخارج أو المقلوب.','دراسة إشارة f′ دون تفكيكها إلى عوامل (x − α) — تفكيك إشارة المشتقة يوفر نصف الوقت.','الخلط بين «f′(a) = 0» و«قيمة قصوى»: العدم وحده لا يكفي، يلزم تغيّر إشارة المشتقة.']},
{k:'sum',i:['f′(a) هي نهاية معدل التغير — الميل الهندسي للمماس.','المماس: y = f′(a)(x − a) + f(a).','الجدول المرجعي + أربع قواعد (مجموع، مرشد، جداء، مقلوب/خارج) = كل مشتقات 2AS.','للمركبة من مرجعية: (u²)′ = 2u′u ، (√u)′ = u′/(2√u) ، (1/u)′ = −u′/u².','إشارة f′ ترسم جدول تغيرات f؛ تحول الإشارة = قيمة قصوى نسبية.']}
]});

{k:'h2',x:'1. مفاهيم أساسية في الاحتمالات'},
{k:'def',t:'تعريف — التجربة العشوائية والكون',x:'التجربة العشوائية هي تجربة نعرف نتائجها الممكنة سلفًا لكننا لا نستطيع التنبؤ بالنتيجة التي ستقع. مجموعة النتائج الممكنة تسمى الكون (المجموعة المرجعية) ونرمزها Ω. كل مجموعة جزئية من Ω تسمى حدثًا؛ الحدث الذي لا يحوي إلا نتيجة واحدة يسمى حدثًا أوليًا.'},
{k:'ex',t:'مثال: رمي نرد متوازن',x:'Ω = {1 , 2 , 3 , 4 , 5 , 6} و card(Ω) = 6.\nحدث A: «الحصول على عدد زوجي» = {2 , 4 , 6}.\nحدث B: «الحصول على عدد أكبر من 4» = {5 , 6}.\nA∩B = {6} و A∪B = {2 , 4 , 5 , 6} والحدث المعاكس Ā = {1 , 3 , 5}.'},

{k:'law',t:'حالة التساوق (الحالة المدرسية الأشهر)',m:'P(A)=\\frac{\\text{card}(A)}{\\text{card}(\\Omega)}',x:'عندما تكون كل النتائج الأولية متساوية الاحتمال (كرة متوازنة، نرد سليم، عملة نزيهة، سحب عشوائي)، يصبح احتمال الحدث هو حصة الحالات الملائمة من المجموع. تحقق دومًا من التساوق قبل استعمالها!'},
{k:'ex',t:'مثال محلول',x:'نرمي قطعتي نقود متوازنتين معًا (كل واحدة «كتابة» K أو «صورة» S).\nΩ = {(K,K) , (K,S) , (S,K) , (S,S)} و card(Ω) = 4 (تساوق لكل زوج مرتب).\nحدث A: «صورة واحدة على الأقل»: الحالات الملائمة {(K,S) , (S,K) , (S,S)} أي 3 حالات.\nP(A) = 3/4. الحدث المعاكس Ā = {(K,K)} = «لا صورة» و P(Ā) = 1/4 — تحقق: P(A) = 1 − 1/4 = 3/4 ✓.'},

{k:'law',t:'الخاصية الجمعية العامة (مع التقاطع)',m:'P(A\\cup B)=P(A)+P(B)-P(A\\cap B)',x:'إذا كان A و B غير متوافقين يختفي الحد −P(A∩B) لأن P(∅) = 0، فنرجع إلى الصيغة البسيطة للتعريف. ولثلاثة أحداث: اجمع الاحتمالات الفردية، اطرح التقاطعات الثنائية، ثم أعد إدراج التقاطع الثلاثي.'},
{k:'law',t:'خاصية الاحتواء',m:'A\\subset B\\;\\Rightarrow\\;P(A)\\le P(B)',x:'إذا كان الحدث A يستلزم الحدث B (كل حالات A حالات من B) فإن احتمال A لا يتجاوز احتمال B. منطق بديهي لكنه يظهر في أسئلة التقصي.'},
{k:'ex',t:'مثال محلول على الخصائص',x:'في تمرين: P(A) = 0.6 و P(B) = 0.5 و P(A∩B) = 0.3.\n(1) P(A∪B) = 0.6 + 0.5 − 0.3 = 0.8.\n(2) P(A∪B) معاكسه: P(Ā∩B̄) = 1 − 0.8 = 0.2 (خاصية دي مورغان: معاكس الاتحاد = تقاطع المعاكسين).\n(3) P_A(B) = P(A∩B)/P(A) = 0.3/0.6 = 0.5.'},
{k:'def',t:'تعريف — الاحتمال الشرطي',x:'إذا كان P(B) ≠ 0، فإن احتمال الحدث A مع العلم بأن B وقع (نرمزه P_B(A)) هو:'},

{k:'p',x:'الشرطي «يقلص الكون»: بدل كل Ω نصبح داخل B فقط. في شجرة الاحتمالات: الشرطي هو احتمال الفرع الثاني علمنًا بأن الأول وقع — لهذا تتغير الأوزان بعد كل مرحلة.'},
{k:'ex',t:'مثال محلول',x:'صندوق فيه 3 كرات حمراء و5 كرات بيضاء. نسحب كرتين واحدة بعد الأخرى بدون إرجاع.\nليكن R1: «الأولى حمراء» و B2: «الثانية بيضاء».\nP(R1) = 3/8. بعد سحب حمراء يبقى 7 كرات منها 5 بيضاء: P_{R1}(B2) = 5/7.\nاحتمال «حمراء ثم بيضاء»: P(R1∩B2) = P(R1) × P_{R1}(B2) = (3/8)(5/7) = 15/56.'},
{k:'def',t:'تعريف — استقلالية حدثين',x:'نقول إن الحدثين A و B مستقلين إذا كان وقوع أحدهما لا يغير احتمال الآخر، أي:'},
{k:'math',x:'P(A\\cap B)=P(A)\\times P(B)'},
{k:'note',x:'في حالة الاستقلالية: P_B(A) = P(A) (الشرطي يساوي غير الشرطي)، وP_{Ā}(A) = P(A) أيضًا. الاستقلالية صفة للتجربة/البنية، وليست معنى «متوافقين» (عدم التوافق ينتج عنه اعتماد قوي: إن وقع الأول استحال وقوع الآخر!).'},
{k:'ex',t:'مثال: مع الإرجاع يظهر الاستقلال',x:'نرمي نردًا سليمًا مرتين متتاليتين: النتيجة الثانية لا تتأثر بالأولى.\nP(«6 ثم 6») = (1/6)(1/6) = 1/36.\nفي المقابل، بدون إرجاع (مثال الصندوق أعلاه) فالسحبان غير مستقلين لأن تركيبة الصندوق تغيرت.'},
{k:'h2',x:'4. المتغير العشوائي'},
{k:'p',x:'بدل الحديث عن أحداث، نُسند لكل نتيجة عددًا: الربح في لعبة، عدد النقط على وجه الزهر… هذا هو المتغير العشوائي X، وبجدول احتمالاته نحسب «متوسط» النتائج المتوقع وأثر تشتتها.'},
{k:'def',t:'المتغير العشوائي',x:'هو تطبيق من الكون Ω نحو ℝ يسند لكل نتيجة عددًا يهمنا. قانونه = جدول قيمه x_i مع احتمالاتها p_i بحيث مجموع الاحتمالات يساوي 1 دائمًا.'},
{k:'law',t:'الرجاء (الأمل) والتباين والانحراف المعياري',m:'E(X)=\\sum p_i\\,x_i\\;\\;\\;;\\;\\;V(X)=\\sum p_i\\,x_i^{2}-\\left[E(X)\\right]^{2}\\;\\;\\;;\\;\\;\\sigma=\\sqrt{V(X)}',x:'E(X) هو المتوسط المتوقع للنتائج إذا كررنا التجربة كثيرًا، و σ يقيس مدى ابتعاد النتائج عن هذا المتوسط (التشتت).'},
{k:'svg',x:'<svg viewBox="0 0 340 175" width="340"><circle cx="60" cy="87" r="7" class="pt"/><text x="47" y="70">Ω</text><path class="ax" d="M68 82 L160 45"/><path class="ax" d="M68 92 L160 130"/><text x="100" y="52">P(A)=0,6</text><text x="100" y="125">P(Ā)=0,4</text><circle cx="168" cy="40" r="7" class="pt2"/><circle cx="168" cy="133" r="7" class="pt2"/><text x="180" y="35">A</text><text x="180" y="128">Ā</text><path class="aux" d="M176 35 L275 20"/><path class="aux" d="M176 45 L275 70"/><path class="aux" d="M176 128 L275 110"/><path class="aux" d="M176 140 L275 160"/><text x="230" y="22">0,5</text><text x="230" y="62">0,5</text><text x="230" y="112">0,3</text><text x="230" y="155">0,7</text><text x="282" y="22">x₁=200</text><text x="282" y="62">x₂=50</text><text x="282" y="112">x₃=0</text><text x="282" y="155">x₄=−100</text></svg>',cap:'شجرة الاحتمالات: كل مسار من الجذر إلى ورقة يعطي قيمة X مع احتمالها — مجموع كل الاحتمالات على الشجرة يساوي 1'},
{k:'ex',t:'مثال اللعبة المشهورة',x:'نرمي زهرًا واحدًا: إذا ظهر 6 نفوز بـ 200 دج، وإذا ظهر 4 أو 5 نفوز بـ 50 دج، وإلا نخسر 100 دج.\\n(1) القيم: x₁=200 بـ p=1/6 ، x₂=50 بـ p=2/6 ، x₃=−100 بـ p=3/6.\\n(2) E(X)=200×(1/6)+50×(2/6)−100×(3/6)=(200+100−300)/6=0.\\n(3) V(X)=200²×(1/6)+50²×(2/6)+100²×(3/6)−0²=(40000+5000+30000)/6=12500، إذن σ≈111,8 دج.\\nالتفسير: على المدى الطويل اللعبة «عادلة» (أمل صفر) لكن النتائج تتأرجح بقوة حول الصفر — σ هي مقياس هذا المخاطرة.'},
{k:'note',t:'قواعد ذهبية',x:['مجموع الاحتمالات في جدول X يساوي 1 — أول تحقق في أي تمرين.','E(X) ليس «النتيجة التي ستحصل عليها» بل المتوسط عند تكرار التجربة مرات كثيرة.','إذا X=aY+b فإن E(X)=aE(Y)+b و V(X)=a²V(Y) — أداة سريعة عند التحويلات.']},
{k:'exer',n:'1',q:'متغير عشوائي X بقانون: P(X=1)=0,3 ، P(X=2)=0,5 ، P(X=5)=k.\\n(1) عيّن k. (2) احسب E(X) و V(X).',s:['(1) k=1−0,3−0,5=0,2.','(2) E(X)=1×0,3+2×0,5+5×0,2=2,3.','V(X)=1×0,3+4×0,5+25×0,2−2,3²=7,3−5,29=2,01 إذن σ≈1,42.']},
{k:'h2',x:'5. الاحتمال الكلي واستعمال شجرة الاحتمالات'},
{k:'law',t:'صيغة الاحتمالات الكلية',m:'P(B)=P(A)\\,P_A(B)+P(\\overline{A})\\,P_{\\overline{A}}(B)',x:'إذا شكّل A و Ā «قسمًا كاملًا» للكون (حدثان معاكسان)، فاحتمال أي حدث B هو مجموع احتمالات المسارين عبر الشجرة: مرورًا بـ A أو بـ Ā. تعمم الصيغة على أي قسم كامل A₁ , A₂ , ... , Aₙ.'},
{k:'method',t:'بناء شجرة احتمالات صحيحة',i:['ارسم مرحلة أولى بأحداث تشكل قسمًا كاملًا (مثل: منتج من الآلة 1 أو من الآلة 2)، واكتب على الفرع الاحتمال غير الشرطي.','من كل عقدة ارسم الفروع الثانية واكتب عليها الاحتمالات الشرطية (علمنًا بما وقع في المرحلة الأولى).','احتمال مسار = جداء أوزان فروعه. احتمال حدث = مجموع احتمالات المسارات الملائمة له.','تحقق: مجموع أوزان الفروع الخارجة من كل عقدة يساوي 1.']},
{k:'ex',t:'مثال محلول شامل (نموذج الامتحان)',x:'مصنع يشتري قطعًا من المورّد M1 (60% من الكمية) بنسبة قطع معيبة 2%، ومن المورّد M2 (40%) بنسبة قطع معيبة 5%.\nنأخذ قطعة عشوائية. ليكن D: «القطعة معيبة».\nشجرة: P(M1) = 0.6 و P(M2) = 0.4؛ الشرطية: P_{M1}(D) = 0.02 و P_{M2}(D) = 0.05.\nالاحتمال الكلي: P(D) = 0.6×0.02 + 0.4×0.05 = 0.012 + 0.02 = 0.032 أي 3.2%.'},
{k:'exer',n:'1',q:'نرمي نردًا سليمًا مرة واحدة. احسب احتمال الحدث: «العدد أولي أو زوجي» مع العلم أن 1 يعتبر أوليًا هنا.',s:['A = «أولي» = {2 , 3 , 5} و B = «زوجي» = {2 , 4 , 6}.','A∩B = {2} (غير متوافقين جزئيًا).','P(A∪B) = 3/6 + 3/6 − 1/6 = 5/6. البديل: العد المباشر {2 , 3 , 4 , 5 , 6} = 5 حالات من 6 ✓.']},
{k:'exer',n:'2',q:'نسحب كرتين بالتتالي من كيس فيه 4 كرات حمراء و3 زرقاء (بدون إرجاع). ما احتمال حصول كرات من نفس اللون؟',s:['«نفس اللون» = «حمراء ثم حمراء» أو «زرقاء ثم زرقاء» (حدثان غير متوافقين).','P(ح م ح) = (4/7)(3/6) = 12/42 = 2/7.','P(ز م ز) = (3/7)(2/6) = 6/42 = 1/7.','الجمع: 2/7 + 1/7 = 3/7 ≈ 0.43.']},
{k:'exer',n:'3',q:'في مسابقة: اللاعب يتأهل للدور الثاني باحتمال 0.7، وإذا تأهل يفوز باحتمال 0.4. ما احتمال أن يفوز بالمسابقة؟',s:['ليكن T: «يتأهل» و V: «يفوز». نريد P(T∩V) لأن الفوز يستلزم التأهل.','P(T∩V) = P(T) × P_T(V) = 0.7 × 0.4 = 0.28.','لاحظ: احتمال الفوز بالمسابقة هو احتمال مسار كامل في الشجرة، وليس P(V) وحده.']},
{k:'warn',i:['استعمال P(A) = card(A)/card(Ω) دون التحقق من التساوق.','الخلط بين «غير متوافقين» (A∩B = ∅) و«مستقلين» (P(A∩B) = P(A)P(B)) — مفهومان مختلفان تمامًا.','في الشجرة: ضرب الاحتمالات غير الشرطية للمرحلة الثانية بدل الشرطية.','نسيان أن أحتمالًا ناتجًا يجب أن يكون بين 0 و 1 — إن ظهر خارجها فراجع الحساب فورًا.']},
{k:'sum',i:['الكون Ω والأحداث مجموعات جزئية منه — لغة المجموعات تحكم الاحتمالات.','التساوق: النسبة card(A)/card(Ω)؛ وP(Ā) = 1 − P(A)؛ وP(A∪B) = P(A)+P(B)−P(A∩B).','الشرطي: P_B(A) = P(A∩B)/P(B) — «قلّص الكون ثم اسأل».','الاستقلال: P(A∩B) = P(A)·P(B).','الاحتمال الكلي: مجموع جداءات أوزان المسارات الملائمة في الشجرة.']}
]});

{k:'svg',x:'<svg viewBox="0 0 340 175" width="340"><path class="ax" d="M40 155 H320"/><path class="ax" d="M320 155 l-10 -5 m10 5 l-10 5"/><path class="ax" d="M50 10 V160"/><path class="ax" d="M50 10 l-5 10 m5 -10 l5 10"/><path class="sol" d="M50 155 L190 55"/><path class="sol" d="M190 55 l-12 -2 m12 2 l-9 8"/><text x="200" y="50">u→(4 , −6)</text><path class="cv" d="M50 155 L130 130"/><path class="cv" d="M130 130 l-12 0 m12 0 l-10 6"/><text x="140" y="128">v→(2 , −1,5)</text><circle cx="50" cy="155" r="4" class="pt"/><text x="38" y="150">O</text></svg>',cap:'كل متجه يُحدد بمركبتيه (x , y) في معلم، ويُرسم كسهم انطلاقه المبدأ'},

{k:'def',t:'تعريف',x:'ليكن A و B نقطتين و a و b عددين حقيقيين بحيث a + b ≠ 0. يسمى المرجح للنقطتين A و B المعاملتين بـ a و b — ونرمزه G = bar{(A , a) , (B , b)} — النقطة الوحيدة التي تحقق العلاقة المتجهية:'},
{k:'math',x:'a\\,\\overrightarrow{GA}+b\\,\\overrightarrow{GB}=\\overrightarrow{0}'},
{k:'law',t:'الخاصية المركّبة (أداة البرهان الأم)',m:'\\forall M:\\;(a+b)\\overrightarrow{MG}=a\\,\\overrightarrow{MA}+b\\,\\overrightarrow{MB}',x:'صالحة لأي نقطة M من المستوي — هذا سر قوتها. اختر M بحكمة (نقطة من الشكل، أو إحدى النقط A أو B) لتستنتج كل شيء.'},
{k:'ex',t:'مثال محلول: تحديد موضع G',x:'G = bar{(A , 2) , (B , 3)}. من الخاصية المركّبة مع M = A:\n(2+3)AG→ = 2AA→ + 3AB→ = 3AB→ (لأن AA→ = 0→).\nإذن AG→ = (3/5)AB→ : النقطة G على القطعة [AB] وتحديدا عند 3/5 من المسافة من A نحو B (أقرب إلى B لأن وزنها أكبر).'},
{k:'law',t:'قاعدة الموضع على المستقيم',m:'\\overrightarrow{AG}=\\frac{b}{a+b}\\,\\overrightarrow{AB}',x:'المرجح ينتمي دائمًا إلى المستقيم (AB) — على القطعة [AB] إذا كان a و b بنفس الإشارة، وخارجها إذا كانت إشارتيهما مختلفتين. مثال خاص: G = bar{(A , 1) , (B , 1)} يعني AG→ = (1/2)AB→ أي G منصف [AB].'},
{k:'note',x:'حالة a + b = 0 (مثل bar{(A , 1) , (B , −1)}): لا يوجد مرجح (النقطة «في اللانهاية» — لا تخلطها بتناظر مركزي). أما إذا كان a + b ≠ 0 فالمرجح يوجد ويوجد واحد.'},
{k:'law',t:'خاصية المرشد (التجانس)',m:'G=\\text{bar}\\{(A,a),(B,b)\\}\\iff G=\\text{bar}\\{(A,\\lambda a),(B,\\lambda b)\\}',x:'بضرب المعاملتين في نفس العدد λ ≠ 0 لا يتغير المرجح. مثال: bar{(A , 2) , (B , 3)} = bar{(A , 4) , (B , 6)} = bar{(A , 2/5) , (B , 3/5)} — نستعملها لتبسيط الأرقام أو «جعل المجموع 1».'},
{k:'def',t:'تعريف — المرجح المتساوي (isobarycenter)',x:'إذا تساوت كل المعاملات نقول إن G مرجح متساوٍ: bar{(A , 1) , (B , 1)} = منصف [AB]، و bar{(A , 1) , (B , 1) , (C , 1)} = مركز ثقل المثلث (نقطة تقاطع المتوسطات).'},
{k:'ex',t:'مثال: كتلة مرفوعة بمعامل سالب',x:'G = bar{(A , 1) , (B , −2)}: المجموع 1 − 2 = −1 ≠ 0 إذن G موجود.\nمع M = A: (1 − 2)AG→ = −2AB→ أي −AG→ = −2AB→ أي AG→ = 2AB→.\nإذن G خارج القطعة وراء B بحيث BG→ = AB→ — المعامل السالب «يدفع» المرجح خارج القطعة.'},
{k:'h2',x:'3. مرجح ثلاث نقط'},
{k:'def',t:'تعريف — تعميم',x:'إذا كانت a₁ + a₂ + ... + aₙ ≠ 0 فإن المرجح G = bar{(A₁ , a₁) , ... , (Aₙ , aₙ)} هو النقطة الوحيدة التي تحقق: a₁GA₁→ + a₂GA₂→ + ... + aₙGAₙ→ = 0→، وله نفس الخاصية المركّبة لكل M.'},
{k:'law',t:'خاصية التجميعية (المرجح الجزئي)',m:'G=\\text{bar}\\{(A,a),(B,b),(C,c)\\}=\\text{bar}\\{(G_{1},\\,a+b)\\,,\\,(C,c)\\}\\quad\\text{where}\\quad G_{1}=\\text{bar}\\{(A,a),(B,b)\\}',x:'يمكن استبدال مجموعة نقط بمرجحها الجزئي مع معامل يساوي مجموع معاملاتها (بشرط أن يكون المجموع غير صفر). هذه الخاصية تحل «المسائل الطويلة» بتقسيمها: مثل G = bar{(A,2),(B,3),(C,5)} = bar{(G₁,5),(C,5)} حيث G₁ على [AB].'},
{k:'ex',t:'مثال محلول بالتفصيل',x:'G = bar{(A , 1) , (B , 2) , (C , 3)} في المستوي.\nالمرجح الجزئي: G₁ = bar{(A , 1) , (B , 2)} موجود على (AB) لأن 1 + 2 = 3 ≠ 0.\nإذن: G = bar{(G₁ , 3) , (C , 3)} وهو منصف [G₁C].\nهندسيًا: لإيجاد G عمليًا — أنشئ G₁ على (AB) ثم خذ منتصف [G₁C].'},
{k:'h2',x:'4. مرجح عدة نقط والتطبيقات'},
{k:'method',t:'توظيف المرجح في البرهان الهندسي',i:['الاستقامية: لتبرهن أن M ∈ (XY) اكتب M مرجحًا لـ X و Y.','التقاطع: لتبرهن أن مستقيمًا يمر بنقطة معينة، أثبت أن النقطة مرجح مشترك لتمثيلين مختلفين.','منصف/ثالث أوساط: استعمل المرجح المتساوي بدل الحسابات الطويلة.','خطوة ذهبية: حوّل كل معطيات المتجهات إلى علاقة مرجح (وزن لكل نقطة) ثم جمّع بالتجميعية.']},
{k:'ex',t:'مثال محلول: برهان تقاطع',x:'ABC مثلث، ليكن I منصف [BC] و G = bar{(A , 2) , (B , 1) , (C , 1)}.\nبالتجميعية على B و C: bar{(B , 1) , (C , 1)} = I (منصف [BC]).\nإذن G = bar{(A , 2) , (I , 2)} = منصف [AI].\nالخلاصة: G منتصف [AI] حيث I منتصف [BC] — وبدون أي حساب إحداثيات!'},
{k:'exer',n:'1',q:'ABC مثلث و G = bar{(A , 3) , (B , 1) , (C , 1)}. بيّن أن G ينتمي للوسيط الصادر من A، وحدد موضعه بدقة.',s:['نجمع (B , 1) و (C , 1) في المرجح الجزئي I = منصف [BC].','إذن G = bar{(A , 3) , (I , 2)}.','من الخاصية المركّبة مع M = A: (3+2)AG→ = 2AI→ أي AG→ = (2/5)AI→.','النتيجة: G على الوسيط [AI] على بعد 2/5 من A — وهو وصف مركز الثقل المعمم.']},
{k:'exer',n:'2',q:'النقط A و B و C مستقيمة بحيث C = bar{(A , 1) , (B , 2)} و D = bar{(A , 2) , (B , 1)}. قارن موضعي C و D على المستقيم.',s:['AC→ = (2/3)AB→ (لأن b/(a+b) = 2/3) — C بين A و B.','AD→ = (1/3)AB→ — D بين A و B أيضًا.','إذن D أقرب إلى A و C أقرب إلى B، والترتيب على المستقيم: A ، D ، C ، B.']},
{k:'exer',n:'3',q:'ABC مثلث و G = bar{(A , 1) , (B , 2) , (C , 1)}. بيّن أن G ينتمي إلى وسيط المثلث الصادر من B، وحدد موضعه عليه.',s:['نجمع A و C في مرجح جزئي: مجموع معاملاتهما 1 + 1 = 2 ≠ 0، و I = bar{(A , 1) , (C , 1)} منصف [AC] (وهو قاعدة الوسيط الصادر من B).','إذن G = bar{(B , 2) , (I , 2)} بفضل التجميعية.','مع M = B: (2+2)BG→ = 2BI→ أي BG→ = (1/2)BI→.','النتيجة: G منتصف الوسيط [BI] — إذن G ينتمي للوسيط الصادر من B ويقع على منتصفه.']},
{k:'warn',i:['نسيان شرط مجموع المعاملات ≠ 0 قبل الحديث عن المرجح.','الخلط بين AG→ = b/(a+b)·AB→ و GB→ = a/(a+b)·AB→ (المقام للطرف الآخر).','استعمال التجميعية مع مجموعة معاملاتها مجموعها صفر — لا يجوز.','الظن أن المرجح المتساوي لنقطتين هو «منتصف القطعة» فقط عند a = b = 1 — كل مرشد λ يعطي نفس النقطة (λ , λ).']},
{k:'sum',i:['المرجح G لنقط معاملاتها a و b: aGA→ + bGB→ = 0→ (شرط a + b ≠ 0).','الخاصية المركّبة صالحة لأي M — اختيار M الذكي يختصر البرهان.','المرجح الجزئي يستبدل مجموعة بنقطتها (بتجميع المعاملات) — خاصية التجميعية.','المعاملات المتساوية تعطي منصف/مركز ثقل؛ والمرجح دائمًا على المستقيم الحامل لنقطه إذا كانت نقطتين.']}
]});

{k:'law',t:'قاعدة عملية سريعة عند اللانهاية (دوال كسرية)',m:'\\deg(\\text{num})\\left\\{\\begin{array}{ll}<\\deg(\\text{den})&\\Rightarrow\\;\\text{lim}=0\\\\=\\deg(\\text{den})&\\Rightarrow\\;\\text{lim}=\\frac{a_{n}}{b_{n}}\\\\>\\deg(\\text{den})&\\Rightarrow\\;\\text{lim}=\\pm\\infty\\end{array}\\right.',x:'قارن درجة البسط بدرجة المقام عند +∞ أو −∞: أصغر → النهاية 0؛ مساوي → نسبة المعاملين الأعليين؛ أكبر → نهاية لانهائية إشارتها تُدرس حسب الأفراد والإشارات. هذه القاعدة تخبرك بالإجابة قبل الحساب — لكن في الفرض اكتب الحساب كاملًا.'},

{k:'law',t:'مبرهنة الحصر (الدركمي / gendarmes)',m:'g\\le f\\le h\\;,\\;\\lim g=\\lim h=L\\;\\Rightarrow\\;\\lim f=L',x:'إذا حُصرت f بين دالتين تتقاسمان نفس النهاية المنتهية L فإن نهاية f هي L أيضًا. أشهر استعمال: حصر sin و cos للحصول على نهايات تساوي 0.'},

{k:'ex',t:'مثال محلول: قيمة غير مرجعية',x:'احسب cos(75°).\n75 = 45 + 30: cos(75°) = cos(45° + 30°) = cos45 cos30 − sin45 sin30 = (√2/2)(√3/2) − (√2/2)(1/2) = (√6 − √2)/4 ≈ 0.2588.'},

{k:'method',t:'خطوات حل معادلة مثلثية',i:['أزل التداخل الجبري: اجعل المعادلة بالشكل cos x = cos α أو sin x = sin α (عبر صيغ الجمع/الدوبليك).','حدد الزاوية المرجعية α (استعن بالجدول المرجعي).','اكتب عائلتي الحلول بـ 2kπ مع k عدد صحيح.','إذا طُلب الحل في مجال محدد (مثل [0 , 2π]): عوّض قيم k الممكنة فقط واحتفظ بما يقع في المجال.']},

{k:'law',t:'خصائص التحاكي الهندسية',m:'M\'=H(O,k)(M)\\;\\Rightarrow\\;OM\'=|k|\\,OM',x:'التحاكي يحفظ الاستقامية (صورة ثلاث نقط مستقيمة مستقيمة)، ويحول كل مستقيم لا يمر بالمركز إلى مستقيم موازٍ له، ويضرب المسافات بـ |k| والزوايا بقيمتها المطلقة (حفظ قيس الزوايا غير الموجهة). مساحة الشكل الصورة = k² × مساحة الشكل الأصلي.'},
{k:'ex',t:'مثال محلول: صورة مثلث بالتحاكي',x:'H(A , 2) والت مثلث ABC حيث AB = 3 و AC = 4 و (BAC) = 90°.\nصورته: A′ = A (المركز صورة نفسه)، B′ على (AB) بحيث AB′ = 2×3 = 6، و C′ على (AC) بحيث AC′ = 8.\nالمثلث الصورة A′B′C′ مماثل للأصلي: زاوية A محفوظة (90°) والأضلاع تضاعفت، فمساحته 4 × مساحة ABC: من 6 إلى 24 وحدة مساحة.'},
{k:'exer',n:'1',q:'ليكن H(I , −2) حيث I(1 , 1). احسب صورة النقطة M(3 , 5).',s:['العلاقة: IM′→ = −2 IM→. لدينا IM→ = (3−1 , 5−1) = (2 , 4).','إذن IM′→ = (−4 , −8) ومنه M′ = I + (−4 , −8) = (−3 , −7).','تحقق: M′ على المستقيم (IM) في الجهة المقابلة والمسافة ضوعفت: |IM| = √20 و |IM′| = 2√20 ✓.']},
{k:'exer',n:'2',q:'بيّن أن صورة مستقيم (d) لا يمر بمركز التحاكي H(O , k) هي مستقيم موازٍ له.',s:['خذ نقطتين M و N من (d) وصورتيهما M′ و N′.','التحاكي: OM′→ = k OM→ و ON′→ = k ON→ فبالطرح: M′N′→ = k MN→.','إذن M′N′→ = k MN→ يعني (M′N′) ∥ (MN) أي الصورة موازية للأصل.']},
{k:'exer',n:'3',q:'ABC مثلث و G مركز ثقله و M منتصف [BC]. بيّن أن صورة G بالتحاكي H(A , −1/2) نقطة من المستقيم (AM)، وحدد موضعها بدقة.',s:['مركز الثقل يحقق: GA→ + GB→ + GC→ = 0→، ومنه: AG→ = (1/3)(AB→ + AC→).','صورة G بالتحاكي H(A , −1/2) هي النقطة G′ المحققة: AG′→ = −(1/2)AG→ = −(1/6)(AB→ + AC→).','لكن AM→ = (1/2)(AB→ + AC→) (علاقة منتصف الضلع)، إذن AG′→ = −(1/3)AM→.','النتيجة: G′ تنتمي إلى حامل الوسيط (AM) وتقع وراء A على المسافة |AG′| = (1/3)|AM| — صورة أنيقة تربط التحاكي بمركز الثقل.']},
{k:'h2',x:'6. صور المستقيمات والدوائر بالتحاكي — «ماذا يحدث للأشكال؟»'},
{k:'p',x:'حتى الآن حسبنا صور نقط. لكن الهندسة أجمل ما تكون حين نتابع صور الأشكال الكاملة: مستقيمات، دوائر، مثلثات — والتحاكي يجيب بخصائص مذهلة البساطة.'},
{k:'tbl',h:['الشكل الأصلي','صورته بالتحاكي H(O , k)'],r:[

{k:'svg',x:'<svg viewBox="0 0 340 175" width="340"><circle cx="55" cy="130" r="6" class="pt"/><text x="42" y="124">O</text><path class="aux" d="M55 130 L310 40" /><path class="aux" d="M55 130 L300 160" /><path class="cv" d="M145 103 L150 137"/><path class="sol" d="M235 76 L245 160"/><circle cx="145" cy="103" r="4" class="pt2"/><circle cx="150" cy="137" r="4" class="pt2"/><circle cx="235" cy="76" r="4" class="pt"/><circle cx="245" cy="160" r="4" class="pt"/><text x="126" y="97">A</text><text x="128" y="150">B</text><text x="244" y="68">A′</text><text x="252" y="158">B′</text></svg>',cap:'H(O , 2): كل نقطة تنطلق على شعاعها من O وتتضاعف مسافتها — فالمثلث الصغير يتحول إلى شكله الأكبر موازي الأضلاع'},
{k:'law',t:'الخاصية المركزية للأطوال والمساحات',m:'A\'B\'=|k|\\cdot AB\\;\\;\\;;\\;\\;\\text{area}(S\')=k^{2}\\cdot\\text{area}(S)',x:'المسافات تُضرب بـ |k| والمساحات بـ k² — أما الزوايا فتُحفظ كما هي: التحاكي يحفظ الشكل (تشابه).'},
{k:'ex',t:'مثال: صورة دائرة',x:'لتكن C دائرة مركزها I(3 , −2) ونصف قطرها R=4، و H(O , −2).\\n(1) صورة المركز: I′=H(I) بمعادلة OI′→=−2×OI→=(−6 , 4) إذن I′(−6 , 4).\\n(2) نصف قطر الصورة: |−2|×4=8.\\n(3) الخلاصة: الصورة دائرة مركزها I′(−6 , 4) ونصف قطرها 8 — مع k سالب تقع الصورة على الجهة المقابلة للمركز.'},
{k:'h2',x:'7. منهجية إنشاء صورة شكل بالمرسام'},
{k:'method',t:'خطوات البناء النظيف',i:['ارسم الشكل الأصلي والمركز O بوضوح.','ارسم شعاعًا من O عبر كل نقطة أساسية (رؤوس الشكل).','على كل شعاع ضع الصورة بمسافة OM′=|k|×OM (مع مراعاة جهة k).','اربط صور النقط بنفس ترتيب الأصل: شكل الصورة جاهز.','تحقق: الأضلاع المتناظرة متوازية، والنسب كلها تساوي |k|.']},
{k:'note',t:'لماذا ينجح هذا دائمًا؟',x:'كل ما يفعله التحاكي هو «تضخيم أو تقليص» العالم انطلاقًا من O — فلا غرابة أن تبقى الزوايا كما هي والأضلاع متوازية: هذا هو جوهر التشابه الذي يُبنى عليه تصميم الخرائط والصور بالحاسوب.'},
{k:'warn',i:['نسيان أن مركز التحاكي صورة نفسه دائمًا.','الخلط بين k و |k| في المسافات: المسافة تضرب بـ |k| وليس بـ k.','الظن أن التحاكي يحفظ المسافات — لا! المماثلة فقط تحفظها (|k| = 1).','استعمال معادلة دوران بزاوية خطأ الإشارة (منحى مباشر موجب).','تجاهل أن التناظر المحوري يعكس منحى الزوايا الموجهة (لا يحفظ الموجه).']},
{k:'sum',i:['تحويلة نقطية = تطبيق المستوي في نفسه؛ ندرس: انسحاب، تناظران، دوران، تحاكي.','الانسحاب: MM′→ = u — انزلاق صلب لا يغير شيئًا في الشكل.','الدوران والتناظران مماثلات: حفظ المسافات والزوايا والاستقامية.','التحاكي H(O , k): OM′→ = k·OM→ — يحفظ الاستقامية والتوازي ويضرب المسافات بـ|k| والمساحات بـ k².','تراكب التحولات: S_I = H(I , −1) و R(O , π) = S_O — قصابات ذهبية في الامتحان.']}
]});

CH_MATH.push({id:'ma9',title:'الجداء السلمي',icon:'🎯',sem:2,
