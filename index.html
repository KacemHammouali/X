{k:'note',x:'المستقيمان «المتخالفان» لا وجود لهما في المستوي — هما جوهر الفضاء: لا يتقاطعان رغم أنهما غير متوازيين (مثل حرفي المكعب المتعارضين).'},
{k:'h2',x:'2. التوازي في الفضاء'},
{k:'law',t:'قوانين التوازي المفصلية',m:'d\\parallel d\'\\subset P\\;\\Rightarrow\\;d\\parallel P',x:'معناها: إذا كان مستقيم d موازيًا لمستقيم آخر محتوى في مستوي P فإن d موازٍ للمستوي P (إذا لم يكن محتوى فيه). قانون تكميلي: مستويان متوازيان يقطعهما كل مستقيم غير موازٍ لهما في مستقيمين متوازيين — أساس «مبرهنة الثقوب» في مقاطع المجسمات.'},
{k:'law',t:'النقطة المرجعية (through a point)',m:'M\\notin P\\;\\Rightarrow\\;\\exists!\\,P\'\\;:\\;M\\in P\',\\;P\'\\parallel P',x:'عبر كل نقطة خارج مستوي يمر مستوي وحيد موازٍ له. هذه الوجازة أساس تقنيات إنشاء المقاطع: لرسم مستويًا موازيًا لوجه مرسوم، مرره عبر نقطة معروفة واستعمل التوازي على الوجوه.'},
{k:'h2',x:'3. التعامد في الفضاء'},
{k:'def',t:'تعريف — مستقيم عمودي على مستوي',x:'نقول إن المستقيم Δ عمودي على المستوي P إذا كان عموديًا على كل مستقيم محتوى في P. يكفي — وهذا مضمون النظرية الآتية — أن يكون عموديًا على مستقيمين متقاطعين من P.'},
{k:'law',t:'نظرية المستقيمين المتقاطعين',m:'d\\perp d_{1}\\;,\\;d\\perp d_{2}\\;,\\;d_{1}\\cap d_{2}\\neq\\varnothing\\;\\Rightarrow\\;d\\perp P',x:'حيث d₁ و d₂ مستقيمان متقاطعان من المستوي P. عمليًا: للبرهان أن Δ ⊥ P، ابرهن أن Δ ⊥ لمستقيمين متقاطعين محتويين فيه — لا حاجة لكل المستقيمات.'},
{k:'def',t:'تعريف — الإسقاط العمودي والمسافة',x:'الإسقاط العمودي للنقطة M على المستوي P هو النقطة H التي يقطع فيها المستقيم العمودي على P المار بـ M المستوي P. المسافة من M إلى P هي MH — أصغر مسافة من M إلى أي نقطة من P.'},
{k:'ex',t:'مثال محلول: تعامد في مكعب',x:'مكعب ABCD.EFGH (وجه سفلي ABCD وعلوي EFGH).\nنبرهن أن (AE) ⊥ (ABCD)? معلوم أن AE عمودي على الوجه: في المكعب، (AE) ⊥ (AB) و (AE) ⊥ (AD) (لأن كل حرف عمودي على الوجه الذي يرتكز عليه).\nو (AB) و (AD) مستقيمان متقاطعان من المستوي (ABCD)، إذن بالنظرية: (AE) ⊥ (ABCD) ∎. النتيجة: كل حرف عمودي في المكعب عمودي على الوجهين اللذين يجمعهما حرفان متقاطعان.'},
{k:'h2',x:'4. التأطير في الفضاء — «عنوان كل نقطة بثلاث أعداد»'},
{k:'p',x:'في المستوي يكفي عددان لتحديد موقع نقطة. في الفضاء الورقة لا تكفي: نحتاج ثلاثة أعداد (x , y , z) — ثلاث صور متعامدة للموقع. المعلم المكاني (O ; i→ , j→ , k→) هو بوصلة الفضاء.'},
{k:'def',t:'المعلم الفضائي وإحداثيات نقطة',x:'المعلم (O ; i→ , j→ ; k→) ثلاثة متجهات وحدية متعامدة مثنى مثنى. كل نقطة M تقبل كتابة فريدة: OM→=x·i→+y·j→+z·k→ ونكتب M(x , y , z).'},
{k:'law',t:'من النقط إلى الشعاع (المركبات في الفضاء)',m:'\\overrightarrow{AB}=\\left(x_{B}-x_{A}\\;,\\;y_{B}-y_{A}\\;,\\;z_{B}-z_{A}\\right)',x:'نطرح إحداثيات البداية من النهاية — نفس قاعدة المستوي مع مركبة ثالثة تضاف.'},
{k:'svg',x:'<svg viewBox="0 0 340 200" width="340"><path class="ax" d="M90 160 H330"/><path class="ax" d="M330 160 l-10 -5 m10 5 l-10 5"/><path class="ax" d="M90 160 L30 185"/><path class="ax" d="M90 160 V30"/><path class="ax" d="M90 30 l-5 10 m5 -10 l5 10"/><circle cx="240" cy="70" r="5" class="pt"/><path class="aux" d="M240 70 V160"/><path class="aux" d="M240 160 H90"/><path class="aux" d="M240 70 L180 100"/><path class="aux" d="M180 100 V160"/><text x="248" y="62">M(x , y , z)</text><text x="300" y="150">z</text><text x="316" y="175">y</text><text x="18" y="180">x</text><text x="252" y="120">x</text><text x="150" y="175">y</text><text x="168" y="92">z</text></svg>',cap:'المسقط: من M ننزل عموديًا، ثم نتتبع المسارات الموازية للمحاور — الأطوال الثلاثة المقروءة هي الإحداثيات (x , y , z)'},
{k:'ex',t:'أول حساب فضائي',x:'A(1 , 2 , 3) و B(4 , 6 , 3).\\n(1) AB→=(4−1 , 6−2 , 3−3)=(3 , 4 , 0).\\n(2) المسافة: |AB→|=√(3²+4²+0²)=√25=5.\\n(3) منتصف [AB]: I((1+4)/2 , (2+6)/2 , (3+3)/2)=(2,5 , 4 , 3).\\nلاحظ: كل قاعدة من المستوي انتقلت إلى الفضاء بإضافة مركبة ثالثة فقط!'},
{k:'h2',x:'5. الحساب على الإحداثيات في الفضاء'},
{k:'tbl',h:['المفهوم','في المستوي','في الفضاء (إضافة مركبة ثالثة)'],r:[
['المسافة بين نقطتين','√((Δx)²+(Δy)²)','√((Δx)²+(Δy)²+(Δz)²)'],
['الجداء السلمي','xx′+yy′','xx′+yy′+zz′'],
['التوازي','u→=k·v→ (تناسب المركبتين)','u→=k·v→ (تناسب المركبات الثلاث)'],
['التعامد','u→·v→=0','u→·v→=0 (نفس الشرط بالجداء الفضائي)']]},
{k:'law',t:'الجداء السلمي الفضائي وتعامد المستقيمات',m:'\\vec{u}\\cdot\\vec{v}=xx\' + yy\' + zz\'\\;\\;\\;\\vec{u}\\perp\\vec{v}\\iff\\vec{u}\\cdot\\vec{v}=0',x:'التعريف نفسه مع مركبة ثالثة: تعامد شعاعين فضائيين يُبرهن بانعدام جدائهما — أداة أساسية لإثبات أن مستقيمًا عموديًا على آخر في الفضاء.'},
{k:'ex',t:'توازٍ وتعامد بالجداء',x:'u→(1 , 2 , 2) و v→(2 , −1 , 0) و w→(2 , 4 , 4).\\n(1) التعامد: u→·v→=1×2+2×(−1)+2×0=0 إذن u→ عمودي على v→.\\n(2) التوازي: w→=2×u→ (المركبات الثلاث تتضاعف) إذن w→ مرتبط خطيًا بـ u→.\\n(3) طول u→: |u→|=√(1+4+4)=3 — أطوال فيثاغورية شهيرة (3 , 4 , 5 من عائلتها)!'},
{k:'h2',x:'6. التمثيل الوسيطي — «عنوان كل نقطة على مستقيم»'},
{k:'def',t:'التمثيل الوسيطي لمستقيم',x:'إذا كان A نقطة و u→ شعاع غير معدوم، فكل نقطة من المستقيم (AB) تكتب بشكل فريد: OM→=OA→+t·u→ حيث t عدد حقيقي يُسمى المعامل الوسيطي — كل قيمة t تعطي نقطة وكل نقطة لها t واحد.'},
{k:'law',t:'المعادلة الوسيطية',m:'M(x\\,,\\,y\\,,\\,z)\\in(AB)\\iff\\exists\\,t\\in\\mathbb{R}:\\;\\overrightarrow{AM}=t\\,\\overrightarrow{AB}',x:'تنسحب إلى الإحداثيات: x=x_A+t(x_B−x_A) ، y=y_A+t(y_B−y_A) ، z=z_A+t(z_B−z_A) — ثلاث معادلات ووسيط واحد.'},
{k:'tbl',h:['مجال المعامل t','مجموعة النقط'],r:[
['t∈ℝ','كل المستقيم (AB)'],
['t∈[0 , 1]','القطعة [AB] فقط'],
['t=1/2','منتصف القطعة [AB]'],
['t∈[1 , +∞)','نصف المستقيم بعد B']]},
{k:'ex',t:'انتماء نقطة إلى مستقيم',x:'A(1 , 0 , 2) و B(3 , 2 , 4) و M(5 , 4 , 6). هل M من المستقيم (AB)?\\n(1) AB→=(2 , 2 , 2) و AM→=(4 , 4 , 4).\\n(2) نلاحظ AM→=2×AB→: المركبات الثلاث تتضاعف بالمعامل نفسه t=2.\\n(3) الخلاصة: M∈(AB) لأن AM→=2·AB→ — ولو اختلف المعامل بين المركبات لرفضنا الانتماء.'},
{k:'warn',t:'شرط الانتماء الصارم',x:['انتماء M إلى المستقيم يتطلب معاملًا واحدًا t يعمل للمركبات الثلاث معًا — معامل مختلف لكل مركبة = النقطة خارج المستقيم.','الشعاع الموجه u→ يجب أن يكون غير معدوم، وإلا «المستقيم» يتقلص إلى نقطة.']},
{k:'h2',x:'7. مقاطع المجسمات بمستويات'},
{k:'method',t:'تقنية رسم مقطع مستوي لمجسم',i:['ابدأ من نقطتي تقاطع معروفتين على وجه واحد وارسم القطعة (أثر المستوي على الوجه).','مدد الأثر إلى حرف الوجه المشترك مع الوجه المجاور لتحصل على نقطة على الحرف.','انقل العمل من وجه إلى وجه: كل وجه يحمل أثرًا (قطعة أو خيط ممتد).','استعمل التوازي: إذا كان المقطع موازيًا لوجه (مثل مستو مقاطع مكعب بوجه سفلي)، فأثره على كل الوجوه المتوازية متوازٍ.']},
{k:'ex',t:'مثال محلول: مقطع مكعب بمستوي عبر ثلاث نقط في منتصفات أحرف',x:'مكعب ABCD.EFGH (ABCD الوجه السفلي و EFGH العلوي). النقط: M منتصف [AE]، N منتصف [BF]، K منتصف [CG].\n(1) M و N تقعان على الوجه الأمامي (ABFE): أثر المستوي عليه هو القطعة [MN].\n(2) N و K تقعان على الوجه الأيمن (BCGF): الأثر هو القطعة [NK].\n(3) الوجه الخلفي (CDHG) مقابل للأمامي: الأثر عليه موازٍ لـ[MN]، يمر بـ K ويقطع [DH] في النقطة P.\n(4) الوجه الأيسر (ADHE): الأثر فيه يوازي [NK] ويربط M بـ P.\nالنتيجة: المقطع هو المضلع MNKPM — خماسي المنتصفات الشهير. المفتاح: في كل وجه، الأثر قطعة تصل بين نقطتين معلومتين أو موازية لأثر وجه مقابل.'},
{k:'exer',n:'1',q:'هرم منتظم رباعي الأوجه S.ABCD قاعدته مربع مركزه O وارتفاعه SO. بيّن أن (SO) ⊥ (ABCD) واستنتج تساوي أحرفه الجانبية.',s:['في الهرم المنتظم: SO ⊥ (AC) و SO ⊥ (BD) لأن SO ارتفاع الهرم أي عمودي على مستوي القاعدة — إذن عمودي على كل مستقيم فيه، وخاصة القطران.','(AC) و (BD) مستقيمان متقاطعان في O ومن نظرية المستقيمين المتقاطعين: (SO) ⊥ (ABCD).','الأحرف الجانبية: SA = √(SO² + OA²) = SB = SC = SD لأن OA = OB = OC = OD (نصف قطر المربع) — إذن الأحرف متساوية ✓.']},
{k:'exer',n:'2',q:'مكعب طول حرفه a = 4 cm ورؤوسه A(0 , 0 , 0) ، B ، C ، D في الأسفل و E ، F ، G ، H فوقها (G(4 , 4 , 4)). احسب طول القطر AG ثم المسافة من A إلى مركز الوجه العلوي EFGH.',s:['AG→ = (4 , 4 ، 4) إذن AG = √(16+16+16) = 4√3 ≈ 6.93 cm.','مركز الوجه العلوي T(2 , 2 ، 4): AT→ = (2 , 2 ، 4).','AT = √(4+4+16) = √24 = 2√6 ≈ 4.90 cm.']},
{k:'exer',n:'3',q:'مستويان متوازيان P و P′ يقطعهما ثلاثة مستقيمات متوازية. أثبت أن أطوال المقاطع المحصورة بينهما (بين نقطتي التقاطع على كل مستقيم) متساوية.',s:['كل مستقيم يقطع P في نقطة و P′ في نقطة أخرى، والقطعة المحصورة بين المستويين المتوازيين تسمى «سماكة» المستقيم.','المستقيمات المتوازية والقطع المتوازية بين مستويين متوازيين تحدد أزواج مستطيلات (أوجه متوازية أضلاعها المقابلة متوازية ومتساوية).','إذن القطع الثلاث متساوية — وهي «المسافة بين المستويين» مفهومًا: كل قطعة عمودية بينهما تمثل السماكة (والأقطاب غير العمودية أطول لكن المتوازية متساوية).']},
{k:'warn',i:['الظن أن مستقيمين لا يتقاطعان موازيان — في الفضاء قد يكونان متخالفين!','الاستدلال على تعامد Δ ⊥ P بمستقيم واحد منه — يلزم مستقيمان متقاطعان.','نسيان شرط تقاطع المستقيمين في نظرية التعامد (مستقيمان متوازيان لا يكفيان).','خلط مسافة نقطة عن مستوي بمسافتها عن نقطة منه — المسافة تتحقق بالإسقاط العمودي.','رسم مقاطع المجسمات «بالتخمين» دون تتبع الأثر على كل وجه.']},
{k:'sum',i:['الوضعيات النسبية: احفظ الجدول — خاصة مفهوم المستقيمين المتخالفين.','التوازي: موازاة مستقيم لمستوي تبرهن عبر مستقيم محتوى موازٍ؛ والمستويان الموازيان يولدان مستقيمات مقاطع متوازية.','التعامد: مستقيمان متقاطعان من المستوي يكفيان؛ والإسقاط العمودي يعطي المسافة.','المقاطع: تتبع الأثر وجهًا وجهًا مع استثمار التوازي بين الوجوه المتقابلة.']}
]});
</script>
<script>
CH_PHYS.push({id:'ph1',title:'مقاربة كيفية لانتقال الطاقة في جملة وانحفاظها',icon:'🔋',sem:1,
desc:'مفهوم الجملة، أشكال الطاقة وتحولاتها، الطاقة الداخلية، ومبدأ انحفاظ الطاقة الكلية.',
keys:['جملة','طاقة','تحولات','انحفاظ','طاقة داخلية','مصادر'],
obj:'تحدد جملة فيزيائية وحدودها، تفرق أشكال الطاقة (حركية، كامنة، داخلية)، تصف التحويلات والتبادلات، وتطبق مبدأ انحفاظ الطاقة في وضعيات بسيطة.',
take:['الجملة = ما نختار دراسته؛ تحديد حدودها يسبق كل حصيلة طاقوية.','الطاقة تتحول من شكل لآخر لكن مجموعها في جملة معزولة يبقى ثابتًا.','Ec و Ep طاقتان ميكانيكيتان؛ الاحتكاك يحول الطاقة الميكانيكية إلى طاقة داخلية (تسخين).','انحفاظ الطاقة الميكانيكية مشروط بغياب الاحتكاك (القوى المحافظة فقط).'],
sections:[
{k:'h2',x:'1. مفهوم الجملة الفيزيائية'},
{k:'def',t:'تعريف — الجملة',x:'الجملة هي الجزء من العالم المادي الذي نختار دراسته: جسم، مجموعة أجسام، أو كمية من المادة. كل ما عداها يسمى المحيط. تحديد الجملة وحدودها قرار منهجي أول: نفس الظاهرة تعطي حصائل مختلفة حسب الجملة المختارة.'},
{k:'ex',t:'مثال: كيف يغير اختيار الجملة الحصيلة',x:'كرة تسقط من ارتفاع: إذا كانت الجملة «الكرة وحدها» فإنها تتبادل طاقة مع المحيط (الأرض عبر الثقالة). أما إذا كانت الجملة «الكرة + الأرض» فطاقة الثقالة الكامنة ملك للجملة كلها — وهذا هو الأسلوب العملي في حساب Epp = mgz.'},
{k:'h2',x:'2. أشكال الطاقة وتحولاتها'},
{k:'svg',x:'<svg viewBox="0 0 340 150" width="340"><rect x="15" y="45" width="90" height="52" rx="10" class="shape"/><text x="60" y="68" text-anchor="middle">مصدر الطاقة</text><text x="60" y="86" text-anchor="middle">E الكلية</text><path class="ax" d="M115 71 H150"/><path class="ax" d="M150 71 l-11 -6 m11 6 l-11 6"/><rect x="158" y="20" width="80" height="34" rx="8" class="shape2"/><text x="198" y="41" text-anchor="middle">حركية</text><rect x="158" y="62" width="80" height="34" rx="8" class="shape2"/><text x="198" y="83" text-anchor="middle">وضع</text><rect x="158" y="104" width="80" height="34" rx="8" class="shape2"/><text x="198" y="125" text-anchor="middle">داخلية</text><path class="aux" d="M250 37 H285"/><path class="ax" d="M285 37 l-10 -5 m10 5 l-10 5"/><path class="aux" d="M250 79 H285"/><path class="ax" d="M285 79 l-10 -5 m10 5 l-10 5"/><path class="aux" d="M250 121 H285"/><path class="ax" d="M285 121 l-10 -5 m10 5 l-10 5"/><text x="315" y="83" text-anchor="middle">تحولات</text></svg>',cap:'الطاقة تتخذ أشكالًا عدة وتتحول بينها دون أن تفنى'},
{k:'tbl',h:['الشكل','رمز/علاقة','مثال'],r:[
['طاقة حركية','Ec = ½mv²','سيارة متحركة، كرة تدور'],
['طاقة كامنة ثقالية','Epp = mgz','ماء خلف سد، صخرة على هضبة'],
['طاقة كامنة مرونية','Epe = ½kx²','نابض مشدود، قوس مشدود'],
['طاقة داخلية','U (تسخين، تغير حالة)','ماء يغلي، احتكاك المكابح'],
['طاقة كيميائية','مخزنة في الروابط','بطارية، وقود، طعام'],
['طاقة إشعاعية/ضوئية','تنقلها الأمواج','الشمس، مصباح']]},
{k:'law',t:'الطاقة الميكانيكية',m:'E_{m}=E_{c}+E_{pp}+E_{pe}',x:'الطاقة الميكانيكية للجملة هي مجموع طاقاتها الحركية والكامنة (الثقالية والمرونية). وحدة الطاقة في النظام الدولي هي الجول (J).'},
{k:'h2',x:'3. مبدأ انحفاظ الطاقة'},
{k:'law',t:'مبدأ الانحفاظ',m:'E_{\\text{total}}=\\text{const}\\qquad(\\text{isolated system})',x:'في جملة معزولة (لا تتبادل طاقة مع المحيط) يبقى مجموع كل أشكال الطاقة ثابتًا: الطاقة لا تفنى ولا تُستحدث، بل تتحول من شكل إلى آخر. هذا قانون عام فيزيائي مصان في كل الظواهر.'},
{k:'p',x:'في الجملات غير المعزولة: الطاقة المفقودة من الجملة تنتقل إلى المحيط (أو العكس)، وهذا ما يجعل «الحصيلة الطاقوية» أداة قياس: نقيس ما دخل وخرج لنعرف ما تحول داخل الجملة.'},
{k:'ex',t:'مثال محلول: الأرجوحة (بندول)',x:'كرة كتلتها 0.2 kg تُطلق من ارتفاع 0.5 m فوق أدنى نقطة مسارها (بدون احتكاك، g = 10 N/kg).\nفي الأعلى: Epp = mgh = 0.2×10×0.5 = 1 J و Ec = 0.\nبمبدأ الانحفاظ (بدون احتكاك): Em ثابتة، إذن عند أدنى نقطة: Ec = 1 J أي ½×0.2×v² = 1 ومنه v = √10 ≈ 3.16 m/s.\nمع احتكاك الهواء: جزء من Em يتحول إلى طاقة داخلية (تسخين) والكرة لا تعود أبدًا إلى ارتفاعها الأول.'},
{k:'exer',n:'1',q:'راجل يتزحلق على منحدر أملس: من ارتفاع 4 m ينطلق من السكون (g = 10). ما سرعته عند الأسفل؟',s:['بدون احتكاك: الطاقة الميكانيكية محفوظة: mgh = ½mv².','الكتلة تختزل: v = √(2gh) = √(2×10×4) = √80 ≈ 8.94 m/s.','لاحظ قوة النتيجة: السرعة النهائية لا تتعلق بالكتلة ولا بشكل المنحدر، فقط بالارتفاع (في غياب الاحتكاك).']},
{k:'exer',n:'2',q:'مكابح سيارة: من سرعة 20 m/s إلى التوقف الكامل، كتلة السيارة 1000 kg. ما الطاقة المتحولة؟ وإلى أي شكل؟',s:['Ec الابتدائية = ½×1000×400 = 200 kJ والنهائية صفر.','الطاقة المتحولة = 200 kJ تتحول بالاحتكاك إلى طاقة داخلية: تسخين الأقراص والمحيط (حرارة).','هذا هو دور المكابح: ليست «تلغي» الطاقة بل تحولها من حركية إلى داخلية.']},
{k:'warn',i:['القول إن الاحتكاك «يهدر» الطاقة — الاحتكاك يحولها إلى طاقة داخلية، والطاقة الكلية محفوظة دائمًا.','خلط الطاقة الميكانيكية بالطاقة الكلية: Em ليست محفوظة مع الاحتكاك بينما الطاقة الكلية محفوظة.','نسيان اختيار مستوى مرجعي لـ Epp قبل أي حساب (قيمة Epp تتعلق به أما «فرقها» فلا).']},
{k:'sum',i:['حدد الجملة وحدودها أولًا، والمحيط ثانيًا.','أشكال الطاقة ستة أساسية: حركية، كامنة (ثقالية/مرونية)، داخلية، كيميائية، إشعاعية.','Em = Ec + Ep؛ والطاقة الكلية = Em + الطاقات غير الميكانيكية.','الجملة المعزولة: طاقتها الكلية ثابتة — قانون الانحفاظ.','الاحتكاك: محول من الميكانيكية إلى الداخلية (لا إهلاك).']}
]});

CH_PHYS.push({id:'ph2',title:'العمل والطاقة الحركية — الحركة الانسحابية',icon:'⚙️',sem:1,
desc:'عمل قوة ثابتة في حركة انسحابية، الطاقة الحركية، مبرهنة الطاقة الحركية وتطبيقاتها.',
keys:['عمل','قوة','طاقة حركية','مبرهنة','انسحابية','جول','محرك','مقاوم'],
obj:'تحسب عمل قوة ثابتة خلال انتقال، تحدد نوع العمل (محرك/مقاوم/عدمي)، تحسب الطاقة الحركية، وتطبق مبرهنة الطاقة الحركية في وضعيات انسحابية.',
take:['W = F·AB·cos(α): إشارة العمل تأتي من cos(α).','العمل المحرك (موجب) يزيد Ec، والمقاوم (سالب) ينقصها، والعمودي لا يعمل شيئًا.','Ec = ½mv² بالجول (m بالكيلوغرام و v بالمتر/ثانية).','ΔEc = ΣW: تغير الطاقة الحركية يساوي مجموع أعمال كل القوى الخارجية.'],
sections:[
{k:'h2',x:'1. عمل قوة ثابتة'},
{k:'svg',x:'<svg viewBox="0 0 340 150" width="340"><path class="ax" d="M20 118 H320"/><rect x="80" y="78" width="60" height="40" rx="6" class="shape"/><text x="110" y="102" text-anchor="middle">جسم</text><path class="ax" d="M140 98 H250"/><path class="ax" d="M250 98 l-12 -6 m12 6 l-12 6"/><text x="190" y="86">d</text><path class="cv" d="M140 98 L68 36"/><path class="ax" d="M68 36 l14 2 m-14 -2 l6 13"/><text x="56" y="30">F</text><path class="aux" d="M108 79 A24 24 0 0 1 122 90" stroke-dasharray="3 3"/><text x="102" y="68">α</text><text x="165" y="138">المسار</text></svg>',cap:'عمل القوة: W = F·d·cos(α) — المهم هو مركبة القوة على اتجاه الحركة'},
{k:'def',t:'تعريف — عمل قوة ثابتة',x:'إذا أثرت قوة ثابتة F→ على نقطة مادية انتقلت من A إلى B بمسافة AB على مستقيم، فإن عمل هذه القوة هو الكمية الجبرية:'},
{k:'math',x:'W_{A\\to B}(\\vec F)=F\\times AB\\times\\cos\\alpha'},
{k:'p',x:'حيث α الزاوية بين اتجاه القوة واتجاه الحركة. العمل كمية جبرية: موجب إذا كانت القوة تساعد الحركة، سالب إذا تعاكسها.'},
{k:'tbl',h:['قيمة الزاوية α','cos α','نوع العمل','مثال'],r:[
['0°','1','محرك (أقصى)','قوة سحب في اتجاه الحركة'],
['زاوية حادة (مثل 60°)','بين 0 و 1','محرك','قوة شد نحو الأمام والأعلى'],
['90°','0','عدمي (منعدم)','رد فعل سطح أفقي، القوة الناظمية'],
['زاوية منفرجة (مثل 120°)','بين −1 و 0','مقاوم','الاحتكاك، قوة الهواء'],
['180°','−1','مقاوم (أقصى)','قوة الفرامل المعاكسة تمامًا']]},
{k:'law',t:'وحدات ونواتج',m:'1\\,J=1\\,N\\cdot m\\qquad\\qquad 1\\,kJ=10^{3}\\,J',x:'العمل والطاقة بنفس الوحدة: الجول. اضرب دائمًا بالوحدات الدولية: N و m (ولا تخلط مع kg و km في التمارين).'},
{k:'h2',x:'2. الطاقة الحركية'},
{k:'law',t:'الطاقة الحركية لجسم في حركة انسحابية',m:'E_{c}=\\tfrac{1}{2}\\,m\\,v^{2}',x:'حيث m الكتلة بالكيلوغرام و v السرعة المطلقة (سرعة مركز العطالة) بالمتر في الثانية. الطاقة الحركية عدد موجب دائمًا (مربع السرعة).'},
{k:'note',x:'الطاقة الحركية تتضاعف أربع مرات إذا تضاعفت السرعة (لأن v مربعة) — هذه هي قوة «مربّع السرعة» في أخطار السرعة: فرملة سيارة عند 120 km/h تتطلب مسافة فرملة أطول بكثير من 60 km/h (أربع مرات تقريبًا نفس الظروف).'},
{k:'h2',x:'3. مبرهنة الطاقة الحركية'},
{k:'law',t:'الصيغة الأم',m:'\\Delta E_{c}=E_{c}(B)-E_{c}(A)=\\sum W_{A\\to B}(\\vec F_{\\text{ext}})',x:'في انتقال من A إلى B: تغير الطاقة الحركية يساوي مجموع أعمال كل القوى الخارجية المؤثرة على الجملة (بالجبر: المحرك موجب والمقاوم سالب). إذا كان المجموع صفرًا فالسرعة المطلقة لم تتغير.'},
{k:'method',t:'خطوات حل تمرين بالمبرهنة',i:['حدد الجملة والمرجع، وارسم مخطط القوى الخارجية (الثقل، الرد، الاحتكاك، الشد...).','اكتب مجموع الأعمال قوة بقوة مع نوع كل عمل (α لكل قوة).','احسب Ec في الوضع الابتدائي والنهائي.','طبق ΔEc = ΣW وعوض بما هو معلوم لاستخراج المجهول (سرعة، مسافة، قوة احتكاك...).']},
{k:'ex',t:'مثال محلول بالتفصيل',x:'جسم كتلته 2 kg يتحرك أفقيا بسرعة 3 m/s تحت تأثير قوة محرك ثابتة أفقية F = 4 N على مسافة 10 m، مع قوة احتكاك f = 1 N معاكسة للحركة.\n(1) أعمال القوى: W(F) = 4×10×cos(0°) = 40 J (محرك). W(f) = 1×10×cos(180°) = −10 J (مقاوم). الثقل والرد عموديان: عملهما صفري.\n(2) المجموع: ΣW = 40 − 10 = 30 J.\n(3) مبرهنة الطاقة الحركية: ½×2×v² − ½×2×3² = 30 أي v² − 9 = 30 إذن v² = 39 و v ≈ 6.24 m/s.'},
{k:'ex',t:'مثال ثانٍ: مسافة الفرملة',x:'سيارة كتلتها 1000 kg بسرعة 20 m/s على مسار أفقي، تفرمل بقوة كلية ثابتة F = 5000 N معاكسة للحركة. ما مسافة الفرملة d؟\nΔEc = 0 − ½×1000×400 = −200000 J.\nΣW = −F×d (عمل مقاوم) = −5000×d.\nالمبرهنة: −200000 = −5000d ومنه d = 40 m.'},
{k:'exer',n:'1',q:'جسم كتلته 0.5 kg يسقط سقوطا حرا من ارتفاع 20 m (g = 10). احسب سرعته عند الوصول بطريقتين.',s:['الطريقة 1 (مبرهنة Ec): عمل الثقل محرك: W = mgh = 0.5×10×20 = 100 J = ΔEc = ½×0.5×v² أي v² = 400 ومنه v = 20 m/s.','الطريقة 2 (انحفاظ Em): mgh = ½mv² تعطي v = √(2gh) = √400 = 20 m/s ✓.','الطريقتان تتطابقان لأن الثقل قوة محافظة والجملة بلا احتكاك.']},
{k:'exer',n:'2',q:'صندوق يُسحب على أفق بقوة شد F = 50 N تصنع زاوية 60° مع الأفق على مسافة 8 m. احسب عمل قوة الشد.',s:['W = F×d×cos(60°) = 50×8×0.5 = 200 J.','المكوّن العمودي لقوة الشد لا يعمل (عمودي على الحركة).','لاحظ: لو كانت القوة أفقية تمامًا لكان العمل 400 J — الميل إلى الأعلى يضاعف «ضياع» نصف العمل فقط في الجداء السلمي.']},
{k:'warn',i:['نسيان أعمال القوى العمودية على الحركة (صحيح أنها انعدمت — اذكرها صراحة في الحل).','استعمال كتلة بالغرام أو سرعة بالكيلومتر/ساعة دون تحويل.','إهمال إشارة عمل القوى المقاومة (يجب طرحها).','تطبيق المبرهنة على جملة لم ترسم قواها — كل قوة خارجية يجب أن تظهر في ΣW.']},
{k:'sum',i:['W = F·d·cos(α): جبري، وحدته الجول.','محرك (α حادة) ، مقاوم (α منفرجة) ، عدمي (α = 90°).','Ec = ½mv² موجبة دائمًا وتتضاعف ×4 عند مضاعفة v.','ΔEc = ΣW للقوى الخارجية كلها — المبرهنة المفصلية للحركة الانسحابية.']},
{k:'h2',x:'4. طاقة الوضع الثقالية والطاقة الميكانيكية'},
{k:'def',t:'طاقة الوضع الثقالية',x:'طاقة الوضع الثقالية Epp هي طاقة يخزنها الجسم بسبب موقعه في مجال الثقالة: تُحسب بالنسبة إلى مرجع اختياري (مستوى مرجعي) تُنسب إليه الارتفاعات، وتكون موجبة فوقه وسالبة تحته.'},
{k:'law',t:'طاقة الوضع الثقالية',m:'E_{pp}=\\pm m\\,g\\,z',x:'m الكتلة بالكيلوغرام، g تسارع الثقالة (≈ 9.8 m/s²)، z الارتفاع عن المستوى المرجعي. اختيار المرجع حر لكن يجب تثبيته طوال التمرين.'},
{k:'law',t:'الطاقة الميكانيكية',m:'E_{m}=E_{c}+E_{pp}',x:'الطاقة الميكانيكية للجملة هي مجموع طاقتها الحركية وطاقة وضعها الثقالية — بطاقة الأداء الكلي للحركة في مجال الثقالة.'},
{k:'law',t:'انحفاظ الطاقة الميكانيكية',m:'E_{m}(A)=E_{m}(B)',x:'عندما تكون القوى المطبقة محافظة (الثقالة وحدها أو مع قوة نابض)، تبقى الطاقة الميكانيكية ثابتة على المسار: ما تنقصه الحركية تكسبه الوضع والعكس. أما الاحتكاكات فتُنقصها بمقدار عملها.'},
{k:'ex',t:'مثال محلول: التزحلق على المائح',x:'زحلوق كتلته 50 kg ينطلق بدون سرعة ابتدائية من نقطة A على ارتفاع 5 m.\\nطاقته الأولية كلها وضعًا: Epp = mgh = 50×9.8×5 = 2450 J و Ec = 0.\\nعند النقطة B على الأرض (المرجع): Epp = 0 والطاقة الميكانيكية محفوظة:\\nEc(B) = 2450 J أي (1/2)mv² = 2450 فتكون v = √(2×2450/50) = √98 ≈ 9.9 m/s.\\nلو كان هناك احتكاك لوصل بسرعة أقل: الفرق هو عمل قوى الاحتكاك المنقول إلى طاقة داخلية (تسخين).'},
{k:'warn',i:['نسيان تثبيت مستوى مرجعي واحد لكل النقط في التمرين الواحد.','إنجاز mgh بالسنتيمتر — يجب تحويل الارتفاع إلى المتر.','الطاقة الميكانيكية محفوظة فقط عند إهمال الاحتكاكات: اذكر ذلك صراحة.']},
]});

CH_PHYS.push({id:'ph3',title:'العمل والطاقة — الحركة الدورانية',icon:'🎡',sem:1,
desc:'وصف الحركة الدورانية، عزم قوة بالنسبة لمحور، عمل عزم، الطاقة الحركية الدورانية، ومبرهنة الطاقة الحركية الدورانية.',
keys:['دوران','عزم','سرعة زاوية','عزم العطالة','تردد','مبرهنة'],
obj:'توصف حركة دورانية حول محور ثابت (θ ، ω ، N)، تحسب عزم قوة وعمله، تحسب الطاقة الحركية الدورانية، وتطبق المبرهنة الدورانية.',
take:['θ بالراديان: θ = 2πN (N عدد الدورات) و ω = 2π/T = 2πf.','عزم القوة: M = ±F·d — إشارته حسب منحى الدوران.','عمل عزم ثابت: W = M·θ (ب θ بالراديان).','Ec دورانية = ½Jω² حيث J عزم العطالة حول المحور.'],
sections:[
{k:'h2',x:'1. وصف الحركة الدورانية'},
{k:'svg',x:'<svg viewBox="0 0 340 170" width="340"><circle cx="110" cy="90" r="58" class="shape"/><circle cx="110" cy="90" r="4" class="pt"/><path class="ax" d="M110 90 L168 90"/><text x="136" y="83">r</text><circle cx="168" cy="90" r="5" class="pt2"/><path class="cv" d="M168 90 L204 58"/><path class="ax" d="M204 58 l-3 12 m3 -12 l-12 3"/><text x="210" y="52">v</text><path class="cv" d="M143 33 A70 70 0 0 1 162 45"/><path class="ax" d="M162 45 l-3 -10 m3 10 l-10 -4"/><text x="130" y="26">ω</text><text x="255" y="120" text-anchor="middle">قرص يدور حول محوره</text></svg>',cap:'كل نقط من القرص يصف دائرة: السرعة الخطية v = r·ω تتناسب مع نصف القطر'},
{k:'law',t:'المقادير الحركية للدوران',m:'\\theta=2\\pi N\\qquad\\omega=\\frac{\\Delta\\theta}{\\Delta t}=2\\pi f=\\frac{2\\pi}{T}\\qquad v=R\\,\\omega',x:'N عدد الدورات (دورة/ثانية = هرتز f)، و ω السرعة الزاوية (راديان/ثانية)، و v السرعة الخطية لنقطة على بعد R من المحور. لا تخلط بين السرعة الخطية (m/s) والزاوية (rad/s).'},
{k:'h2',x:'2. عزم قوة بالنسبة إلى محور'},
{k:'def',t:'تعريف — عزم قوة',x:'عزم القوة F→ بالنسبة لمحور Δ يقيس «قدرتها» على إحداث دوران حول المحور. إذا كانت F→ في مستوي عمودي على Δ وتأثير على مسافة d (الذراع) من المحور:'},
{k:'math',x:'M_{\\Delta}(\\vec F)=\\pm\\,F\\,d'},
{k:'p',x:'الإشارة اصطلاحية: موجبة إذا كان الدوران بالمنحى المختار المباشر، وسالبة في العكس. العزم وحدته N·m (نيوتن متر) — لا تساوي الجول فيزيائيًا رغم تشابه الوحدتين كتابةً لأن العزم ليس طاقة.'},
{k:'law',t:'عمل عزم ثابت',m:'W_{A\\to B}=M_{\\Delta}\\times\\theta_{\\,A\\to B}',x:'حيث θ الزاوية الموصوفة بالراديان. جسر البرهان: نقطة تأثير القوة تقطع مسافة s = R·θ فعمل القوة F (المماسي) = F·R·θ = (F·d)·θ = M·θ.'},
{k:'h2',x:'3. الطاقة الحركية الدورانية'},
{k:'law',t:'عزم العطالة والطاقة الدورانية',m:'J=\\sum m_{i}r_{i}^{2}\\qquad\\qquad E_{c}=\\tfrac{1}{2}J\\,\\omega^{2}',x:'J عزم العطالة حول المحور (وحدته kg·m²): يجمع «توزيع الكتلة» حول المحور. لكتلة نقطية على مسافة r: J = m·r². الطاقة الحركية الدورانية تتناسب مع ω² تمامًا كما في الحركة الانسحابية مع v².'},
{k:'law',t:'مبرهنة الطاقة الحركية الدورانية',m:'\\Delta E_{c}=\\sum W_{A\\to B}(M_{\\text{ext}})',x:'تغير الطاقة الحركية الدورانية يساوي مجموع أعمال العزوم الخارجية (أو الأعمال إذا كانت القوى ثابتة). نفس منطق النسخة الانسحابية مع استبدال: قوة ↔ عزم، مسافة ↔ زاوية.'},
{k:'ex',t:'مثال محلول: قرص يتسارع',x:'قرص عزم عطالته حول محوره J = 0.2 kg·m² كان ساكنًا، فأثر عليه عزم محرك ثابت M = 0.8 N·m.\n(1) الزاوية بعد t = 5 s: θ = ½·(M/J)·t² = ½×(0.8/0.2)×25 = 50 راديان (≈ 8 دورات).\n(2) الطاقة: W = M·θ = 0.8×50 = 40 J = ΔEc = ½×0.2×ω² أي ω² = 400 و ω = 20 rad/s.\nتحقق: ω = (M/J)·t = 4×5 = 20 rad/s ✓ (العزم الثابت يعطي تسارعًا زاويًا ثابتًا α = M/J).'},
{k:'exer',n:'1',q:'بكرة نصف قطرها R = 10 cm معلقة خيط مشدود فيه قوة F = 20 N دائمًا مماسية للحافة. ما العزم؟ وما العمل بعد دورة كاملة؟',s:['العزم: M = F×R = 20×0.1 = 2 N·m.','دورة كاملة: θ = 2π راديان.','العمل: W = M×θ = 2×2π = 4π ≈ 12.57 J.']},
{k:'exer',n:'2',q:'جسم نقطي كتلته 0.3 kg يدور حول محور على مسافة r = 0.5 m بسرعة زاوية ω = 4 rad/s. احسب عزم عطالته وطاقته الحركية الدورانية.',s:['كتلة نقطية: J = m·r² = 0.3×0.25 = 0.075 kg·m².','Ec = ½×0.075×16 = 0.6 J.','تحقق بالمسار الخطي: v = r·ω = 2 m/s فـ Ec = ½×0.3×4 = 0.6 J ✓ (الطاقتان نفس الوصف الفيزيائي).']},
{k:'warn',i:['استعمال الدرجات بدل الراديان في θ — المبرهنة تعمل بالراديان فقط.','الخلط بين العزم (N·m) والعمل (J): العزم «مرفق» دوار والعمل «طاقة» — لا تجمعهما.','نسيان أن عزم عطالة الجسم يتعلق بالمحور المختار: J ليس صفة للجسم وحده.','حساب v = Rω بوحدات خاطئة (R بالمتر إلزامي).']},
{k:'sum',i:['θ = 2πN ، ω = 2πf = 2π/T ، v = Rω.','M = ±F·d وعمل العزم الثابت W = M·θ.','J = Σmr² (كتلة نقطية: mr²) و Ec = ½Jω².','ΔEc الدورانية = ΣW(العزوم) — البنية نفسها للنسختين.']}
]});

CH_PHYS.push({id:'ph4',title:'الطاقة الكامنة',icon:'⛰️',sem:1,
desc:'الطاقة الكامنة الثقالية والمرونية، مبرهنة الطاقة الكامنة، الطاقة الميكانيكية وانحفاظها.',
keys:['كامنة','ثقالية','مرونية','نابض','مرجع','انحفاظ','مبرهنة'],
obj:'تعرف الطاقتين الكامنتين الثقالية والمرونية، تحسب تغيرهما بين وضعين، تطبق مبرهنة الطاقة الكامنة، وتستثمر انحفاظ الطاقة الميكانيكية في غياب الاحتكاك.',
take:['Epp = mgz: قيمتها تتعلق بالمستوى المرجعي المختار، أما ΔEpp فلا.','Epe = ½kx²: x الاستطالة أو الانضغاط بالنسبة لطول التوازن.','ΔEp = −ΣW(القوى المحافظة): التغير معاكس لعمل القوى المحافظة.','بدون احتكاك: Em = Ec + Ep ثابتة — أقوى أداة حل في الميكانيك.'],
sections:[
{k:'h2',x:'1. الطاقة الكامنة الثقالية'},
{k:'svg',x:'<svg viewBox="0 0 340 170" width="340"><path class="ax" d="M30 150 H310"/><path class="ax" d="M30 150 V20"/><path class="ax" d="M30 20 l-5 11 m5 -11 l5 11"/><path class="aux" d="M60 150 V56"/><circle cx="60" cy="48" r="8" class="pt"/><path class="cv" d="M60 60 V140"/><path class="ax" d="M60 140 l-5 -11 m5 11 l5 -11"/><text x="40" y="105">h</text><text x="80" y="38">جسم كتلته m على ارتفاع h</text><text x="160" y="165">المستوى المرجعي</text><text x="235" y="52">Epp = ±m·g·h</text></svg>',cap:'طاقة الوضع الثقالية تُقاس من مستوى مرجعي تختاره وتثبته طوال التمرين'},
{k:'def',t:'تعريف',x:'تخزن الجملة «الكرة + الأرض» طاقة كامنة ثقاللية تُحسب بموضع الكرة في مجال الثقالة المنتظم (قرب سطح الأرض):'},
{k:'math',x:'E_{pp}=m\\,g\\,z'},
{k:'p',x:'حيث z الارتفاع بالمتر بالنسبة إلى مستوى مرجعي نختاره (أرضية، سطح طاولة...). بما أن اختيار المرجع حر، فقيمة Epp النهائية نفسها غير مطلقة — الفيزياء في الفرق ΔEpp بين وضعين وهذا الفرق لا يتعلق بالمرجع.'},
{k:'law',t:'مبرهنة الطاقة الكامنة',m:'\\Delta E_{p}=E_{p}(B)-E_{p}(A)=-\\sum W_{A\\to B}(\\vec F_{\\text{cons}})',x:'تغير الطاقة الكامنة يساوي سالب مجموع أعمال القوى المحافظة (الثقالة والمرونية). مثال سقوط من ارتفاع h: ΔEpp = −mgh = −W(الثقل) — عمل الثقل المحرك يأتي من «سحب» الطاقة الكامنة.'},
{k:'h2',x:'2. الطاقة الكامنة المرونية'},
{k:'law',t:'طاقة النابض المشوه',m:'F=k\\,x\\qquad\\qquad E_{pe}=\\tfrac{1}{2}\\,k\\,x^{2}',x:'حيث k ثابت المرونة (N/m) و x الاستطالة أو الانضغاط بالنسبة لطول التوازن (m). قانون هوك F = kx يعطي القوة الاسترجاعية، والطاقة الكامنة هي «مساحة المثلث» تحت منحنى F مقابل x.'},
{k:'h2',x:'3. انحفاظ الطاقة الميكانيكية'},
{k:'law',t:'شرط الانحفاظ',m:'E_{m}=E_{c}+E_{pp}+E_{pe}=\\text{const}\\quad\\Longleftrightarrow\\quad\\sum W(\\vec F_{\\text{nc}})=0',x:'إذا كانت الأعمال اللاتحفظية (الاحتكاك أساسًا) منعدمة أو انعدمت (قوى عمودية على الحركة)، فإن الطاقة الميكانيكية تبقى ثابتة خلال الحركة — وهذا يحول أي مسألة مسارات إلى معادلة طاقة واحدة بلا قوى داخلية!'},
{k:'ex',t:'مثال محلول: تزحلق مع نابض',x:'كرة كتلتها 0.1 kg تنطلق مقابل نابض ثابت مرونته k = 200 N/m مشدودًا بمقدار x = 0.1 m على مسار أفقي أملس.\nطاقة النابض: Epe = ½×200×0.01 = 1 J تنقل كلها إلى الكرة عند إطلاقها (مسار أفقي: Epp ثابتة).\nEc القصوى = 1 J: ½×0.1×v² = 1 أي v = √20 ≈ 4.47 m/s.'},
{k:'ex',t:'مثال محلول: سقوط مع تحول بين شكلين',x:'كرة كتلتها 0.2 kg تسقط من ارتفاع 1.5 m فوق نابض ثابت مرونته k = 400 N/m.\n(1) عند أول تلامس: اكتسبت Ec = mgh = 0.2×10×1.5 = 3 J أي v = √(2×3/0.2) ≈ 5.48 m/s.\n(2) أقصى انضغاط x₀: كل الطاقة تحولت إلى مرونية عند أقصى انضغاط: Ec = 0 فنجمع: mg(1.5 + x₀) = ½×400×x₀².\n(3) حل المعادلة: 200x₀² − 2x₀ − 3 = 0 أي x₀ = [2 + √(4 + 2400)]/400 ≈ 0.10 m (نحتفظ بالجذر الموجب).'},
{k:'exer',n:'1',q:'حدد سرعة كرة كتلتها 0.5 kg عند ارتفاع 2 m، إذا أُطلقت أفقيا بسرعة 4 m/s من ارتفاع 5 m (بدون احتكاك، g = 10).',s:['انحفاظ Em: ½mv₀² + mgh₀ = ½mv² + mgh (m تختزل).','التعويض: ½×16 + 10×5 = ½v² + 10×2 أي 8 + 50 = ½v² + 20.','½v² = 38 إذن v = √76 ≈ 8.72 m/s.','لاحظ: السرعة الأفقية الابتدائية تدخل بmربعها في الطاقة الحركية الكلية.']},
{k:'exer',n:'2',q:'أفق خشن: صندوق كتلته 2 kg ينزلق بمسافة 3 m تحت قوة احتكاك f = 4 N معاكسة للحركة، بدأ بسرعة 5 m/s. احسب سرعته النهائية (g = 10).',s:['هنا Em ليست محفوظة (احتكاك) — نستعمل مبرهنة الطاقة الحركية مباشرة.','أعمال القوى: الثقل والرد عدميان (حركة أفقية!)، الاحتكاك: W = −4×3 = −12 J.','ΔEc = −12: ½×2×v² − ½×2×25 = −12 أي v² = 13 و v ≈ 3.61 m/s.','بدلًا من «هدر» طاقة 12 J تحولت إلى طاقة داخلية (تسخين السطحين).']},
{k:'warn',i:['حساب Epp دون تحديد المستوى المرجعي أصلًا في الحل.','الخلط بين x (الاستطالة عن التوازن) والطول الكلي للنابض.','تطبيق انحفاظ Em في وجود احتكاك — أول ما تتحقق منه: هل الاحتكاك منعدم؟','جمع قيم Epp محسوبة من مستويين مرجعيين مختلفين في نفس الحصيلة.']},
{k:'sum',i:['Epp = mgz: مرجع حر، والفرق ΔEpp هو المعنى الفيزيائي.','Epe = ½kx² مع قانون هوك F = kx.','ΔEp = −ΣW(المحافظات) — مبرهنة الطاقة الكامنة.','Em = Ec + Ep محفوظة بدون احتكاك: أداة أسرع من قوانين نيوتن في مسائل المسارات.']}
]});

CH_PHYS.push({id:'ph5',title:'الطاقة الداخلية',icon:'🔥',sem:2,
desc:'الطاقة الداخلية للجملة، انتقال الطاقة حراريًا (توصيل، حمل، إشعاع)، المسعر وتجربة الخلط، وقياس السعة الحرارية.',
keys:['طاقة داخلية','حرارة','توصيل','حمل','إشعاع','مسعر','سعة حرارية','توازن حراري'],
obj:'يميز بين درجة الحرارة والطاقة الداخلية، يصف طرائق انتقال الطاقة حراريًا، يحسب كميات الطاقة المنتقلة بالعلاقة Q = m·c·Δθ، ويستعمل المسعر في تجربة الخلط لتعيين سعة حرارية نوعية.',
take:['الطاقة الداخلية طاقة مجهرية (حركية + تفاعل) تُقاس بالجول — ودرجة الحرارة ليست طاقة بل مؤشر ترمومتري.','Q = m·c·Δθ: كتلة × سعة حرارية نوعية × تغير درجة الحرارة.','في المسعر المعزول: ما يفقده الساخن يكسبه البارد تمامًا — ΣQ = 0.'],
sections:[
{k:'h2',x:'1. الطاقة الداخلية للجملة'},
{k:'def',t:'تعريف — الطاقة الداخلية',x:'الطاقة الداخلية U لجملة هي مجموع طاقاتها المجهرية: الطاقة الحركية لجزيئاتها (اهتزاز، دوران، انتقال) والطاقة الكامنة في التفاعلات بين جزيئاتها. تُقاس بالجول (J) وهي دالة حالة تعتمد على متغيرات الجملة.'},
{k:'p',x:'انتبه للفرق الجوهري: درجة الحرارة θ تُقاس بالترمومتر وتعكس «هيجان» الجزيئات الحركي فقط، بينما الطاقة الداخلية تشمل أيضًا طاقة الترابط. جسم ساخن صغير قد تكون طاقته الداخلية أقل من جسم بارد كبير — الكتلة والطبيعة تدخلان في الحساب.'},
{k:'note',t:'أشكال تغير الطاقة الداخلية',x:['تسخين الجملة أو تبريدها: تبادل طاقة حرارية مع الخارج (انتقال حراري).','احتكاك ميكانيكي: عمل يتحول إلى طاقة داخلية (اليدان تحترقان عند الدلك).','تفاعل كيميائي: كسر الروابط وطاقة جديدة (احتراق الوقود).']},
{k:'h2',x:'2. انتقال الطاقة حراريًا'},
{k:'p',x:'الطاقة تنتقل دائمًا تلقائيًا من الجسم الساخن إلى الجسم البارد حتى يتحقق التوازن الحراري (درجة حرارة واحدة). لهذا الانتقال ثلاث طرائق:'},
{k:'ul',i:['التوصيل: من جسيم إلى جارته بالتماس المباشر — سائد في المواد الصلبة (ملعقة معدنية تسخن من طرفها في قدر ساخن).','الحمل: الجزيئات الساخنة الأخف تتحرك حاملة الطاقة معها — سائد في السوائل والغازات (ماء القدر يغلي من الأسفل إلى الأعلى).','الإشعاع: موجات كهرومغناطيسية لا تحتاج وسطًا ماديًا (دفء الشمس يصلنا عبر الفراغ).']},
{k:'ex',t:'مثال من الحياة: بيت جزائري شتاءً',x:'المدفأة تسخن هواء الغرفة بالحمل (دوائر هواء صاعدة وهابطة)، وتسخن الأرضية والأثاث بالتوصيل بالتماس، وتشع حرارتها إلى الأجسام البعيدة. الجدران المعزولة تُبطئ التوصيل فتبقى الغرفة دافئة أطول.'},
{k:'h2',x:'3. المسعر وتجربة الخلط'},
{k:'def',t:'المسعر',x:'المسعر جهاز معزول حراريًا (جدران عازلة وغطاء) يسمح بقياس كميات الطاقة المنتقلة حراريًا دون تسرب إلى الخارج: الجملة داخله تكاد تكون معزولة، فمجموع الطاقات المنتقلة بين أجزائها يساوي صفرًا.'},
{k:'svg',x:'<svg viewBox="0 0 340 210" width="340"><rect class="shape" x="70" y="40" width="200" height="140" rx="14"/><rect class="shape2" x="90" y="60" width="160" height="105" rx="8"/><path class="ax" d="M110 150 H230"/><path class="cv" d="M110 150 V85"/><path class="cv" d="M110 85 l-5 12 m5 -12 l5 12"/><path class="sol" d="M100 130 Q170 122 240 130 L240 150 L100 150 Z"/><circle class="pt" cx="170" cy="122" r="3"/><circle class="pt2" cx="145" cy="126" r="3"/><circle class="pt2" cx="196" cy="126" r="3"/><path class="aux" d="M250 45 V140" stroke-dasharray="5 5"/><text x="255" y="95" font-size="12">ترمومتر</text><text x="118" y="98" font-size="12">ماء بارد</text><text x="178" y="176" font-size="12">ماء ساخن داخل المسعر</text><text x="275" y="60" font-size="12">غطاء عازل</text></svg>',cap:'المسعر: ماء ساخن + ماء بارد داخل جملة معزولة حراريًا حتى التوازن.'},
{k:'law',t:'كمية الطاقة المنتقلة حراريًا',m:'Q=m\\,c\\,\\Delta\\theta=m\\,c\\,(\\theta_{f}-\\theta_{i})',x:'m الكتلة بالكيلوغرام، c السعة الحرارية النوعية بالجول لكل كيلوغرام وكل درجة (J·kg⁻¹·°C⁻¹)، و Δθ تغير درجة الحرارة. للماء c = 4185 J·kg⁻¹·°C⁻¹ تقريبًا.'},
{k:'law',t:'مبدأ تجربة الخلط (جملة معزولة)',m:'\\sum Q_{i}=0\\;\\;\\Longleftrightarrow\\;\\;m_{1}c_{1}(\\theta_{f}-\\theta_{1})+m_{2}c_{2}(\\theta_{f}-\\theta_{2})=0',x:'ما يفقده الساخن (Q سالبة لأن θf أصغر من θ1) يكسبه البارد (Q موجبة). مجموعهما صفر لأن المسعر معزول.'},
{k:'ex',t:'مثال محلول: تعيين درجة التوازن',x:'نمزج في مسعر m₁ = 0.2 kg من الماء عند θ₁ = 80°C مع m₂ = 0.3 kg من الماء عند θ₂ = 20°C. السعة النوعية واحدة للماءين فتُحذف من المعادلة:\\n0.2×(θf − 80) + 0.3×(θf − 20) = 0\\n0.2θf − 16 + 0.3θf − 6 = 0 أي 0.5θf = 22 ومنه θf = 44°C.\\nتحقق: الساخن فقد 0.2×4185×(44−80) = −30132 J والبارد كسب 0.3×4185×(44−20) = +30132 J — مجموع صفري ✓'},
{k:'exer',n:'1',q:'قطعة معدن كتلتها 0.15 kg درجة حرارتها 100°C تُلقى في مسعر فيه 0.4 kg ماء عند 20°C. درجة التوازن 24°C. احسب السعة الحرارية النوعية للمعدن (نهمل سعة المسعر، ماء: 4185).',s:['طاقة الماء المكتسبة: Q₂ = 0.4×4185×(24−20) = +6696 J.','طاقة المعدن المفقودة: Q₁ = 0.15×c×(24−100) = −11.4c.','الجملة معزولة: 6696 − 11.4c = 0 أي c ≈ 587 J·kg⁻¹·°C⁻¹ (قريب من الحديد).']},
{k:'sum',i:['الطاقة الداخلية مجهرية بالجول؛ درجة الحرارة مؤشر ترمومتري فقط.','الانتقال الحراري: توصيل (تماس)، حمل (سوائل وغازات)، إشعاع (بدون وسط) — دائمًا من الساخن إلى البارد.','Q = m·c·Δθ وفي المسعر المعزول ΣQ = 0 — مفتاح تجربة الخلط وكل تمارين الوحدة.']},
]});

CH_PHYS.push({id:'ph6',title:'كمية المادة والتراكيز',icon:'💧',sem:2,
desc:'كمية المادة والمول والكتلة المولية، التركيز المولي والتركيز الكتلي، وتحضير المحاليل وتخفيفها.',
keys:['كمية المادة','مول','كتلة مولية','تركيز مولي','تركيز كتلي','تخفيف','محلول'],
obj:'يحسب كمية المادة انطلاقًا من الكتلة (n = m/M)، يحضّر محلولًا بتركيز مولي معين، يحسب التركيز الكتلي، وينجز التخفيف بالعلاقة C·V = ثابت.',
take:['n = m/M: الكتلة بالغرام مقسومة على الكتلة المولية بالغرام لكل مول.','C = n/V بالمول في اللتر (mol/L) — الحجم هو حجم المحلول لا حجم المذاب.','التخفيف: C₀V₀ = C₁V₁ — كمية المادة لا تتغير بإضافة ماء.'],
sections:[
{k:'h2',x:'1. كمية المادة: المول والكتلة المولية'},
{k:'def',t:'تعريف — المول وكمية المادة',x:'المول هو كمية مادة تحوي عدد أفوكادرو N_A = 6.02×10²³ من الكيانات (ذرات، جزيئات، أيونات). كمية المادة n تُقاس بالمول وتخبرنا «كم حزمة» من هذه الكيانات لدينا.'},
{k:'law',t:'الربط بين الكتلة وكمية المادة',m:'n=\\frac{m}{M}\\;\\;\\;\\;;\\;\\;\\;N=n\\,N_{A}',x:'m الكتلة بالغرام، M الكتلة المولية بالغرام لكل مول (تُقرأ من الجدول الدوري: مجموع الكتل الذرية)، و N عدد الكيانات.'},
{k:'tbl',h:['المادة','الصيغة','الكتلة المولية M (g/mol)'],r:[['الماء','H₂O','18'],['ثاني أكسيد الكربون','CO₂','44'],['كلوريد الصوديوم (ملح الطعام)','NaCl','58.5'],['حمض الكبريت','H₂SO₄','98']]},
{k:'ex',t:'مثال محلول',x:'كم كمية المادة في 9 g من الماء؟\\nn = m/M = 9/18 = 0.5 mol.\\nوعدد الجزيئات: N = 0.5 × 6.02×10²³ ≈ 3.01×10²³ جزيئًا — نصف مول فقط يحوي هذا العدد الفلكي!'},
{k:'h2',x:'2. التركيز المولي والتركيز الكتلي'},
{k:'svg',x:'<svg viewBox="0 0 340 160" width="340"><path class="ax" d="M45 40 V130 H135 V40"/><text x="90" y="150" text-anchor="middle">C1 = 1 mol/L</text><circle cx="75" cy="80" r="4" class="pt"/><circle cx="105" cy="95" r="4" class="pt"/><circle cx="90" cy="112" r="4" class="pt"/><circle cx="118" cy="70" r="4" class="pt"/><circle cx="65" cy="105" r="4" class="pt"/><path class="ax" d="M205 40 V130 H295 V40"/><text x="250" y="150" text-anchor="middle">C2 = 0.5 mol/L</text><circle cx="225" cy="85" r="4" class="pt"/><circle cx="265" cy="100" r="4" class="pt"/><circle cx="245" cy="115" r="4" class="pt"/><path class="cv" d="M145 70 H185"/><path class="ax" d="M185 70 l-10 -5 m10 5 l-10 5"/><text x="165" y="92" text-anchor="middle">تخفيف</text></svg>',cap:'التركيز = كمية المادة في كل لتر: التخفيف بالماء يحفظ كمية المادة ويكبر الحجم'},
{k:'def',t:'التركيز المولي',x:'إذا أذبنا كمية مادة n (مول) في محلول حجمه V (لتر)، فإن التركيز المولي C هو نسبة كمية المادة المذابة إلى حجم المحلول.'},
{k:'law',t:'التركيز المولي',m:'C=\\frac{n}{V}\\;\\;\\;;\\;\\;C=\\frac{m}{M\\,V}',x:'وحدته mol/L. انتبه: الحجم هو حجم المحلول النهائي (مذاب + مذيب معًا) وليس حجم الماء المضاف.'},
{k:'p',x:'يوجد أيضًا التركيز الكتلي t: كتلة المذاب في حجم المحلول، t = m/V بوحدة g/L، ويرتبط بالتركيز المولي بالعلاقة t = C×M. في مختبر الطور الثاني تستعمل هاتين الصيغتين كل مرة تحضّر فيها محلولًا.'},
{k:'method',t:'تحضير محلول تركيزه C وحجمه V',i:['احسب كمية المادة: n = C×V، ومنها الكتلة: m = n×M.','وزن الكتلة m بميزان دقيق في كأس زجاجي.','أذب في قليل من الماء المقطر وحرّك حتى الذوبان الكامل.','أكمل بالماء المقطر حتى علامة الحجم V في دورق محدد وأرج.']},
{k:'h2',x:'3. تخفيف محلول'},
{k:'p',x:'تخفيف محلول يعني إضافة ماء مقطر: التركيز ينقص، والحجم يكبر، لكن كمية المادة المذابة لا تتغير إطلاقًا — نأخذ منها جزءًا ونمده بالماء. هذا الثبات هو مفتاح كل حسابات التخفيف.'},
{k:'law',t:'علاقة التخفيف',m:'C_{0}V_{0}=C_{1}V_{1}\\;\\;\\;\\;;\\;\\;\\frac{C_{0}}{C_{1}}=\\frac{V_{1}}{V_{0}}=f',x:'C₀ و V₀ تركيز وحجم المحلول الأم (المركّز)، C₁ و V₁ للمحلول المخفف. عامل التخفيف f يخبرنا كم مرة خففنا.'},
{k:'ex',t:'مثال محلول',x:'نريد تحضير 500 mL من محلول تركيزه 0.1 mol/L انطلاقًا من محلول أم تركيزه 0.5 mol/L.\\nC₀V₀ = C₁V₁ يعطي: 0.5×V₀ = 0.1×0.5 أي V₀ = 0.1 L = 100 mL.\\nالطريقة: نأخذ 100 mL من الأم بالمدور ونكمل بالماء المقطر حتى 500 mL — عامل التخفيف f = 5.'},
{k:'exer',n:'1',q:'غرفة عملية؟ لا: مخبر! 250 mL محلول تركيزه 0.4 mol/L. أي حجم ماء نضيف ليصبح التركيز 0.1 mol/L؟',s:['V₁ = C₀V₀/C₁ = 0.4×250/0.1 = 1000 mL أي 1 L.','حجم الماء المضاف = 1000 − 250 = 750 mL (خلايا المحلول نفسها تم مدّها بالماء).']},
{k:'exer',n:'2',q:'ذاب 4 g من NaOH (M = 40 g/mol) في محلول حجمه 200 mL. احسب التركيز المولي والكتلي.',s:['n = m/M = 4/40 = 0.1 mol.','C = n/V = 0.1/0.2 = 0.5 mol/L.','t = m/V = 4/0.2 = 20 g/L (وتحقق: t = C×M = 0.5×40 = 20 ✓).']},
{k:'sum',i:['n = m/M — المول لغة الكيميائي لعدّ الحزم الذرية.','C = n/V (mol/L) و t = m/V (g/L) وربطهما t = C×M.','التخفيف يغير C و V فقط: C₀V₀ = C₁V₁ لأن n ثابتة.']},
]});

CH_PHYS.push({id:'ph7',title:'قياس الناقلية وتعيين كمية المادة في محلول شاردي',icon:'⚡',sem:2,
desc:'الناقلية الكهربائية للمحاليل الشاردية، الناقلية النوعية، الناقلية المولية الشاردية، وتعيين التركيز.',
keys:['ناقلية','شوارد','سيمنس','خلية','ناقلية نوعية','ناقلية مولية','تركيز'],
obj:'تفرق الناقلية G عن الناقلية النوعية σ، تفهم دور الشوارد في نقل التيار، تستعمل علاقة الناقلية المولية الشاردية لتعيين التركيز.',
take:['G = I/U بالسيمنس: قدرة المحلول على تمرير التيار.','σ = G×(ℓ/S): الناقلية النوعية صفة للمحلول (S/m).','σ = Σλᵢ·cᵢ: لكل شارد إسهامه بحسب تركيزه وناقليته المولية.','قياس G عند تراكيز معلومة يمنح معايرة خطية لاستخراج تركيز مجهول.'],
sections:[
{k:'h2',x:'1. من التيار إلى الناقلية'},
{k:'svg',x:'<svg viewBox="0 0 340 170" width="340"><rect x="80" y="60" width="180" height="90" rx="8" class="shape"/><rect x="120" y="68" width="10" height="42" class="shape2"/><rect x="210" y="68" width="10" height="42" class="shape2"/><path class="ax" d="M125 68 V32 H215 V68"/><text x="170" y="24" text-anchor="middle">مولد + أمبيتر</text><circle cx="100" cy="118" r="4" class="pt"/><text x="100" y="140" text-anchor="middle">−</text><circle cx="240" cy="118" r="4" class="pt2"/><text x="240" y="140" text-anchor="middle">+</text><circle cx="160" cy="120" r="3" class="pt"/><circle cx="185" cy="110" r="3" class="pt2"/><text x="170" y="55" text-anchor="middle">خلية الناقلية</text></svg>',cap:'الناقلية تقاس بخلية بين لوحيها المحلول: مرور التيار يكشف قدرة الشحنات على التوصيل'},
{k:'p',x:'يوصل المحلول الشاردي التيار بفضل حركة شوارد موجبة (نحو القطب السالب) وسالبة (نحو الموجب). لقياس الناقلية نغمر خلية قياس (قطبان متوازيان) ونطبق جهدًا منخفضًا مترددًا لمنع التحليل الكهربائي على القطبين.'},
{k:'law',t:'الناقلية',m:'G=\\frac{I}{U}',x:'U التوتر المطبق بين القطبين (V) و I شدة التيار (A) و G الناقلية بالسيمنس (S). الجهد المنخفض جدًا والتردد شرطا قياس صحيح.'},
{k:'law',t:'الناقلية النوعية',m:'G=\\sigma\\,\\frac{S}{\\ell}\\;\\Longleftrightarrow\\;\\sigma=G\\,\\frac{\\ell}{S}',x:'حيث S مساحة كل قطب و ℓ المسافة بينهما (هندسة الخلية). الناقلية النوعية σ تصف المحلول نفسه بمعزل عن الخلية، ووحدتها S/m (أو S·cm⁻¹ مع تحويلات رياضية).'},
{k:'h2',x:'2. الناقلية المولية الشاردية'},
{k:'law',t:'قانون الجمع الشاردي',m:'\\sigma=\\sum_{i}\\lambda_{i}\\,c_{i}',x:'كل شارد يسهم في الناقلية النوعية بمقدار λᵢcᵢ حيث λᵢ الناقلية المولية الشاردية (S·m²/mol) و cᵢ التركيز الشاردي (mol/m³). انتبه للوحدات: التركيز الشائع mol/L يجب ضربه في 1000 للتحويل إلى mol/m³.'},
{k:'tbl',h:['الشارد','λ (mS·m²/mol) عند 25°C'],r:[
['H₃O⁺ (الهيدرونيوم)','34.97'],
['OH⁻ (الهيدروكسيد)','19.91'],
['Na⁺','5.01'],
['K⁺','7.35'],
['Cl⁻','7.63'],
['NO₃⁻','7.14']]},
{k:'note',x:'شاردة الهيدرونيوم استثنائية الناقلية (آلية القفز الجزيئي بين جزيئات الماء) — لهذا المحاليل الحمضية توصل أكثر بكثير من غيرها عند نفس التركيز.'},
{k:'ex',t:'مثال محلول بالتفصيل',x:'محلول كلوريد الصوديوم NaCl بتركيز C = 0.01 mol/L. احسب ناقليته النوعية ثم ناقلية الخلية (ℓ = 1 cm ، S = 1 cm²).\n(1) التركيز الشاردي: c(Na⁺) = c(Cl⁻) = C = 0.01 mol/L = 10 mol/m³ (×1000).\n(2) σ = λ(Na⁺)×10 + λ(Cl⁻)×10 = (5.01 + 7.63)×10⁻³×10 = 0.1264 S/m.\n(3) G = σ×(S/ℓ) = 0.1264×(1×10⁻⁴/1×10⁻²) = 1.264 mS ≈ 1.26 mS.'},
{k:'exer',n:'1',q:'قياس ناقلية محلول KNO₃ أظهر σ = 0.1449 S/m. احسب تركيزه المولي (λ(K⁺) = 7.35 و λ(NO₃⁻) = 7.14 mS·m²/mol).',s:['مجموع الناقليتين: (7.35 + 7.14) mS·m²/mol = 14.49×10⁻³ S·m²/mol.','σ = Σλc مع تساوي الشاردتين: σ = (λ₁+λ₂)×c ومنه c = 0.1449/0.01449 = 10 mol/m³.','التحويل: c = 10/1000 = 0.01 mol/L.']},
{k:'exer',n:'2',q:'لماذا ناقلية محلول HCl بتركيز 0.01 mol/L أعلى بكثير من محلول NaCl بنفس التركيز؟',s:['إسهام شوارد H₃O⁺ أكبر بكثير: λ(H₃O⁺) = 34.97 مقابل λ(Na⁺) = 5.01 mS·m²/mol.','σ(HCl) ≈ (34.97 + 7.63)×10⁻³×10 ≈ 0.426 S/m مقابل σ(NaCl) ≈ 0.126 S/m.','السبب الفيزيائي: بروتون الهيدروجين «يقفز» بين جزيئات الماء بسرعة استثنائية (آلية غروتوس) بدل الانتقال الكامل.']},
{k:'warn',i:['نسيان تحويل التركيز: mol/L ← mol/m³ بضرب ×1000 (والعكس ÷1000).','جمع الناقليات النوعية بدل المولية الشاردية في σ = Σλᵢcᵢ.','تجاهل أن σ تتزايد مع التركيز (خطيًا في المدى المعتدل) — أساس المعايرة بالناقلية.','استعمال تيار مستمر مرتفع: يسبب تحليلًا كهربائيًا على القطبين يفسد القياس.']},
{k:'sum',i:['G = I/U (S): صفة الخلية+المحلول معًا، وσ = G·ℓ/S صفة المحلول.','σ = Σλᵢcᵢ: إسهام شاردي خطي بمعاملات λ الجدولية.','λ(H₃O⁺) و λ(OH⁻) استثنائيتان (آلية القفز).','معايرة الناقلية: خط معايرة σ = f(c) لاستخراج تركيز مجهول.']},
{k:'h2',x:'3. قانون كولراوش وتطبيقاته'},
{k:'p',x:'الناقلية المولية الشاردية λᵢ تعتمد على الشاردة وعلى التركيز: كلما خف المحلول (قل التركيز) اقتربت λᵢ من قيمتها العظمى λᵢ° (قيمة التخفيف اللانهائي). لهذا نحسب ناقلية المحلول عند تخفيف كبير بجمع إسهامات كل شاردة.'},
{k:'law',t:'قانون كولراوش',m:'\\lambda=\\sum_{i}\\lambda_{i}^{\\circ}\\,c_{i}',x:'λ ناقلية المحلول (S/m)، λᵢ° الناقلية المولية الشاردية في التخفيف اللانهائي (S·m²/mol)، و cᵢ التركيز المولي للشاردة i. الجمع يمسح كل الشاردات الموجودة (الموجبة والسالبة معًا).'},
{k:'ex',t:'مثال محلول',x:'محلول NaCl تركيزه C = 0.01 mol/L في التخفيف الكبير:\\nλ°(Na⁺) = 50.1×10⁻⁴ S·m²/mol و λ°(Cl⁻) = 76.3×10⁻⁴ S·m²/mol.\\nλ = [λ°(Na⁺) + λ°(Cl⁻)]×C = (50.1+76.3)×10⁻⁴ × 0.01 = 126.4×10⁻⁴ × 10⁻² = 1.26×10⁻⁴... في الواقع λ = 126.4×10⁻⁶ S/m ≈ 1.26×10⁻⁴ S/m.\\nهذه هي الطريقة الرسمية لتعيين التركيز من قياس الناقلية في تمارين البكالوريا.'},
{k:'note',t:'لماذا «التخفيف اللانهائي»؟',x:'كلما زاد التركيز زاد تجاذب الشاردات المتعاكسة فتقل حركتها (تأثير التفاعلات البينية). عند التخفيف الشديد تختفي هذه العوائق عمليًا فتسهم كل شاردة بقيمتها العظمى — لذلك يعمل قانون كولراوش بدقة عند التراكيز الضعيفة.'},
]});

CH_PHYS.push({id:'ph8',title:'تعيين كمية المادة بواسطة المعايرة (أكسدة-إرجاع)',icon:'🧪',sem:2,
desc:'تفاعلات أكسدة-إرجاع، الكميات عند التكافؤ، منهجية المعايرة، وتحديد التركيز المجهول.',
keys:['معايرة','تكافؤ','أكسدة','إرجاع','برمانغانات','مؤشر','كمية مادة'],
obj:'تكتب معادلات أكسدة-إرجاع موزونة، تحدد النسبة الستوكيومترية عند التكافؤ، وتستخرج تركيز مجهول من معايرة حجمية.',
take:['عند التكافؤ: المتفاعلان المستهلكان تمامًا بنسبة معاملات المعادلة.','n(المؤكسد)/n(المختزل) = نسبة المعاملات — لا تفترض 1:1 أبدًا.','C_A·V_A = نسبة × C_B·V_B عند التكافؤ (بعد الوزن الصحيح).','كاشف ذاتي (برمانغانات البنفسجي يزول لونه عند التكافؤ) أو مركب قياس.'],
sections:[
{k:'h2',x:'1. جسر المفاهيم: الأكسدة والإرجاع'},
{k:'def',t:'تعريف',x:'الأكسدة فقدان إلكترونات، والإرجاع كسب إلكترونات، ويحدثان دائمًا معًا (الجملة الكلية محفوظة الإلكترونات). المؤكسد «يرد» (يكتسب) والمختزل « يؤكسد» (يفقد). مثال مركزي في 2AS: شوارد البرمانغانات MnO₄⁻ (مؤكسد قوي) و شوارد الحديد Fe²⁺ (مختزل).'},
{k:'law',t:'المعادلة الموزونة المرجعية (في الوسط الحمضي)',m:'5\\,Fe^{2+}+MnO_{4}^{-}+8\\,H^{+}\\;\\longrightarrow\\;5\\,Fe^{3+}+Mn^{2+}+4\\,H_{2}O',x:'5 إلكترونات تنتقل من Fe²⁺ إلى MnO₄⁻: من هنا النسبة الشهيرة n(Fe²⁺) = 5×n(MnO₄⁻) عند التكافؤ — أطول مسافة بين نقطتين في أسئلة المعايرة هي نسيان هذا الرقم 5.'},
{k:'h2',x:'2. ماذا يحدث عند التكافؤ؟'},
{k:'def',t:'تعريف — التكافؤ',x:'التكافؤ هو حالة الوسط عند استهلاك المتفاعل المحلول (المعاير) والمتفاعل المعايَر معًا تمامًا وفق النسبة الستوكيومترية: لا فائض من أي منهما. حجم المحلول المضاف عند هذه النقطة يسمى حجم التكافؤ V_E.'},
{k:'law',t:'علاقة التكافؤ العامة',m:'\\frac{n_{\\text{unknown}}}{\\text{coef}(\\text{unknown})}=\\frac{n_{\\text{titrant}}}{\\text{coef}(\\text{titrant})}',x:'عدد مولات كلا المتفاعلين مقسومًا على معامله في المعادلة الموزونة متساوٍ عند التكافؤ. لهذه الصيغة الشكلية ميزة: تمنع أخطاء «قلب النسبة» إذا رتبت أطرافها بوعي.'},
{k:'method',t:'منهجية معايرة حجمية كاملة',i:['اكتب المعادلة الموزونة للمتفاعلين وحدد النسبة الستوكيومترية.','راقب تغير اللون (كاشف ذاتي أو مضاف) أو منحنى قياس لتحديد V_E.','أحسب كمية مادة المحلول المعاير: n = C_B×V_E.','اربط بالمعادلة: أوجد كمية المادة المجهولة ثم ركّزها: C_A = n/V_A.','تحقق منطقيًا: التراكيز بحدود معقولة والحسابات بالوحدات الدولية (mL ← L).']},
{k:'ex',t:'مثال محلول كامل: معايرة محلول железوز',x:'معايرة V_A = 20 mL من محلول كبريتات الحديدوز Fe²⁺ بكمية مجهولة التركيز، بمحلول برمانغانات البوتاسيوم K⁺ + MnO₄⁻ تركيزه C_B = 0.02 mol/L. حجم التكافؤ V_E = 10 mL (زوال اللون البنفسجي).\n(1) عند التكافؤ: n(Fe²⁺) = 5×n(MnO₄⁻) (من المعادلة أعلاه).\n(2) n(MnO₄⁻) = C_B×V_E = 0.02×0.010 = 2×10⁻⁴ mol.\n(3) n(Fe²⁺) = 5×2×10⁻⁴ = 10⁻³ mol ومنه: C_A = n/V_A = 10⁻³/0.020 = 0.05 mol/L.\nملاحظة تجريبية: البرمانغانات بنفسجية والحديدوز شاحب — أول فائض من MnO₄⁻ يصبغ الوسط بنفسجيًا: كاشف ذاتي بدون إضافة خارجية.'},
{k:'exer',n:'1',q:'معايرة V_A = 10 mL من محلول H₂O₂ (الماء الأكسجيني) بمحلول برمانغانات C_B = 0.05 mol/L، والتكافؤ عند V_E = 12 mL. المعادلة: 2MnO₄⁻ + 5H₂O₂ + 6H⁺ → 2Mn²⁺ + 5O₂ + 8H₂O. احسب تركيز H₂O₂.',s:['النسبة عند التكافؤ: n(H₂O₂)/5 = n(MnO₄⁻)/2 أي n(H₂O₂) = (5/2)×n(MnO₄⁻).','n(MnO₄⁻) = 0.05×0.012 = 6×10⁻⁴ mol.','n(H₂O₂) = 2.5×6×10⁻⁴ = 1.5×10⁻³ mol ومنه C = 1.5×10⁻³/0.010 = 0.15 mol/L.']},
{k:'exer',n:'2',q:'لماذا نضيف حمض الكبريت المركز إلى وسط معايرة البرمانغانات؟ وماذا يحدث لو استعملنا وسطًا قاعديًا؟',s:['المعادلة المرجعة تعمل في وسط حمضي قوي: شوارد H⁺ ضرورية للميزان (8H⁺ لكل MnO₄⁻) ولضمان اتجاه التفاعل الكامل نحو الإرجاع إلى Mn²⁺.','في وسط قاعدي يتغير مسار الإرجاع (نحو MnO₂ الصلب البني) وتختلف النسبة الستوكيومترية — فتفسد الحسبة ويعتّم الوسط.','لهذا بروتوكول التجربة ينص صراحة على وسط حمضي (غالبًا حمض الكبريت المخفف).']},
{k:'warn',i:['افتراض نسبة 1:1 دون الرجوع للمعادلة الموزونة — أشهر خطأ يفقد نقاط التمرين كاملة.','استعمال أحجام بالمليلتر في حسابات التركيز (يلزم اللتر: ÷1000).','تجاوز حجم التكافؤ (صب سريع في النهاية) — يفسد تعيين V_E.','نسيان أثر التمديد: إذا خُفف المحلول قبل المعايرة فاضرب في عامل التمديد عند النهاية.']},
{k:'sum',i:['أكسدة = فقد إلكترونات، إرجاع = كسب، والمجموعة محفوظة الإلكترونات.','المعادلة المرجعة: 5Fe²⁺ + MnO₄⁻ + 8H⁺ → 5Fe³⁺ + Mn²⁺ + 4H₂O.','التكافؤ: استهلاك تام بالنسبة الستوكيومترية — n/معامل متساوٍ.','C_A×V_A بالنسبة = C_B×V_E بالنسبة المقابلة، والكاشف الذاتي للبرمانغانات يسهل تحديد V_E.']},
{k:'h2',x:'3. منهجية المعايرة (الوصول إلى التكافؤ)'},
{k:'svg',x:'<svg viewBox="0 0 340 180" width="340"><path class="ax" d="M45 20 V150 H315"/><path class="ax" d="M315 150 l-10 -5 m10 5 l-10 5"/><path class="ax" d="M45 20 l-5 10 m5 -10 l5 10"/><text x="300" y="168">V بالمليلتر</text><text x="20" y="30">القياس</text><path class="cv" d="M60 130 C120 128 150 128 170 126 C186 124 190 62 205 58 C225 55 260 52 300 50"/><path class="aux" d="M196 150 V58" stroke-dasharray="5 4"/><circle cx="196" cy="60" r="5" class="pt"/><text x="120" y="42">قفزة التكافؤ</text><text x="178" y="168">VE</text></svg>',cap:'منحنى المعايرة: عند حجم التكافؤ تحدث قفزة حادة في القياس — أساس تعيين التركيز المجهول'},
{k:'method',t:'خطوات معايرة أكسدة-إرجاع موفقة',i:['المحلول المعاير (المرجع) في السحاحة بتركيز معلوم بدقة، والمحلول المجهول في دورق مع كاشف التحول (مثل البروفينول عند معايرة الحديد II بـ MnO₄⁻).','نقرأ الحجم الابتدائي ثم نُنقط المحلول المعاير مع التحريك المستمر حتى التحول الدائم للون.','نسجل الحجم النهائي: الحجم المعاير V_E = الفرق بين القراءتين.','نحسب بالعلاقة (n(oxidant)/coeff) = (n(reductant)/coeff) عند التكافؤ ثم نستخرج التركيز المجهول.']},
{k:'ex',t:'قراءة النتائج',x:'إذا عايرنا V₀ = 20 mL من محلول مجهول التركيز C₀ من Fe²⁺ بسحاحة من MnO₄⁻ تركيزها C = 0.02 mol/L وبلغ الحجم عند التكافؤ V_E = 12 mL:\\nالمعادلة: MnO₄⁻ + 5Fe²⁺ + 8H⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O.\\nعند التكافؤ: C×V_E = 5×C₀×V₀ أي 0.02×12 = 5×C₀×20.\\nC₀ = 0.24/100 = 2.4×10⁻³ mol/L — هكذا نعين كمية المادة دون وزن أو فصل.'},
{k:'warn',i:['تجاوز نقطة التكافؤ (نقطات زائدة بعد التحول) يفسد القياس — الدرجات تُمنح لصحة V_E.','نسيان قراءة السحاحة عند سطح العين يسبب خطأ المنظر (الانكسار الظاهري).','معادلة الأكسدة-الإرجاع يجب موازنتها قبل أي حساب: عدد الإلكترونات المفقودة = المكتسبة.']},
]});

CH_PHYS.push({id:'ph9',title:'مفهوم المجال المغناطيسي',icon:'🌐',sem:3,
desc:'خطوط المجال، شدة المجال B والتسلا، مجال السلك والملف اللولبي، تراكب المجالات، وخصائص المجال.',
keys:['مجال مغناطيسي','تسلا','خطوط','ملف لولبي','B','تراكب','بوصلة'],
obj:'تصف المجال المغناطيسي بخطوطه وتقيس شدته بالتسلا، تحدد اتجاه مجال ناقل وملف لولبي، وتستعمل تراكب المجالات.',
take:['خطوط المجال: تخرج من القطب الشمالي وتغلق على الجنوبي، ولا تتقاطع.','B بالتسلا (T): B أكبر حيث الخطوط أكثر كثافة.','الملف اللولبي الطويل: مجال منتظم داخلية B = μ₀·n·I مع n = N/ℓ.','تراكب: المجال المحصل هو الجمع المتجهي للمجالات المتولدة معًا.'],
sections:[
{k:'h2',x:'1. وصف المجال المغناطيسي'},
{k:'svg',x:'<svg viewBox="0 0 340 170" width="340"><rect x="120" y="72" width="50" height="36" rx="4" class="shape"/><text x="145" y="95" text-anchor="middle">N</text><rect x="170" y="72" width="50" height="36" rx="4" class="shape2"/><text x="195" y="95" text-anchor="middle">S</text><path class="cv" d="M145 72 C118 28 242 28 195 72"/><path class="cv" d="M145 108 C118 152 242 152 195 108"/><path class="cv" d="M140 72 C70 40 280 15 205 72"/><path class="cv" d="M128 108 C60 140 280 165 240 108"/><text x="52" y="46">B</text><text x="170" y="162" text-anchor="middle">خطوط المجال تخرج من N وتغلق على S</text></svg>',cap:'المجال المغناطيسي يُمثل بخطوط موجهة تخرج من القطب الشمالي وتعود إلى الجنوبي'},
{k:'def',t:'تعريف',x:'المجال المغناطيسي هو البنية الفيزيائية التي تصف «التأثير المغناطيسي» في نقاط الفضاء: عند كل نقطة يحمل المجال اتجاهًا (اتجاه استقرار إبرة البوصلة) وشدة B تقاس بالتسلا (T).'},
{k:'ul',i:['خطوط المجال: منحنيات مماس لاتجاه المجال في كل نقطة، ولا تتقاطع أبدًا (اتجاه وحيد في كل نقطة).','كثافة الخطوط تعبر عن الشدة: خطوط متزاحمة = مجال قوي.','حول المغناطيس: الخطوط تخرج من N وتدخل S؛ وداخل المغناطيس تتتم من S إلى N (خطوط مغلقة).','الحديد المنشور يجمع الخطوط (تجارب برادة الحديد) — وسيلة التصوير المخبرية الشهيرة.']},
{k:'h2',x:'2. مجالات التيار'},
{k:'law',t:'مجال الملف اللولبي الطويل',m:'B=\\mu_{0}\\,n\\,I=\\mu_{0}\\,\\frac{N}{\\ell}\\,I\\qquad\\mu_{0}=4\\pi\\times10^{-7}\\,T\\cdot m/A',x:'داخل ملف لولبي طويل: مجال منتظم موازٍ لمحور الملف، اتجاهه بقاعدة اليد اليمنى (أصابع منحنية مع اتجاه اللف، الإبهام = اتجاه B = وجه القطب الشمالي للملف). n عدد اللفات في المتر الواحد.'},
{k:'ex',t:'مثال محلول',x:'ملف لولبي طويل N = 200 لفة على طول ℓ = 20 cm، يمر فيه تيار I = 2 A.\nn = N/ℓ = 200/0.2 = 1000 لفة/m.\nB = μ₀nI = 4π×10⁻⁷×1000×2 = 8π×10⁻⁴ ≈ 2.51×10⁻³ T ≈ 2.5 mT.\nالنسبة إلى المجال الأرضي (~0.05 mT): الملف أقوى بخمسين مرة — لهذا «يعطّل» البوصلة قربه.'},
{k:'h3',x:'المجال المغناطيسي الأرضي'},
{k:'note',t:'مغناطيس الأرض العملاق',x:'الأرض نفسها مصدر مجال مغناطيسي هائل يحمي الحياة من الرياح الشمسية: شدته ضعيفة (نحو 20 إلى 70 ميكروتسلا حسب الموقع) لكنه يمتد آلاف الكيلومترات في الفضاء. البوصلة تتوجه لأن إبرتها المغناطيسية تستجيب للمركبة الأفقية لهذا المجال — ولذلك يوجد قطبا الشمال والجنوب المغناطيسيان قرب القطبين الجغرافيين (بغير تطابق تام)، ودوران الإبرة حول محور عمودي يحدد الميل المحلي للمجال.'},
{k:'h2',x:'3. تراكب المجالات'},
{k:'law',t:'مبدأ التراكب',m:'\\vec B_{\\text{total}}=\\vec B_{1}+\\vec B_{2}+\\cdots',x:'عند وجود عدة مصادر (مغناطيس + ملف...)، المجال المحصل عند كل نقطة هو الجمع المتجهي لمجالات المصادر منفردة. نادرًا ما تكون الاتجاهات واحدة، فيلزم التحليل إلى مركّبات أو تطبيق متباينة المثلث.'},
{k:'ex',t:'مثال محلول: حقلان متعاكسان',x:'على محور ملفين متحاذيين: مجال الأول B₁ = 3 mT نحو اليمين ومجال الثاني B₂ = 1.5 mT نحو اليسار في نفس النقطة.\nالمجال المحصل: B = 3 − 1.5 = 1.5 mT نحو اليمين (الاتجاهان متعاكسان فنطرح جبريًا).'},
{k:'exer',n:'1',q:'بوصلة توضع بين قطبي مغناطيس أفقي مستقيم (الشمال يظهر على اليسار): إبرة البوصلة تستقر نحو الشمال المغناطيسي... صف كيف تحدد اتجاه المجال في تلك المنطقة بالبوصلة نفسها.',s:['الإبرة المغناطيسية تتناظر مع خط المجال في موضعها: قطبها الشمالي يشير إلى اتجاه المجال B في تلك النقطة.','لتعيين الاتجاه بدقة: ضع البوصلة في نقاط عدة وارسم أسهم صغيرة من القطب الشمالي للإبرة في كل موضع.','ربط الأسهم يعطي خطوط المجال الموجهة — الطريقة المخبرية البسيطة لرسم خريطة المجال.']},
{k:'exer',n:'2',q:'ملف لولبي طويل 500 لفة على مساحة ذراع 5 cm (طول الملف 25 cm) يمر به تيار 1.5 A. احسب شدة المجال داخل الملف، ثم وازنها بمجال الأرض (≈ 5×10⁻⁵ T).',s:['n = N/ℓ = 500/0.25 = 2000 لفة/m.','B = μ₀nI = 4π×10⁻⁷×2000×1.5 = 12π×10⁻⁴ ≈ 3.77 mT.','النسبة إلى الأرض: 3.77×10⁻³ ÷ 5×10⁻⁵ ≈ 75 مرة أقوى — مجال الملف «يسيطر» على البوصلة القريبة.']},
{k:'exer',n:'3',q:'لماذا لا تتقاطع خطوط المجال المغناطيسي أبدًا؟',s:['لو تقاطع خطان في نقطة، فسيكون للمجال اتجاهان مختلفان عند النقطة نفسها.','لكن الإبرة المغناطيسية الصغيرة تستقر باتجاه وحيد: اتجاه المجال وحيد في كل نقطة.','إذن التقاطع مستحيل فيزيائيًا — خاصية هندسية ناتجة عن وحيدة الاتجاه.']},
{k:'warn',i:['الخلط بين القطب الشمالي المغناطيسي (يخرج منه الخطوط) والقطب الجغرافي — أسماء متقابلة اصطلاحية.','نسيان تحويل الطول إلى المتر في n = N/ℓ (أشهر خطأ رقمي).','تطبيق B = μ₀nI خارج الملف: الصيغة للداخل المنتظم فقط؛ خارج الملف يشبه مجال سلك (أضعف بكثير).','اعتبار شدة المجال متساوية في كل مكان حول مغناطيس — الشدة تتغير والخطوط تتزاحم عند الأقطاب.']},
{k:'sum',i:['المجال: اتجاه (خطوط موجهة من N إلى S خارج المغناطيس) + شدة B بالتسلا.','الخطوط لا تتقاطع؛ كثافتها تعكس الشدة.','الملف اللولبي: B = μ₀(N/ℓ)I منتظم داخليًا، بقاعدة اليد اليمنى للاتجاه.','التراكب: جمع متجهي للمجالات المحصلة في كل نقطة.']}
]});
CH_PHYS.push({id:'ph10',title:'مقاربة الأفعال المتبادلة الكهرومغناطيسية',icon:'🧲',sem:3,
desc:'الفعل المغناطيسي للتيار، قوة لابلاس على ناقل، قاعدة اليد اليمنى، وتطبيقات المحرك الكهربائي.',
keys:['لابلاس','قوة','تيار','مجال مغناطيسي','ناقل','يد اليمنى','محرك'],
obj:'تفهم أن التيار يولد مجالًا مغناطيسيًا وأن الناقل الحامل لتيار داخل مجال خارجي يتأثر بقوة (لابلاس)، تحدد اتجاه القوة وشدتها.',
take:['ناقل بالتيار داخل مجال مغناطيسي: قوة لابلاس F = I·ℓ·B·sin(α).','اتجاه القوة: قاعدة اليد اليمنى الثلاثية (السبابة مع التيار، الإبهام... حسب الاصطلاح المدرسي).','إذا كان الناقل موازيًا للمجال فالقوة انعدمت (sin α = 0).','المبدأ نفسه وراء المحركات: قوة تبادلية بين تيار ومجال تنتج دورانًا.'],
sections:[
{k:'h2',x:'1. ملاحظة الفعل المتبادل'},
{k:'p',x:'تجارب المنهاج تبرهن الاتجاهين: (1) ناقل يمر فيه تيار ينجذب/ينفرد داخل مجال مغناطيسي (فعل المجال على التيار)؛ (2) ناقل بالتيار يجذب بدوره المغناطيس القريب منه (فعل التيار عبر مجاله). الأفعال متبادلة: كل فعل يقابله رد فعل — وهذا «الزوج» هو أساس المحرك الكهربائي.'},
{k:'def',t:'مفهوم — المجال المغناطيسي',x:'حول المغناطيس وحول الناقل بالتيار توجد منطقة من الفضاء تتأثر فيها إبرة مغناطيسية: نسميها مجالًا مغناطيسيًا ونمثله بخطوط مجال تخرج من القطب الشمالي وتدخل إلى الجنوبي، واتجاه المجال عند كل نقطة هو اتجاه الإبرة المستقرة هناك.'},
{k:'h2',x:'2. قوة لابلاس'},
{k:'law',t:'مقدار القوة',m:'F=I\\;\\ell\\;B\\;\\sin\\alpha',x:'حيث I شدة التيار (A)، ℓ طول الجزء المغمور من الناقل (m)، B شدة المجال المغناطيسي (T تسلا)، و α الزاوية بين اتجاه الناقل واتجاه المجال. القوة عمودية على المستوي الذي يحوي الناقل والمجال معًا.'},
{k:'tbl',h:['وضعية الناقل والمجال','α','القوة'],r:[
['ناقل عمودي على المجال','90°','قصوى: F = IℓB'],
['ناقل مائل (مثل 30°)','بين 0 و 90°','وسطية: F = IℓB sin α'],
['ناقل موازٍ للمجال','0° أو 180°','منعدمة (sin α = 0)']]},
{k:'method',t:'تحديد اتجاه قوة لابلاس (قاعدة الأصابع الثلاثة)',i:['وجه السبابة في اتجاه المجال المغناطيسي B (من الشمال إلى الجنوب خارج المغناطيس).','وجه الوسطى في اتجاه التيار الاصطلاحي I في الناقل.','الإبهام يعطي اتجاه القوة F على الناقل. (ملاحظة: اعتمد الاصطلاح نفسه الذي يعتمده أستاذك في الرسم).']},
{k:'ex',t:'مثال محلول',x:'ناقل مستقيم طوله ℓ = 10 cm يمر فيه تيار I = 2 A، موضوع عموديًا على مجال مغناطيسي منتظم شدته B = 0.5 T.\nالقوة: F = IℓB sin(90°) = 2×0.1×0.5 = 0.1 N.\nلو مُال الناقل فصنع 30° مع المجال: F = 0.1×sin(30°) = 0.05 N، ولو صار موازيًا انعدمت القوة.'},
{k:'p',x:'تطبيق المحرك الكهربائي البسيط (منهاج 2AS): ملف داخل مجال مغناطيسي — القوى المتبادلة على جانبي الملف تشكل «عزمًا» يدوّر الملف؛ المبدّل (كولكتور) يعكس اتجاه التيار كل نصف دورة ليبقى العزم في نفس المنحى — دوران مستمر.'},
{k:'exer',n:'1',q:'ناقل طوله 20 cm بالتيار I = 1.5 A داخل مجال B = 0.4 T. احسب القوة إذا كان عموديًا على المجال، ثم إذا صنع زاوية 45°.',s:['عمودي: F = 1.5×0.2×0.4 = 0.12 N.','بزاوية 45°: F = 0.12×sin(45°) = 0.12×0.707 ≈ 0.085 N.','النسبة بين الحالتين هي sin(45°) ≈ 0.71 — «خسارة» 29% من القوة بسبب الميل.']},
{k:'exer',n:'2',q:'في تجربة السكة القافزة (ناقل على سكتين داخل مجال مغناطيسي عمودي): ماذا يحدث إذا عكسنا اتجاه التيار؟ وإذا عكسنا قطبي المغناطيس؟',s:['عكس التيار يعكس اتجاه القوة (علاقة الأصابع الثلاثة): الناقل يقفز في الجهة المعاكسة.','عكس المجال (قطبَي المغناطيس) يعكس اتجاه القوة أيضًا وله نفس الأثر.','عكس التيار والمجال معًا: عكسان يتلاشيان — القوة تبقى في اتجاهها الأصلي. (استنتاج تجريبي نموذجي في الفروض.)']},
{k:'warn',i:['استعمال ℓ بالسنتيمتر — يلزم المتر في الوحدات الدولية.','نسيان sin α حين يكون الناقل مائلًا عن المجال.','الخلط بين اتجاه التيار الاصطلاحي واتجاه حركة الإلكترونات في قاعدة الأصابع.','توقع قوة على ناقل موازٍ للمجال — انعدام القوة شرط أساسي.']},
{k:'sum',i:['التيار والمجال المغناطيسي: فاعلان متبادلان (محرك!).','F = IℓB sin α — قوة لابلاس عمودية على (الناقل، المجال).','عمودي: قصوى؛ موازٍ: منعدمة.','قاعدة الأصابع الثلاثة تحدد الاتجاه؛ عكس تيار أو مجال يعكس القوة.']},
{k:'h2',x:'3. قوة لورنتس — فعل المجال على شحنة متحركة'},
{k:'svg',x:'<svg viewBox="0 0 340 170" width="340"><circle cx="170" cy="90" r="55" class="cv" stroke-dasharray="4 4"/><circle cx="170" cy="35" r="6" class="pt"/><text x="188" y="32">q</text><path class="cv" d="M176 35 H220"/><path class="ax" d="M220 35 l-10 -5 m10 5 l-10 5"/><text x="228" y="30">v</text><path class="cv" d="M170 43 V72"/><path class="ax" d="M170 72 l-5 -10 m5 10 l5 -10"/><text x="180" y="60">F</text><text x="60" y="24">B</text><text x="52" y="55">×</text><text x="84" y="55">×</text><text x="116" y="55">×</text><text x="52" y="135">×</text><text x="84" y="135">×</text><text x="116" y="135">×</text><text x="170" y="163" text-anchor="middle">حركة دائرية: r = m·v/(q·B)</text></svg>',cap:'شحنة تدخل مجالًا عموديًا على سرعتها فتدور حركة دائرية: قوة لورنتس تلعب دور القوة المركزية'},
{k:'p',x:'قوة لابلاس تصف فعل المجال على ناقل يحمل تيارًا، أي على «سيل» من الشحنات المتحركة. ماذا عن شحنة وحيدة q تتحرك بسرعة v داخل مجال مغناطيسي B؟ الجواب: قوة لورنتس — الأخت الصغرى العامة لقوة لابلاس.'},
{k:'law',t:'قوة لورنتس',m:'F=q\\,v\\,B\\sin\\alpha',x:'F بالنيوتن، q الشحنة بالكولوم، v سرعة الجسيم (m/s)، B شدة المجال (T)، α الزاوية بين السرعة والمجال. القوة عمودية على المستوي الذي يحوي السرعة والمجال معًا.'},
{k:'note',t:'العلاقة مع لابلاس',x:['ناقل طوله ℓ تحمله شحنات متحركة بسرعة v خلال زمن t: الشحنة العابرة q = I·t والمسافة ℓ = v·t أي ℓ = v·(q/I).','بالتعويض في F = qvB: F = (I·t)·v·B = I·(v·t)·B = I·ℓB — قانون لابلاس يظهر من لورنتس!','لورنتس أعم: تشمل الشحنات الحرة (إلكترونات في شاشة التلفاز، جسيمات مشحونة في مسرّع).']},
{k:'ex',t:'مثال محلول',x:'إلكترون كتلته m = 9.1×10⁻³¹ kg وشحنته |q| = 1.6×10⁻¹⁹ C يدخل مجالًا مغناطيسيًا B = 0.5 T بسرعة v = 2×10⁶ m/s عموديًا على المجال.\\nF = qvB = 1.6×10⁻¹⁹ × 2×10⁶ × 0.5 = 1.6×10⁻¹³ N.\\nتسارعه: a = F/m = 1.6×10⁻¹³/9.1×10⁻³¹ ≈ 1.76×10¹⁷ m/s² — تسارع فلكي من مجال متواضع، لكن الكتلة الدقيقة تُبقيه في مسار دائري نصف قطره r = mv/(qB) ≈ 2.3 cm.'},
{k:'exer',n:'3',q:'بروتون يتحرك عموديًا على مجال B = 0.2 T بسرعة 10⁵ m/s. احسب القوة المغناطيسية المؤثرة عليه (q = 1.6×10⁻¹⁹ C).',s:['F = qvB = 1.6×10⁻¹⁹ × 10⁵ × 0.2 = 3.2×10⁻¹⁵ N.','القوة عمودية على السرعة: تغير اتجاهها دون قدرتها — مسار دائري.','نصف القطر: r = mv/qB والكتلة تُعطى في التمرين عادة (1.67×10⁻²⁷ kg) فيعطي r ≈ 5.2 mm.']},
]});

CH_PHYS.push({id:'ph11',title:'التحويل الكهرومغناطيسي',icon:'🔌',sem:3,
desc:'ظاهرة الحث الكهرومغناطيسي، الفيض المغناطيسي، قانون فاراداي، قانون لنز، وتطبيقات المولد الكهربائي والمحول.',
keys:['حث','فاراداي','لنز','فيض مغناطيسي','قوة محركة حثية','مولد','محول'],
obj:'يصف تجربة الحث الكهرومغناطيسي، يحسب الفيض المغناطيسي والقوة المحركة الحثية بقانون فاراداي، يحدد اتجاه التيار الحثي بقانون لنز، ويفهم مبدأ المولد والمحول.',
take:['لا تيار حثي إلا إذا تغير الفيض: حركة المغناطيس أو تغير التيار.','e = −N·dΦ/dt — الإشارة السالبة هي روح قانون لنز.','التيار الحثي يعارض دائمًا السبب الذي ولّده (يكبر التيار؟ يولّد مجالًا معاكسًا).'],
sections:[
{k:'h2',x:'1. تجربة الحث الكهرومغناطيسي'},
{k:'p',x:'حتى سنة 1831 كان الناس يعرفون أن التيار يولّد مجالًا (وحدة المجال المغناطيسي). مايكل فاراداي انطلق من سؤال عبقري بسيط: هل المجال يولّد تيارًا أيضًا؟ الجواب فتح باب الكهرباء الصناعية كلها.'},
{k:'ex',t:'التجربة التاريخية',x:'نصل ملفًا إلى غلفانومتر (أميتر صفري الوسط) دون أي مصدر تيار. ندخل مغناطيسًا في الملف: تدور الإبرة جهة. نوقف المغناطيس: تعود الإبرة إلى الصفر. نخرج المغناطيس: تدور الإبرة جهة معاكسة!\\nالخلاصة: التيار يظهر فقط أثناء الحركة (تغير الفيض) ويعكس جهته مع عكس الحركة.'},
{k:'svg',x:'<svg viewBox="0 0 340 200" width="340"><path class="ax" d="M30 110 H310"/><rect class="shape" x="120" y="78" width="100" height="64" rx="6"/><circle class="pt" cx="146" cy="110" r="9"/><circle class="pt2" cx="172" cy="110" r="9"/><circle class="pt" cx="198" cy="110" r="9"/><path class="dan" d="M248 96 l18 14 m-18 0 l18 -14"/><path class="cv" d="M216 110 H280"/><text x="40" y="70" font-size="12">مغناطيس يدخل</text><text x="140" y="160" font-size="12">ملف موصول بغلفانومتر</text><text x="248" y="88" font-size="12">G</text></svg>',cap:'تجربة فاراداي: حركة المغناطيس تغير الفيض فتولد تيارًا حثيًا مؤقتًا.'},
{k:'def',t:'الفيض المغناطيسي',x:'الفيض المغناطيسي Φ عبر سطح هو «كمية المجال التي تعبره»: يعتمد على شدة المجال B ومساحة السطح S وزاوية ميله. يُقاس بالويبر (Wb).'},
{k:'law',t:'الفيض المغناطيسي',m:'\\Phi=B\\,S\\,\\cos\\alpha',x:'B بالتسلا، S بالمتر المربع، α الزاوية بين عمودي السطح واتجاه المجال. عندما يكون المجال عموديًا تمامًا على السطح: α = 0 أي Φ = BS (فيض أعظمي).'},
{k:'h2',x:'2. قانون فاراداي'},
{k:'p',x:'فاراداي لخص التجربة بقانون كمي: القوة المحركة الحثية الناشئة في ملف تساوي (بالمقدار) سرعة تغير الفيض المغناطيسي عبره مضروبة في عدد لفاته. كلما كان الدخول أسرع والملف أكبر، كان التيار الحثي أقوى.'},
{k:'law',t:'قانون فاراداي',m:'e=-N\\,\\frac{d\\Phi}{dt}',x:'e القوة المحركة الحثية بالفولت، N عدد اللفات، dΦ/dt سرعة تغير الفيض (Wb/s). الإشارة السالبة ليست زينة — إنها قانون لنز كله.'},
{k:'ex',t:'مثال محلول',x:'ملف N = 200 لفة، مساحة كل لفة S = 50 cm² = 5×10⁻³ m²، موضوع في مجال مغناطيسي يكبر بانتظام من 0 إلى 0.4 T خلال Δt = 0.1 s (المجال عمودي على سطح الملف).\\nالفيض يتغير من 0 إلى Φ = B·S = 0.4×5×10⁻³ = 2×10⁻³ Wb.\\nسرعة التغير: dΦ/dt = 2×10⁻³/0.1 = 2×10⁻² Wb/s.\\ne = 200 × 2×10⁻² = 4 V — قوة محركة حثية معتبرة من مجال ضعيف وحركة سريعة!'},
{k:'h2',x:'3. قانون لنز واتجاه التيار الحثي'},
{k:'law',t:'قانون لنز — المعارضة',m:'\\frac{d\\Phi}{dt}>0\\;\\Rightarrow\\;e<0\\;\\;\\;;\\;\\frac{d\\Phi}{dt}<0\\;\\Rightarrow\\;e>0',x:'التيار الحثي يسري دائمًا في الاتجاه الذي يجعل مجاله يعارض التغير الأصلي: إذا دخل المغناطيس بقطبه الشمالي واجهه وجه الملف كقطب شمالي (تنافر يقاوم الدخول)، وعند الخروج يجذبه — والمقاومة هي ثمن الطاقة الحثية (مبدأ انحفاظ الطاقة).'},
{k:'p',x:'هذه «المعارضة» في صميم مبدأ انحفاظ الطاقة: التيار الحثي يحمل طاقة، وهذه الطاقة يجب أن تأتي من عمل خارجي — لذلك نشعر بمقاومة عند تحريك المغناطيس داخل ملف قوي، وكلما أسرعنا في الحركة احتجنا عملا أكبر وحصلنا على تيار أقوى.'},
{k:'note',t:'تطبيقات تغير حياة البشر',x:['المولد الكهربائي: توربين يدوّر ملفًا داخل مجال — طاقة ميكانيكية (سد، بخار، رياح) تتحول إلى كهرباء.','المحول: ملفان على نواة واحدة — التيار المتناوب في الأول يولّد بالحث تيارًا في الثاني بجهد مختلف.','الفرامل المغناطيسية في القطارات: حركة تولّد تيارًا حثيًا يعارض الحركة فيوقفها بنعومة دون احتكاك.']},
{k:'exer',n:'1',q:'ملف فيه 100 لفة يطرح مجالًا يتغير فيضه عبره من 0.02 Wb إلى 0.08 Wb خلال 0.3 s. احسب القوة المحركة الحثية.',s:['dΦ = 0.08 − 0.02 = 0.06 Wb خلال 0.3 s أي dΦ/dt = 0.2 Wb/s.','e = N·dΦ/dt = 100×0.2 = 20 V (بالمقدار).','الفيض يتزايد فيجري التيار الحثي في الاتجاه الذي يعاكس التزايد (لنز).']},
{k:'exer',n:'2',q:'لماذا لا يظهر تيار حثي عندما يبقى المغناطيس ساكنًا داخل الملف مهما كان قويًا؟',s:['الفيض Φ ثابت (لا يتغير مع الزمن) أي dΦ/dt = 0.','e = −N·dΦ/dt = 0 — لا قوة محركة حثية ولا تيار.','الحث ظاهرة «تغير» لا ظاهرة «وجود»: المجال الثابت لا يولد شيئًا.']},
{k:'sum',i:['الحث: تغير الفيض المغناطيسي عبر ملف يولّد قوة محركة حثية.','Φ = B·S·cos α بالويبر، و e = −N·dΦ/dt بالفولت (فاراداي).','لنز: التيار الحثي يعارض سببه — وربح الطاقة من عمل خارجي (المولد والمحول ثمرة هذا القانون).']},
]});

take:['الكربون رباعي التكافؤ ويرتبط تساهميًا مكوّنًا سلاسل وحلقات — أساس الكيمياء العضوية.','الألكانات: CnH2n+2 فحوم مشبعة (روابط أحادية فقط).','الجذر الألكيلي: ألكان ناقص ذرة هيدروجين — صيغته CnH2n+1 واسمه ينتهي بـ «يل».','التسمية: اختر أطول سلسلة، رقّم من الطرف الأقرب للتفرع، ورتّب الجذور أبجديًا.','احتراق الألكان الكامل يعطي CO2 و H2O دائمًا؛ الناقص يعطي C أو CO وتسمّمًا خطرًا.'],

{k:'note',t:'المتزامر (الأيزومر)',x:'الصيغة المجمعة نفسها قد تقابل عدة صيغ مهيكلة مختلفة: المركب C4H10 يوجد بصيغتين (البيوتان الخطي وثنائي ميثيل البروبان المتفرع). هذه الظاهرة تسمى الزمرة (التماثل البنائي) وهي مصدر تنوع الجزيئات العضوية.'},
{k:'h2',x:'2. تمثيل الجزيئات العضوية'},
{k:'svg',x:'<svg viewBox="0 0 340 140" width="340"><circle cx="70" cy="70" r="14" class="shape"/><text x="70" y="75" text-anchor="middle">C</text><circle cx="130" cy="70" r="14" class="shape"/><text x="130" y="75" text-anchor="middle">C</text><circle cx="190" cy="70" r="14" class="shape"/><text x="190" y="75" text-anchor="middle">C</text><circle cx="250" cy="70" r="14" class="shape"/><text x="250" y="75" text-anchor="middle">C</text><path class="ax" d="M84 70 H116"/><path class="ax" d="M144 70 H176"/><path class="ax" d="M204 70 H236"/><path class="aux" d="M62 58 L48 42"/><path class="aux" d="M78 58 L92 42"/><path class="aux" d="M122 58 L110 42"/><path class="aux" d="M138 58 L150 42"/><path class="aux" d="M198 58 L186 42"/><path class="aux" d="M202 58 L214 42"/><path class="aux" d="M258 58 L244 42"/><text x="160" y="112" text-anchor="middle">سلسلة البيوتان: C4H10</text></svg>',cap:'ذرة الكربون رباعية التكافؤ: ترتبط بأربع روابط فتصنع سلاسل — أساس الكيمياء العضوية'},

KP.ma10={pts:['المتتالية الحسابية: نضيف نفس العدد r كل خطوة؛ الهندسية: نضرب في نفس النسبة q.','التمثيل البياني: نقاط معزولة — الحسابية على مستقيم والهندسية على منحنى.','المتتالية المحدودة محصورة بين رقمين؛ التقارب يعني أن u_n تقترب من L عندما تكبر n.','إذا كان |q|<1 فإن q^n تقبل النهاية 0 — أداة حساب نهايات المتتاليات الهندسية.'],

KP.ph4={pts:['الطاقة الكامنة الثقالية تُقاس بالنسبة إلى مرجع يُختار (غالبًا الأرض).','النابض يخزن طاقة مرونية عند شده أو ضغطه.','في غياب الاحتكاك: التذبذب تبادل دائم بين الحركية والمرونية والمجموع محفوظ.'],

KP.ph5={pts:['الطاقة الداخلية طاقة مجهرية: حركية الجزيئات وطاقة ترابطها — تُقاس بالجول، ودرجة الحرارة مجرد مؤشر ترمومتري.','الانتقال الحراري تلقائي دائمًا من الساخن إلى البارد: توصيل بالتماس، حمل في السوائل والغازات، إشعاع دون وسط.','التوازن الحراري حالة النهاية: درجة واحدة، وفي المسعر المعزول مجموع الطاقات المنتقلة يساوي صفرًا.'],
