<script>/* ============ تحديات البكالوريا — تمرين شامل لكل محور ============ */
var BAC={};
BAC.ma1={p:'لتكن f(x) = 2x³ − 3x² + 1 معرفة على ℝ و (C) منحناها. ندرسها كما في الفرض النموذجي.',
parts:['حدد مواضع (C) بالنسبة لمحوري المعلم (حدد a حيث تقطع (C) المحور الأفقي).','درس اتجاه التغير باستعمال f′(x) = 6x(x − 1) وأنشئ جدول التغيرات مع القيم القصوى.','استنتج أن f(x) = (x − 1)²(2x + 1) واشكل موضع المنحنى تجاه المحور الأفقي عند x = 1.'],
s:['التقاطع مع المحور الرأسي: f(0) = 1 أي النقطة (0 ، 1). مع المحور الأفقي: نحل f(x) = 0 بعد التفكيك (انظر الجزء 3): الجذور −1/2 و 1.','f′(x) = 6x(x − 1): موجبة على ]−∞ ، 0[ وسالبة على ]0 ، 1[ وموجبة على ]1 ، +∞[: f تزايدية ثم تناقصية ثم تزايدية. قيمة قصوى نسبية f(0) = 1 وقيمة صغرى نسبية f(1) = 0.','f(1) = 0 و f′(1) = 0: الجذر مزدوج فالمنحنى يمس المحور الأفقي عند x = 1، ويقطعه عند x = −1/2. التفكيك: (x − 1)²(2x + 1) = 2x³ − 3x² + 1 ✓ التحقق بالتنمية.']};
BAC.ma2={p:'لتكن P(x) = x⁴ − 2x³ − 7x² + 8x + 12.',
parts:['تحقق أن −1 و 2 وجذرًا ثالثًا تقترحه القسمة، وعيّن جميع جذور P.','فكّك P إلى جداء عوامل من الدرجة الأولى.','حل المتراجحة P(x) ≥ 0 بدلالة إشارة الجداء.'],
s:['P(−1) = 1 + 2 − 7 − 8 + 12 = 0 ✓ و P(2) = 16 − 16 − 28 + 16 + 12 = 0 ✓ إذن (x + 1)(x − 2) عاملان. القسمة: P = (x + 1)(x − 2)(x² − x − 6) و x² − x − 6 = (x − 3)(x + 2): الجذور {−2 ، −1 ، 2 ، 3}.','P(x) = (x + 2)(x + 1)(x − 2)(x − 3).','الجذور مرتبة: −2، −1، 2، 3. إشارة الجداء تتناوب؛ عند +∞ موجبة: P(x) ≥ 0 على [−2 ، −1] ∪ [2 ، 3].']};
BAC.ma3={p:'لتكن f(x) = x³ − 3x + 2 معرفة على ℝ و (C) منحناها.',
parts:['احسب f′(x) ثم أنشئ جدول تغيرات f وحدد القيم القصوى.','اكتب معادلة المماس (T) لـ (C) في النقطة ذات الفاصلة a = 2.','بيّن أن (C) يقطع المحور الأفقي في x = 1 مع تماس (افحص مضاعفة الجذر).'],
s:['f′(x) = 3x² − 3 = 3(x − 1)(x + 1): f تزايدية على ]−∞ ، −1]، تناقصية على [−1 ، 1]، تزايدية على [1 ، +∞[. قيمة قصوى: f(−1) = 4 وقيمة صغرى: f(1) = 0.','المماس: y = f′(2)(x − 2) + f(2) = 9(x − 2) + 4 = 9x − 14.','f(1) = 0 و f′(1) = 0 إذن (C) يمس المحور عند 1 (جذر مزدوج): f(x) = (x − 1)²(x + 2).']};
BAC.ma4={p:'صندوق يحوي 5 كرات: 2 بيضاء و 3 حمراء. نسحب كرتين واحدة تلو الأخرى دون إرجاع.',
parts:['ارسم شجرة الاحتمالات مع احتمالات كل فرع.','احسب احتمال حصول كرة بيضاء ثم حمراء، واحتمال حصول لونين مختلفين.','احسب احتمال أن تكون الكرة الثانية حمراء (الاحتمال الكلي).'],
s:['السحب الأول: P(بيضاء) = 2/5 و P(حمراء) = 3/5. بعد سحب بيضاء: P(بيضاء) = 1/4 و P(حمراء) = 3/4. بعد سحب حمراء: P(بيضاء) = 2/4 و P(حمراء) = 2/4.','P(ب ثم ح) = 2/5 × 3/4 = 6/20 = 3/10. لونان مختلفان: P(ب،ح) + P(ح،ب) = 3/10 + 3/5 × 1/2 = 3/10 + 3/10 = 6/10 = 3/5.','P(الثانية حمراء) = P(ب)×P(ح|ب) + P(ح)×P(ح|ح) = 3/10 + 3/10 = 3/5 — لاحظ أنها لا تساوي 3/5 بالمصادفة: التحقق بالاحتمال الشرطي هو لب الامتحان.']};
BAC.ma5={p:'لعبة: نرمي حجر نرد مرتين. نفرض على اللاعب 5 دينار للعب. يربح (بالدينار) مجموع النتيجتين × 1.',
parts:['أوجد قانون الاحتمال للربح الخام G (جميع القيم مع احتمالاتها).','احسب E(G) ثم قرر هل اللعبة عادلة. ما الثمن العادل C؟','احسب V(G) و σ(G) واشرح معناهما عمليًا.'],
s:['المجموع يتدرج من 2 إلى 12 باحتمالات معروفة (36 حالة): P(2)=1/36، P(3)=2/36... P(7)=6/36 ثم تنازليًا. G = مجموع − 5: القيم من −3 إلى 7.','E(G) = 7 − 5 = 2 (بما أن E(مجموع نردين) = 7). الربح الصافي بمتوسط 2 د: اللعبة غير عادلة لصالح اللاعب — الثمن العادل C = 7.','V(G) = V(مجموع النردين) = 35/6 ≈ 5.83 و σ ≈ 2.41: التذبذب حول المتوسط كبير نسبيًا — النتيجة الفردية غير مؤكدة رغم أفضلية اللاعب.']};
BAC.ma6={p:'لتكن f(x) = (2x² + x − 1)/(x − 1).',
parts:['حدد نهاية f عند +∞ و −∞ واستنتج مقاربًا أفقيًا أو ميلاً مقاربًا إن وجد.','ادرس النهايات عند 1 (يمينًا ويسارًا) واستنتج المقارب العمودي.','بيّن أن f(x) = 2x + 3 + 2/(x − 1) بعد القسمة واستعملها للتأكد من الميل المقارب.'],
s:['عند ±∞: قسمة على أعلى قوة: f(x) ≈ 2x²/x = 2x: النهاية لانهائية والمنحنى يقترب من مستقيم — مؤشر مقارب مائل سيُحدَّد بدقة في الجزء 3.','عند 1: البسط يساوي 2 + 1 − 1 = 2 ≠ 0 والمقام ينعدم: نهاية لانهائية (+∞ من جهة و −∞ من الأخرى حسب إشارة x − 1) ← مقارب عمودي x = 1.','القسمة الإقليدية: (2x² + x − 1) = (x − 1)(2x + 3) + 2 إذن f(x) = 2x + 3 + 2/(x−1): المقارب المائل هو y = 2x + 3 ✓ متوافق مع ميل 2 في (1).']};
BAC.ma7={p:'دائرة قطرها 12 cm نقطة O. نقطة M تتحرك على الدائرة بحيث الزاوية الموجهة (i→ ، OM→) تقيس t راديان.',
parts:['احسب طول القوس الذي يقطعه M عندما t = 5π/6 ثم المساحة القطاعية المقابلة.','حدد الوضعيات حيث OM→ ⊥ محور الفواصل بدلالة t.','إذا كانت t تتزايد بسرعة 0.5 rad/s، احسب الزمن اللازم لدورة كاملة.'],
s:['الطول: ℓ = R·t = 6 × 5π/6 = 5π cm. المساحة: S = ½R²t = ½ × 36 × 5π/6 = 15π cm².','OM→ عمودي على i→ عندما t = π/2 أو t = 3π/2 (بالمقياس إلى 2π: t ≡ π/2 [2π] أو t ≡ 3π/2 [2π]).','الدورة الكاملة 2π: الزمن = 2π/0.5 = 4π s ≈ 12.57 s.']};
BAC.ma8={p:'في المستوى المنسوب لمعلم متعامد متحد، ليكن التحاكي h ذا المركز O والنسبة k = −2 والتدوير r ذا المركز O وزاوية π/2.',
parts:['عين صورة النقطة A(1 ، 0) بـ r ثم بـ h (الترتيب: h∘r).','بيّن أن التحويل المركب f = h∘r هو تحاكٍ مباشر وحدد علاقته الرياضية M ↦ M′.','أوجد النقاط الثابتة لـ f إن وجدت.'],
s:['r(A) = (0 ، 1) (ربع دورة مباشرة)، ثم التحاكي: OM′ = −2·OM أي h(0 ، 1) = (0 ، −2) وبالتالي f(A) = (0 ، −2).','f(M) = h(r(M)): الدوران يعطي (x ، y) ↦ (−y ، x) ثم التحاكي يضرب بـ −2: النتيجة f: (x ، y) ↦ (2y ، −2x) — تحاكٍ مباشر نسبته −2 (تكبير بمقدار 2 مصحوب بدوران).','النقطة الثابتة تحقق (x ، y) = (2y ، −2x): بالتعويض x = −4x أي x = 0 ثم y = 0: النقطة O وحدها ثابتة — وهي مركز التحويلين المشترك.']};
BAC.ma9={p:'ليكن ABC مثلثًا: AB = 4، AC = 5 و BC = 6 (الوحدة cm).',
parts:['احسب الجداء السلمي AB→·AC→ باستعمال العلاقة الأساسية.','استنتج قياس الزاوية BÂC (بدقة 0.1 درجة).','لتكن H مسقط C على (AB): احسب AH باستعمال الجداء السلمي ثم احسب مساحة المثلث بطريقتين.'],
s:['AB→·AC→ = ½(AB² + AC² − BC²) = ½(16 + 25 − 36) = 2.5.','cos(BÂC) = 2.5/(4×5) = 0.125 ← BÂC ≈ 82.8°.','الإسقاط: AB→·AC→ = AB × AH ← AH = 2.5/4 ≈ 0.63 cm، ومنه CH = √(AC² − AH²) ≈ 4.96 cm. المساحة: ½ × AB × CH ≈ 9.92 cm² — وتتحقق بالطريقة الثانية: ½·AB·AC·sin(82.8°) ≈ 9.92 cm² ✓']};
BAC.ma10={p:'متتالية (uₙ) معرفة بـ u₀ = 2 و uₙ₊₁ = 3uₙ − 2 لكل n ∈ ℕ.',
parts:['لتكن vₙ = uₙ − 1: بيّن أن (vₙ) هندسية وحدد سببها.','عبر عن uₙ بدلالة n ثم احسب نهايتها.','لتكن Sₙ = u₀ + u₁ + ... + uₙ: احسب Sₙ بدلالة n.'],
s:['vₙ₊₁ = uₙ₊₁ − 1 = 3uₙ − 3 = 3(uₙ − 1) = 3vₙ إذن (vₙ) هندسية سببها q = 3 و v₀ = 1.','vₙ = 3ⁿ إذن uₙ = 3ⁿ + 1. بما أن q = 3 > 1: uₙ → +∞ (المتتالية متباعدة).','Sₙ = مجموع (vₖ + 1) = (3ⁿ⁺¹ − 1)/(3 − 1) + (n + 1) = (3ⁿ⁺¹ − 1)/2 + n + 1 — وهي تؤول إلى +∞.']};
BAC.ma11={p:'هرم منتظم S.ABCD قاعدته مربع طول ضلعه 4 m وارتفاعه SO = 3 m.',
parts:['حسب أن (SO) ⊥ (ABC) وبيّن أن الأحرف الجانبية متساوية واحسبها.','احسب قياس الزاوية بين الحرف الجانبي والقاعدة (المسقط).','احسب حجم الهرم ثم المساحة الجانبية الكلية.'],
s:['(SO) ارتفاع الهرم: عمودي على مستوي القاعدة (ABC)، و OA = نصف قطر المربع المحيط بدائرته = 4√2/2 = 2√2. SA = √(SO² + OA²) = √(9 + 8) = √17 ≈ 4.12 m وبالمثل SB = SC = SD (حساب مطابق) — الأحرف الجانبية متساوية ✓','الزاوية بين الحرف الجانبي ومسقطه على القاعدة: cos θ = OA/SA = 2√2/√17 ≈ 0.687 ← θ ≈ 46.7°.','الحجم: V = (1/3)×16×3 = 16 m³. ارتفاع الوجه الجانبي: h = √(SA² − (AB/2)²) = √(17 − 4) = √13 ≈ 3.61 m: مساحة وجه = ½×4×√13 = 2√13، والمساحة الجانبية الكلية = 8√13 ≈ 28.8 m².']};
BAC.ph1={p:'كرة كتلتها 0.5 kg تُقذف أفقيًا بسرعة 8 m/s من ارتفاع 20 m. نحوّل الاحتكاك الهوائي إلى قوة مقاومة ثابتة F = 0.6 N.',
parts:['احسب الطاقة الميكانيكية الأولية E₁ عند القذف (g = 10).','باستعمال مبرهنة الطاقة الميكانيكية، احسب السرعة عند الوصول للأرض.','علّق على مصير الفارق بين E₁ و E₂ النهائية.'],
s:['E₁ = Ec + Epp = ½×0.5×64 + 0.5×10×20 = 16 + 100 = 116 J (بالمرجع مستوى الأرض).','مبرهة الطاقة الميكانيكية: ΔEm = W(المقاومة) = −F×h = −0.6×20 = −12 J إذن E₂ = 104 J = ½×0.5×v² ← v² = 416 و v ≈ 20.4 m/s.','الفارق 12 J تحوّل إلى طاقة داخلية (تسخين الهواء والكرة) — الاحتكاك ينقص الطاقة الميكانيكية ولا يفنيها (المجموع الكلي منحفظ).']};
BAC.ph2={p:'جسم كتلته 2 kg ينزلق على مستوى مائل بزاوية 30° على الأفقيا، مسافة d = 5 m على السطح، تحت تأثير ثقله واحتكاك مقاوم f = 4 N.',
parts:['احسب عمل كل القوى أثناء الانزلاق.','طبّق مبرهنة الطاقة الحركية لإيجاد السرعة عند الأسفل (انطلاق من السكون).','ما يحدث لو غاب الاحتكاك؟ قارن النتيجتين.'],
s:['الثقل: W = mgd·sin(30°) = 2×10×5×0.5 = 50 J. الاحتكاك: W = −fd = −20 J. ردّ فعل السطح: عمودي ← عمل معدوم. المجموع: 30 J.','ΔEc = 30 = ½×2×v² − 0 ← v² = 30، v ≈ 5.5 m/s.','بدون احتكاك: ΔEc = 50 ← v = √50 ≈ 7.1 m/s: الاحتكاك أنقص السرعة النهائية من ≈ 7.1 m/s إلى ≈ 5.5 m/s.']};
BAC.ph3={p:'قرص عزم عطالته J = 0.05 kg·m² حول محوره يخضع لعزم محرك ثابت M = 0.25 N·m من السكون.',
parts:['احسب التسارع الزاوي α ثم السرعة الزاوية بعد t = 4 s.','احسب العمل المبذول خلال هذه المدة والطاقة الحركية الدورانية الناتجة.','تحقق من التوافق بين العمل والطاقة.'],
s:['α = M/J = 0.25/0.05 = 5 rad/s². ω = αt = 20 rad/s (≈ 3.2 دورة/ث).','الزاوية: θ = ½αt² = ½×5×16 = 40 rad. W = Mθ = 0.25×40 = 10 J.','Ec دورانية = ½Jω² = ½×0.05×400 = 10 J ✓ مبرهنة الطاقة الحركية الدورانية محققة تمامًا.']};
BAC.ph4={p:'نابض ثابت مرونيته k = 200 N/m معلق عموديًا. نعلّق كتلة m = 1 kg فيه بهدوء فينضغط/يستطيل x₀ ثم نزيح الكتلة إزاحة إضافية x = 10 cm من موضع التوازن ونطلقها.',
parts:['احسب استطالة التوازن x₀ (g = 10).','احسب الطاقة المرونية المخزنة عند الإزاحة القصوى ثم السرعة العظمى عند العبور بموضع التوازن.','اكتب انحفاظ الطاقة الميكانيكية خلال التذبذب (بدون احتكاك).'],
s:['التوازن: mg = kx₀ ← x₀ = 10/200 = 0.05 m = 5 cm.','E مرونية عند الإزاحة القصوى: E = ½kx² = ½×200×0.01 = 1 J. عند التوازن تتحول كلها حركية: ½mv² = 1 ← v = √2 ≈ 1.41 m/s.','Em = Ec + Ep(مرونية) = ثابتة = ½mv² + ½kx²: التذبذب تبادل دائم بين الحركية والمرونية والمجموع محفوظ.']};
BAC.ph5={p:'نسكب في مسعر (سعته الحرارية مهملة) 0.25 kg من الماء عند 60°C في 0.35 kg من الماء عند 25°C. نأخذ c = 4185 J·kg⁻¹·°C⁻¹ للماء.',
parts:['اكتب شرط التوازن الحراري واستنتج درجة الحرارة النهائية θf.','احسب الطاقة المنتقلة من الماء الساخن ومن الماء البارد وتحقق من المجموع.','نلقي الآن قطعة ألمنيوم (c = 900) كتلتها 0.2 kg عند 100°C في مسعر فيه 0.5 kg ماء عند 20°C: احسب θf الجديدة.'],
s:['الجملة معزولة: 0.25×(θf−60) + 0.35×(θf−25) = 0 → 0.6θf = 15 + 8.75 = 23.75 → θf ≈ 39.6°C.','الساخن: Q₁ = 0.25×4185×(39.6−60) ≈ −21341 J والبارد: Q₂ = 0.35×4185×(39.6−25) ≈ +21340 J — المجموع ≈ 0 ✓','0.2×900×(θf−100) + 0.5×4185×(θf−20) = 0 → 180θf − 18000 + 2092.5θf − 41850 = 0 → 2272.5θf = 59850 → θf ≈ 26.3°C.']};
BAC.ph6={p:'نريد تحضير محلول كبريتات النحاس CuSO₄ (M = 160 g/mol) حجمه V = 250 mL بتركيز C = 0.2 mol/L.',
parts:['احسب كمية المادة والكتلة اللازمتين للتحضير.','نأخذ 50 mL من هذا المحلول ونكمل بالماء المقطر حتى 500 mL: احسب التركيز الجديد وعامل التخفيف.','نضيف 8 g من CuSO₄ إلى 500 mL من محلول تركيزه 0.1 mol/L: احسب التركيز النهائي (الحجم لا يتغير عمليًا).'],
s:['n = C×V = 0.2×0.25 = 0.05 mol → m = n×M = 0.05×160 = 8 g.','C₁ = C₀V₀/V₁ = 0.2×50/500 = 0.02 mol/L وعامل التخفيف f = C₀/C₁ = 10.','n المضافة = 8/160 = 0.05 mol؛ n الكلية = 0.1×0.5 + 0.05 = 0.1 mol → C = 0.1/0.5 = 0.2 mol/L.']};
BAC.ph11={p:'ملف مستوٍ فيه N = 250 لفة، مساحة كل لفة S = 40 cm²، موضوع في مجال مغناطيسي منتظم عمودي على سطح لفاته يتناقص من 0.5 T إلى الصفر خلال Δt = 0.05 s. الملف موصول بدارة مقاومتها الكلية R + r = 10 Ω.',
parts:['احسب الفيض الابتدائي عبر الملف والقوة المحركة الحثية الناشئة.','احسب شدة التيار الحثي أثناء التناقص.','استعمل قانون لنز لتحديد اتجاه التيار، ثم احسب الشحنة المارة في الدارة.'],
s:['Φ₀ = B×S = 0.5×40×10⁻⁴ = 2×10⁻³ Wb؛ |e| = N×ΔΦ/Δt = 250×2×10⁻³/0.05 = 10 V.','I = |e|/(R+r) = 10/10 = 1 A.','الفيض يتناقص فيسري التيار في الاتجاه الذي يولد مجالًا بنفس اتجاه المجال المتناقص (معارضة التناقص — لنز). الشحنة: Q = N×ΔΦ/(R+r) = 250×2×10⁻³/10 = 0.05 C.']};
BAC.ph7={p:'محلول KCl تركيزه C = 0.1 mol/L داخل خلية قياس ثابت الخلية K = ℓ/S = 100 m⁻¹ فأعطت ناقلية G = 1.23 mS.',
parts:['احسب الناقلية النوعية σ ثم الناقلية المولية الأيونية λ(K⁺) + λ(Cl⁻) من المعطيات.','إذا خُفف المحلول 10 مرات، ما الناقلية الجديدة وماذا تفهم؟','كيف نستعمل القياس لمعايرة تركيز مجهول؟'],
s:['σ = G × K = 1.23×10⁻³ × 100 = 0.123 S/m. λ = σ/C = 0.123/100 = 1.23×10⁻³ S·m²/mol = 12.3 mS·m²/mol — قيمة مرجعية معقولة لـ K⁺+Cl⁻.','الناقلية النوعية تتناسب (تقريبًا) مع التركيز: σ′ ≈ 0.0123 S/m — القياس حساس جدًا للتركيز: أساس المعايرة الناقلية.','نرسم خط معايرة σ = f(C) بمحاليل معلومة ثم نقرأ التركيز المجهول من σ المقيسة — أو نتابع انكسار منحنى المعايرة عند التكافؤ.']};
BAC.ph8={p:'معايرة V_A = 20 mL من محلول حمض الأكساليك H₂C₂O₄ مجهول التركيز بمحلول هيدروكسيد الصوديوم NaOH تركيزه C_B = 0.1 mol/L. حجم التكافؤ V_E = 15 mL.',
parts:['اكتب معادلة التفاعل وحدد العلاقة الستوكيومترية عند التكافؤ.','احسب تركيز الحموض المجهول.','لماذا يُعد pH-meter أو الكاشف الملون ضروريًا؟ متى نقرأ V_E؟'],
s:['H₂C₂O₄ + 2NaOH → Na₂C₂O₄ + 2H₂O: حمض ثنائي البروتون: n(H₂C₂O₄) = ½n(OH⁻) عند التكافؤ.','n(OH⁻) = C_B×V_E = 0.1×0.015 = 1.5×10⁻³ mol ← n(حمض) = 7.5×10⁻⁴ mol ← C_A = 7.5×10⁻⁴/0.020 = 0.0375 mol/L.','نقرأ V_E عند التغير الحاد لـ pH (المنعطف) أو تغير لون الكاشف الدائم: لأول مرة يدوم بفائض القاعدة — التكافؤ ليس نقطة التلون الأولى بل آخر تلون دائم.']};
BAC.ph10={p:'ناقل مستقيم طوله ℓ = 5 cm يمر به تيار I = 2 A موضوع عموديًا على مجال مغناطيسي منتظم B = 0.3 T.',
parts:['احسب شدة قوة لابلاس وحدد اتجاهها (القاعدة الثلاثية).','ماذا يحدث إذا ضوعف كل من I و B معًا؟','اذكر تطبيقًا صناعيًا وأهمية المبدل في المحرك الكهربائي.'],
s:['F = IℓB·sin(90°) = 2×0.05×0.3 = 0.03 N، واتجاهها عمودي على المستوي (I→ ، B→) حسب قاعدة اليد اليمنى الثلاثية.','F تتناسب مع I×B ← تتضاعف مرتين: F′ = 4F = 0.12 N.','المحرك: قوى لابلاس على جانبي الملف تولد عزمًا دوّارًا؛ المبدل يعكس اتجاه التيار كل نصف دورة ليبقى العزم في نفس الاتجاه — سر مستمر واحد.']};
BAC.ph9={p:'ملف لولبي طوله 50 cm بعدد N = 500 لفة، يمر به تيار I = 2 A.',
parts:['احسب شدة المجال داخل الملف B₀ (μ₀ = 4π×10⁻⁷).','احسب B عند مضاعفة التيار وعند مضاعفة عدد اللفات مع نفس الطول.','كيف يتغير المجال خارج الملف؟ وما القيمة عند منتصف الملف بدقة؟'],
s:['n = N/ℓ = 500/0.5 = 1000 لفة/m. B₀ = μ₀nI = 4π×10⁻⁷×1000×2 = 2.51×10⁻³ T ≈ 2.5 mT.','B يتناسب مع nI خطيًا: مضاعفة I ← 5 mT؛ مضاعفة N (بنفس ℓ) ← 5 mT أيضًا — كثافة اللفات والتيار مؤثران بالقدر نفسه.','خارج الملف يتلاشى المجال بسرعة (يشبه مجال مغناطيس قصير)؛ في المنتصف داخل الملف الطويل: المجال منتظم تقريبًا وموازٍ لمحور الملف.']};
BAC.ph12={p:'هبتان خطي C7H16 محرق احتراقًا كاملًا في جهاز قياس حرارة مع 8 L من O₂ (شروط عادية Vm = 24 L/mol).',
parts:['اكتب معادلة الاحتراق الكامل موزونة.','هل كمية الأكسجين كافية لاحتراق كل الهبتان إذا كان 0.04 mol؟','احسب كمية CO2 المنبعثة إذا احترق 0.04 mol بالكامل.'],
s:['C7H16 + 11 O2 → 7 CO2 + 8 H2O (القاعدة: (3×7+1)/2 = 11).','n(O2 المتوفر) = 8/24 = 1/3 mol. المطلوب: 11×0.04 = 0.44 mol > 0.33 mol — الأكسجين غير كافٍ: يحدث احتراق ناقص (خطر CO) أو يتبقى هبتان.','لو اكتمل الاحتراق: n(CO2) = 7×0.04 = 0.28 mol — للانبعاث 0.28 mol × 44 g/mol = 12.3 g من CO2.']};
</script>

{q:'الدالة f(x) = x³ تزايدية على:',o:['[0 ، +∞[ فقط','ℝ',']−∞ ، 0] فقط','لا تزايدية ولا تناقصية'],a:1,why:'x³ تزايدية على ℝ كله لأن a³ − b³ له إشارة a − b.'},

]};

QUIZZES.ma3={qs:[
{q:'اشتقاقية الدالة f(x) = x³ هي:',o:['3x²','x²','3x','x⁴/4'],a:0,why:'(xⁿ)′ = n·xⁿ⁻¹ مع n = 3: (x³)′ = 3x².'},
{q:'معادلة المماس لمنحنى f عند a ذات الصيغة:',o:['y = f′(a)(x − a) + f(a)','y = f(a)(x − a) + f′(a)','y = f′(a) + f(a)x','y = f(a)x − f′(a)'],a:0,why:'المماس يمر بالنقطة (a ، f(a)) وميله f′(a).'},
{q:'مشتق الدالة f(x) = (2x + 1)(x − 3) هو:',o:['2(x − 3) + (2x + 1)','(2x + 1) − (x − 3)','2x + 3','4x + 5'],a:0,why:'قاعدة الجداء: (uv)′ = u′v + uv′ مع u = 2x+1 و v = x−3: 2(x−3) + (2x+1) = 4x − 5.'},
{q:'إذا كانت f′(x) > 0 على مجال I فإن f:',o:['تزايدية على I','تناقصية على I','ثابتة على I','قاطعة لمحور التراتيب'],a:0,why:'إيجابية المشتق تعني تزايد الدالة — هذا جوهر دراسة الاتجاه.'},
{q:'f(x) = 1/x موجودة على ℝ*؛ مشتقها هو:',o:['−1/x²','1/x²','−1/x','1/x'],a:0,why:'(x⁻¹)′ = −x⁻² = −1/x².'}
]};

QUIZZES.ma4={qs:[
{q:'احتمال وقوع حدث مستحيل يساوي:',o:['0','1','0.5','غير معرف'],a:0,why:'P = 0 للحدث المستحيل و P = 1 للحدث المؤكد، وكل الاحتمالات بين 0 و 1.'},
{q:'إذا كانت A و B حدثين منفصلين فإن P(A ∪ B) =',o:['P(A) + P(B)','P(A) + P(B) − P(A∩B)','P(A)×P(B)','P(A|B)'],a:0,why:'الانفصال يعني P(A∩B) = 0 فتسقط العبارة P(A∩B) من صيغة الجمع.'},
{q:'P(A) = 0.3 و P(B) = 0.4 و A و B مستقلان. كم يساوي P(A∩B)؟',o:['0.12','0.7','0.1','0.58'],a:0,why:'الاستقلال: P(A∩B) = P(A)×P(B) = 0.3×0.4 = 0.12.'},
{q:'عند رمي حجر نرد مرة واحدة، احتمال الحصول على عدد زوجي هو:',o:['1/2','1/3','1/6','2/3'],a:0,why:'الأعداد الزوجية {2 ، 4 ، 6} أي 3 حالات من 6: 3/6 = 1/2.'},
{q:'P(Ā) حيث P(A) = 0.25 يساوي:',o:['0.75','0.25','1','0.5'],a:0,why:'الحدث المضاد: P(Ā) = 1 − P(A) = 0.75.'}
]};

QUIZZES.ma5={qs:[
{q:'الرجاء الرياضي E(X) لمتغير عشوائي X هو:',o:['Σ pᵢ·xᵢ','Σ xᵢ','Σ pᵢ','الوسيط'],a:0,why:'الرجاء = المتوسط المرجح: E(X) = Σ pᵢxᵢ على كل القيم الممكنة.'},
{q:'V(X) التباين يساوي:',o:['E(X²) − E(X)²','E(X)² − E(X)','E(X − X̄)','E(X²) + E(X)²'],a:0,why:'صيغة كوينيغ: V = E(X²) − [E(X)]² ≥ 0 دائمًا.'},
{q:'X تأخذ القيمة 1 باحتمال 1/3 والقيمة −2 باحتمال 2/3. E(X) =',o:['−1','0','1','−2/3'],a:0,why:'E = 1×(1/3) + (−2)×(2/3) = 1/3 − 4/3 = −1.'},
{q:'في لعبة عادلة (ربح صافي رجاءه 0) ثمن المشاركة C يحدد من:',o:['E(الربح الخام) = C','E(الربح الخام) = 2C','C = V(X)','C = σ(X)'],a:0,why:'اللعبة عادلة إذا كان رجاء الربح الصافي (بعد خصم الثمن) معدوما: E(X) − C = 0.'},
{q:'σ(X) الانحراف المعياري يساوي:',o:['√V(X)','V(X)²','V(X)/2','E(X)'],a:0,why:'σ = √V بوحدات نفس X (الجذر يحرر الوحدات من التربيع).'}
]};

QUIZZES.ma6={qs:[
{q:'حد n للدالة f définie بـ f(n) = 1/n هو:',o:['0 عند +∞','1 عند +∞','+∞ عند +∞','لا وجود له'],a:0,why:'كلما كبر n صغر 1/n ويقترب من 0 دون بلوغه.'},
{q:'حد الدالة f(x) = (x² − 1)/(x − 1) عند x → 1 هو:',o:['2','1','0','لا نهاية'],a:0,why:'بعد اختزال (x − 1): f(x) = x + 1 وحدّها عند 1 هو 2 (النهاية اليمينية واليسارية معا).'},
{q:'إذا كانت f(x) → +∞ و g(x) → +∞ فإن f − g:',o:['صيغة غير معينة','+∞ دائمًا','−∞ دائمًا','0'],a:0,why:'∞ − ∞ صيغة غير معينة: النتيجة تتطلب إعادة كتابة (توحيد المقامات، المرافقات...).'},
{q:'حد (2x + 1)/(x − 3) عند x → +∞ هو:',o:['2','0','1/3','+∞'],a:0,why:'نقسم على x: (2 + 1/x)/(1 − 3/x) → 2/1 = 2 — النسبة بين معاملي أعلى درجة.'},
{q:'المقاربة الأفقية لمنحنى f(x) = 5/(x + 1) هي المستقيم:',o:['y = 0','x = 0','y = 5','y = −1'],a:0,why:'الحد عند ±∞ يساوي 0: المحور الماص للمحات مقارب أفقي (والخط x = −1 مقارب عمودي).'}
]};

QUIZZES.ma7={qs:[
{q:'قياس الزاوية الموجهة (u→ ، v→) = −π/4 يعني أن v→ يوضع من u→ بـ:',o:['ثمن دورة بالمعاكس للمباشر','نصف دورة بالمعاكس','ربع دورة بالاتجاه المباشر','دورة كاملة'],a:0,why:'π/4 راديان = 45° = ثمن الدورة (360°/8)، والإشارة السالبة تعني المنحى غير المباشر.'},
{q:'قياس الزاوية 120° بالراديان هو:',o:['2π/3','π/2','3π/4','π/3'],a:0,why:'التحويل: 120 × π/180 = 2π/3 راديان.'},
{q:'نصف قطر الدائرة R = 3 وقياس الزاوية المركزية θ = π/6. طول القوس هو:',o:['π/2','π/6','1','3π'],a:0,why:'الطول ℓ = R·θ = 3 × π/6 = π/2.'},
{q:'الزوايا الموجهة (u→ ، v→) و (v→ ، u→) تحققان:',o:['مجموعهما ≡ 0 [2π]','مجموعهما ≡ π [2π]','متساويتان دائمًا','حاصل ضربهما = 1'],a:0,why:'(u→ ، v→) + (v→ ، u→) ≡ 0 [2π] — عكس الترتيب يعكس القياس.'},
{q:'قياس الزاوية المستوية (u→ ، −u→) هو:',o:['π','0','π/2','2π'],a:0,why:'المتجهة المعاكسة تشكل زاوية منبسطة: π (نصف دورة).'}
]};

QUIZZES.ma8={qs:[
{q:'التحاكي h ذا المركز O والنسبة k = −2 يحول M إلى M′ حيث:',o:['OM→′ = −2 OM→','OM→′ = 2 OM→','OM→′ = −OM→/2','OM→′ = OM→'],a:0,why:'h(O ، k): OM→′ = k·OM→ والنسبة السالبة تعني دوران نصف مع التكبير بمقدار |k|.'},
{q:'الانسحاب بالمتجهة u→ يحول M إلى:',o:['M + u→','M − u→','M × u→','u→ − M'],a:0,why:'t(u→): M ↦ M′ بحيث MM→′ = u→ أي M′ = M + u→ (بإحداثيات النقط).'},
{q:'التدوير بزاوية π/2 حول O يحول (x ، y) إلى:',o:['(−y ، x)','(y ، −x)','(x ، −y)','(−x ، y)'],a:0,why:'الدوران المباشر بربع دورة: (x ، y) ↦ (−y ، x) — طبّقها على (1 ، 0) ↦ (0 ، 1) للتحقق.'},
{q:'التحويل الذي يحافظ على المسافات والزوايا هو:',o:['الانسحاب والتدوير','التحاكي فقط','التناظر المحوري فقط','الإسقاط'],a:0,why:'الانسحاب والتدوير والتناظر تحويلات متساوية (isométries): تحفظ المسافات.'},
{q:'التحاكي h(O ، k = 1) هو:',o:['التطابق (كل النقط ثابتة)','انسحاب بمتجهة غير معدومة','تناظر مركزي','تدوير بزاوية π'],a:0,why:'OM→′ = 1×OM→ أي M′ = M لكل نقطة: التحاكي بالوحدة هو تحويل التطابق.'}
]};

QUIZZES.ma9={qs:[
{q:'الجداء السلمي u→·v→ حيث u→=(1،2) و v→=(3،−1) يساوي:',o:['1','5','−1','3'],a:0,why:'xx′ + yy′ = 1×3 + 2×(−1) = 3 − 2 = 1.'},
{q:'u→ ⊥ v→ إذا وفقط إذا:',o:['u→·v→ = 0','u→·v→ = 1','‖u→‖ = ‖v→‖','u→ = v→'],a:0,why:'تعامد المتجهتين يكافئ انعدام الجداء السلمي (مع u→ و v→ غير معدومتين).'},
{q:'إذا كانت (u→ ، v→) = π/3 و ‖u→‖=2 و ‖v→‖=3 فإن u→·v→ =',o:['3','6','1.5','√3'],a:0,why:'u→·v→ = ‖u→‖‖v→‖cos(π/3) = 2×3×0.5 = 3.'},
{q:'الجداء u→·u→ يساوي:',o:['‖u→‖²','‖u→‖','0','2‖u→‖'],a:0,why:'المربع السلمي: u→·u→ = ‖u→‖²cos(0) = ‖u→‖².'},
{q:'AB→·AC→ > 0 يعني أن الزاوية BAC:',o:['حادة','منفرجة','منبسطة','قائمة'],a:0,why:'إيجابية cos يعني زاوية حادة (بين 0 و π/2).'}
]};

QUIZZES.ma10={qs:[
{q:'المتتالية (uₙ) حسابية بـ u₀ = 3 وسببها r = −2. u₅ =',o:['−7','13','7','−13'],a:0,why:'u₅ = u₀ + 5r = 3 + 5×(−2) = −7.'},
{q:'المتتالية الهندسية بـ u₀ = 2 وسببها q = 3. u₃ =',o:['54','24','18','8'],a:0,why:'u₃ = u₀×q³ = 2×27 = 54.'},
{q:'متتالية حسابية سببها r > 0 هي:',o:['تزايدية','تناقصية','ثابتة','متذبذبة'],a:0,why:'uₙ₊₁ − uₙ = r > 0: كل حد أكبر من سابقه.'},
{q:'مجموع أول n حد لمتتالية حسابية هو:',o:['n(u₁ + uₙ)/2','n×u₁','u₁ + rn','n(n+1)/2'],a:0,why:'Sₙ = (عدد الحدود)×(أول حد + آخر حد)/2.'},
{q:'متتالية هندسية سببها q = 1/2 و u₀ = 8. مجموع الحدود اللانهائي هو:',o:['16','8','4','12'],a:0,why:'S = u₀/(1 − q) = 8/(1/2) = 16 صالح لأن |q| < 1.'}
]};

QUIZZES.ma11={qs:[
{q:'إذا كان (d) ⊥ (P) و (d) ⊂ (Q) فإن كل مستقيم في (P):',o:['عمودي على (Q)','موازٍ لـ (Q)','يقطع (Q)','منحرف'],a:0,why:'(d) عمودي على كل مستقيم في (P) وهو من (Q)، إذن (P) ⊥ (Q) — خاصية التعامد بين المستويات.'},
{q:'المستقيمان المنحرفان هما مستقيمان:',o:['غير مستويين وغير متقاطعين','متوازيان','متقاطعان','متعامدان'],a:0,why:'الانحراف: لا يوجد مستو يحويهما معًا ولا هما متقاطعان.'},
{q:'إذا كان a عموديًا على مستويين (P) و (Q) متوازيين فإن المسافة بينهما:',o:['ثابتة على امتداد المستويين','متغيرة','معدومة','غير معرفة'],a:0,why:'تعريف التوازي: المسافة بين كل نقطة من (P) و (Q) واحدة.'},
{q:'(AB) ⊥ (P) يعني:',o:['(AB) ⊥ لكل مستقيم في (P)','(AB) ⊥ لخاط واحد في (P)','(AB) ⊂ (P)','(AB) ∥ (P)'],a:0,why:'تعامد مستقيم على مستوٍ: تعامده مع كل مستقيمين متقاطعين من (P)، ويستنتج تعامده مع كل مستقيمات (P).'},
{q:'قياس الزاوية بين مستقيم ومستوٍ يُعرّف بأنه قياس الزاوية بين:',o:['المستقيم ومسقطه العمودي على المستوي','المستقيم وأي مستقيم في المستوي','مستويين عموديين','الناظم والعمودي'],a:0,why:'الزاوية بين (d) و (P) هي الزاوية بين (d) ومسقطه العمودي على (P).'}
]};

QUIZZES.ph1={qs:[
{q:'في جملة معزولة، مجموع كل أشكال الطاقة:',o:['ثابت','يتناقص','يتزايد','يتذبذب'],a:0,why:'مبدأ الانحفاظ: الطاقة لا تفنى ولا تستحدث بل تتحول فقط.'},
{q:'الاحتكاك يحول الطاقة الميكانيكية إلى:',o:['طاقة داخلية','طاقة كامنة مرونية','لا شيء','طاقة نووية'],a:0,why:'الاحتكاك «يسخن» الأسطح: تحول إلى طاقة داخلية (حركية مجهرية).'},
{q:'Em = Ec + Ep تُسمى:',o:['الطاقة الميكانيكية','الطاقة الكلية','الطاقة الداخلية','الطاقة الكيميائية'],a:0,why:'المجموع حركي + كامن = الطاقة الميكانيكية للجملة.'},
{q:'انحفاظ Em مشروط بـ:',o:['غياب القوى اللاتحفظية (الاحتكاك)','وجود الاحتكاك','ثبات السرعة','الجملة مغلقة ميكانيكيًا فقط'],a:0,why:'القوى المحافظة وحدها لا تغير Em؛ الاحتكاك ينقصها.'}
]};

QUIZZES.ph2={qs:[
{q:'عمل قوة عمودية على الحركة يساوي:',o:['0','موجبًا','سالبًا','F×d'],a:0,why:'W = Fd·cos(90°) = 0 — القوى العمودية لا تعمل.'},
{q:'Ec = ½mv² حيث m بالكيلوغرام و v:',o:['بالمتر في الثانية','بالكيلومتر في الساعة','بالسنتيمتر في الثانية','بأي وحدة'],a:0,why:'الوحدات الدولية إلزامية وإلا فالنتيجة ليست بالجول.'},
{q:'جسم 4 kg سرعته من 2 إلى 6 m/s. ΔEc =',o:['64 J','16 J','48 J','8 J'],a:0,why:'½×4×(36 − 4) = 2×32 = 64 J.'},
{q:'مبرهنة الطاقة الحركية تنص على أن ΔEc يساوي:',o:['مجموع أعمال القوى الخارجية','مجموع القوى','الطاقة الميكانيكية','الشغل الصافي للثقل فقط'],a:0,why:'ΔEc(B−A) = ΣW لكل القوى الخارجية المؤثرة على الجملة.'},
{q:'قوة معاكسة للحركة تصنع 180°: عملها:',o:['مقاوم (سالب)','محرك (موجب)','عدمي','أقصى موجب'],a:0,why:'cos(180°) = −1: العمل سالب ويأخذ أقصى قيمة مطلقة في المقاومة.'}
]};

QUIZZES.ph3={qs:[
{q:'السرعة الزاوية ω لوحدة قياسها:',o:['rad/s','m/s','tours/s','N·m'],a:0,why:'ω = Δθ/Δt بالراديان في الثانية (و f بالهرتز للدورات).'},
{q:'عزم القوة M = F·d حيث d هي:',o:['ذراع العزم (المسافة من المحور)','طول القوة','المسافة المقطوعة','نصف القطر دائمًا'],a:0,why:'d المسافة بين المحور وخط تأثير القوة (الذراع).'},
{q:'Ec دورانية = ½Jω² حيث J:',o:['عزم العطالة حول المحور','الكتلة','الوزن','العزم'],a:0,why:'J = Σmr² يتعلق بتوزيع الكتلة حول محور الدوران (kg·m²).'},
{q:'بعد دورة كاملة θ =',o:['2π راديان','π راديان','π/2 راديان','360 راديان'],a:0,why:'الدورة الكاملة = 2π راديان = 360°.'}
]};

QUIZZES.ph4={qs:[
{q:'Epp = mgz: قيمة z تقاس من:',o:['مستوى مرجعي نختاره','مركز الأرض','أي نقطة ثابتة عالميًا','سطح البحر دائمًا'],a:0,why:'المرجع اختيار منهجي حر — ولهذا الفروق ΔEpp فقط هي المطلقة المعنى.'},
{q:'طاقة نابض ثابت مرونيته k مشدود بمقدار x هي:',o:['½kx²','kx','½kx','kx²'],a:0,why:'مساحة المثلث تحت خط F = kx تعطي ½Fx = ½kx².'},
{q:'ΔEp = −ΣW(القوى المحافظة): إشارة السالب تعني:',o:['العمل يستهلك من الطاقة الكامنة أو يخزن فيها','خطأ في العلاقة','القوى سالبة','الطاقة سالبة'],a:0,why:'النزول (عمل الثقل موجب) يطرح من Epp، والصعود يخزن فيها — علاقة عكسية.'},
{q:'بدون احتكاك أثناء سقوط حر:',o:['Em ثابتة','Em تتناقص','Ec ثابتة','Epp ثابتة'],a:0,why:'التحول الدائم بين Epp و Ec يجعل مجموعهما ثابتًا في غياب القوى اللاتحفظية.'}
]};

QUIZZES.ph5={qs:[
{q:'وحدة الطاقة الداخلية هي:',o:['الجول (J)','الواط (W)','النيوتن (N)','التسلا (T)'],a:0,why:'الطاقة الداخلية طاقة فتقاس بالجول مثل كل الطاقات.'},
{q:'الانتقال الحراري بالتماس المباشر من جسيم إلى جارته يسمى:',o:['التوصيل','الحمل','الإشعاع','التوازن'],a:0,why:'هذا تعريف التوصيل، سائد في المواد الصلبة.'},
{q:'في العلاقة Q = m·c·Δθ فإن c تمثل:',o:['السعة الحرارية النوعية','الكتلة','درجة الحرارة','الناقلية'],a:0,why:'c هي السعة الحرارية النوعية (J·kg⁻¹·°C⁻¹) ولماء نحو 4185.'},
{q:'في مسعر معزول، مجموع كميات الطاقة المنتقلة بين الأجزاء:',o:['يساوي صفرًا','موجب دائمًا','سالب دائمًا','يعتمد على الكتل'],a:0,why:'الجملة معزولة: ما يفقده الساخن يكسبه البارد تمامًا فالمجموع صفري.'},
{q:'الطريقة التي لا تحتاج وسطًا ماديًا لانتقال الطاقة:',o:['الإشعاع','التوصيل','الحمل','التخفيف'],a:0,why:'الإشعاع موجات كهرومغناطيسية تعبر الفراغ — هكذا يصلنا دفء الشمس.'}
]};
QUIZZES.ph6={qs:[
{q:'عدد أفوكادرو يساوي:',o:['6.02×10²³','3.14×10⁸','9.8','1000'],a:0,why:'المول الواحد يحوي 6.02×10²³ كيانًا.'},
{q:'كمية المادة في 36 g من الماء (M = 18 g/mol):',o:['2 mol','0.5 mol','36 mol','18 mol'],a:0,why:'n = m/M = 36/18 = 2 mol.'},
{q:'وحدة التركيز المولي C هي:',o:['mol/L','g/L','mol','L'],a:0,why:'C = n/V: مول في اللتر. أما g/L فهي وحدة التركيز الكتلي.'},
