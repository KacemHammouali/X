take:['u→·v→ = |u→||v→|cos θ — التعريف بالزاوية.','u→·v→ = xx′ + yy′ — التعريف بالإحداثيات (الأسرع حسابًا).','u→·v→ = 0 ⟺ u→ ⊥ v→ (لمتجهين غير صفريين) — بوابية التعامد.','u→·u→ = |u→|² ومنه النورم بالجداء السلمي.'],
sections:[
{k:'h2',x:'1. الجداء السلمي: تعريف'},
{k:'def',t:'تعريف — بالزاوية',x:'ليكن u→ و v→ متجهين غير صفريين و θ الزاوية غير الموجهة بينهما (θ ∈ [0 , π]). الجداء السلمي للمتجهين هو العدد الحقيقي:'},
{k:'math',x:'\\vec{u}\\cdot\\vec{v}=\\|\\vec{u}\\|\\,\\|\\vec{v}\\|\\cos\\theta'},
{k:'p',x:'الجداء السلمي عدد وليس متجهًا — من هنا جاء اسمه «سلمي». نتيجته تكشف «المقدار الذي يعمل به متجه في اتجاه الآخر»: إذا كان θ حادة فالجداء موجب، إذا كان قائمة فالجداء صفر، وإذا كان منفرجة فالجداء سالب.'},
{k:'def',t:'تعريف — بالإحداثيات (في معلم متعامد ممنظم)',x:'إذا كان u→(x , y) و v→(x′ , y′) في معلم متعامد ممنظم فإن:'},
{k:'math',x:'\\vec{u}\\cdot\\vec{v}=x\\,x\'+y\\,y\''},
{k:'law',t:'الجداء السلمي والمسافة (النورم)',m:'\\vec{u}\\cdot\\vec{u}=\\|\\vec{u}\\|^{2}\\qquad\\qquad AB=\\|\\overrightarrow{AB}\\|=\\sqrt{(x_{B}-x_{A})^{2}+(y_{B}-y_{A})^{2}}',x:'مسافة نقطتين = جذر مربع الجداء السلمي للمتجه الموصل بينهما بنفسه. هكذا «تصبح» كل مسألة مسافات مسألة جداء سلمي.'},
{k:'h2',x:'2. خصائص الجداء السلمي'},
{k:'tbl',h:['الخاصية','الصيغة'],r:[
['التبادلية','u→·v→ = v→·u→'],
['التوزيعية على الجمع','u→·(v→ + w→) = u→·v→ + u→·w→'],
['المرشد (التجانس)','(k u→)·v→ = k (u→·v→)'],
['الجداء مع نفسه','u→·u→ = |u→|² (ومنه |u→| = √(u→·u→))'],
['علاقة النورم للمجموع','|u→ + v→|² = |u→|² + 2 u→·v→ + |v→|²']]},
{k:'ex',t:'مثال محلول: استخراج زاوية',x:'u→(1 , 2) و v→(3 , −1) في معلم متعامد ممنظم.\n(1) الجداء السلمي: u→·v→ = 1×3 + 2×(−1) = 3 − 2 = 1.\n(2) النورمان: |u→| = √(1+4) = √5 و |v→| = √(9+1) = √10.\n(3) cos θ = 1/(√5×√10) = 1/√50 ≈ 0.1414 ومنه θ ≈ 81.87°.\nالزاوية حادة (جداء موجب) لكن قريبة من القائمة ✓.'},
{k:'p',x:'الجداء السلمي ليس مجرد «حساب» — إنه آلة جبرية كاملة: يتحلل على الجمع، يتفاعل مع المعاملات، ويمنحنا الطاقة الأقوى للبرهان: u→·u→=|u→|².'},
{k:'law',t:'قوانين الجمع والتحويل (توزيعية)',m:'\\vec{u}\\cdot(\\vec{v}+\\vec{w})=\\vec{u}\\cdot\\vec{v}+\\vec{u}\\cdot\\vec{w}\\;\\;\\;;\\;\\;(k\\vec{u})\\cdot\\vec{v}=k(\\vec{u}\\cdot\\vec{v})\\;\\;\\;;\\;\\;\\vec{u}\\cdot\\vec{u}=\\|\\vec{u}\\|^{2}',x:'الجداء «يتصرف كالضرب العادي» مع الجمع والضرب بمعامل — وهذا يسمح بتوسيع وتفكيك تعابير الجداء كما نفعل في الجبر.'},
{k:'svg',x:'<svg viewBox="0 0 340 175" width="340"><path class="ax" d="M20 130 H320"/><path class="ax" d="M320 130 l-10 -5 m10 5 l-10 5"/><path class="sol" d="M60 130 L250 130"/><path class="sol" d="M250 130 l-10 -5 m10 5 l-10 5"/><path class="cv" d="M60 130 L180 55"/><path class="cv" d="M180 55 l-12 0 m12 0 l-9 7"/><path class="aux" d="M180 55 V130"/><text x="64" y="124">O</text><text x="255" y="124">A</text><text x="184" y="48">B</text><text x="184" y="150">H</text><text x="120" y="105">OB→=u→+v→</text><text x="300" y="118">OH→=إسقاط B على المحور</text></svg>',cap:'الإسقاط: OH→ هو الإسقاط العمودي لـ OB→ على المحور، والجداء OB→·OA→=OA×OH — من هنا تُفهم كل خصائص الجداء'},
{k:'ex',t:'الإسقاط: الفكرة التي خلف الصيغة',x:'u→·v→=|u→|×OH حيث H هو إسقاط رأس v→ على اتجاه u→.\\n(1) إذا v→ عمودي على u→ فالإسقاط H يقع في O: الجداء يساوي 0 — وهذا هو تعريف التعامد!\\n(2) إذا v→ موافق لـ u→ فـ OH=|v→|: الجداء يساوي حاصل الضرب العادي.\\n(3) القضية العامة بين بين — والتوزيعية تُترجم هندسيًا: إسقاط مجموع هو مجموع الإسقاطين.'},
{k:'h2',x:'3. التعامد'},
{k:'law',t:'خاصية التعامد (قلب التطبيقات)',m:'\\vec{u}\\perp\\vec{v}\\;\\iff\\;\\vec{u}\\cdot\\vec{v}=0',x:'لمتجهين غير صفريين: التعامد يكافئ انعدام الجداء السلمي. هذه المساواة تحول برهان «عمودية» إلى حساب بسيط بالإحداثيات، أو إلى استغلال خاصية فيثاغورس العكسية في المثلث.'},
{k:'ex',t:'مثال محلول: برهان تعامد',x:'ABC مثلث حيث A(1 , 1) و B(4 , 2) و C(3 , 5). هل المثلث قائم الزاوية عند A؟\nAB→ = (4−1 , 2−1) = (3 , 1) و AC→ = (3−1 , 5−1) = (2 , 4).\nAB→·AC→ = 3×2 + 1×4 = 6 + 4 = 10 ≠ 0: الزاوية (A) ليست قائمة.\nنجرب عند B: BA→ = (−3 , −1) و BC→ = (−1 , 3): الجداء = (−3)(−1) + (−1)(3) = 3 − 3 = 0!\nإذن المثلث قائم الزاوية عند B ✓.'},
{k:'h2',x:'4. العلاقات المترية في المثلث'},
{k:'law',t:'علاقة المنصف (الوسط)',m:'\\overrightarrow{MA}\\cdot\\overrightarrow{MB}=MI^{2}-IA^{2}',x:'حيث I منتصف [AB]. برهان سريع: MA→ = MI→ + IA→ و MB→ = MI→ + IB→ = MI→ − IA→ فالجداء = |MI→|² − |IA→|². الاستعمال الجميل: مجموعة النقط M المحققة MA→·MB→ = 0 هي الدائرة التي قطرها [AB] (لأن MI = IA).'},
{k:'law',t:'العلاقة الأساسية في المثلث (تعميم فيثاغورس)',m:'BC^{2}=AB^{2}+AC^{2}-2\\,AB\\cdot AC\\cdot\\cos(\\widehat{BAC})',x:'تعمل لأي مثلث (خلاف فيثاغورس المحدود بالزاوية القائمة): أضلاع مثلث مع زاوية معروفة تحسب الضلع الثالث، والعكس. تسمى أيضًا «مبرهنة الكوسينات».'},
{k:'ex',t:'مثال محلول: تطبيق علاقة المنصف',x:'A(−1 , 0) و B(3 , 0) و M(x , y). نحسب MA→·MB→ وحدد مجموعة النقط المحققة له = 0.\nMA→ = (−1−x , −y) و MB→ = (3−x , −y).\nالجداء = (−1−x)(3−x) + y² = x² − 2x − 3 + y² = (x−1)² + y² − 4.\nالانعدام يعطي: (x−1)² + y² = 4 — دائرة مركزها I(1 , 0) (منتصف [AB]) ونصف قطرها 2 = IA: الدائرة ذات القطر [AB] ✓.'},
{k:'exer',n:'1',q:'حدد قيمة k بحيث يكون المتجهان u→(1 , 5) و v→(2 , k) متعامدين.',s:['التعامد يكافئ انعدام الجداء السلمي: u→·v→ = 1×2 + 5×k = 0.','إذن 5k = −2 أي k = −2/5.','تحقق: 2 + 5×(−2/5) = 2 − 2 = 0 ✓.']},
{k:'exer',n:'2',q:'ABC مثلث حيث AB = 5 ، AC = 7 و الزاوية (BAC) = 60°. احسب BC ثم طبيعة المثلث.',s:['العلاقة الأساسية: BC² = 25 + 49 − 2×5×7×cos(60°) = 74 − 70×(1/2) = 39.','إذن BC = √39 ≈ 6.24.','تحقق من الزوايا الأخرى أو من خاصية: AB² + BC² = 25 + 39 = 64 و AC² = 49 — لا تساويًا، فالمثلث غير قائم (لكن زواياه كلها حادة هنا).']},
{k:'exer',n:'3',q:'OABC مربع ضلعه 2 برؤوسه بالتتالي O ، A ، B ، C. احسب الجداء السلمي AC→·OB→ (بين قطري المربع) واستنتج طبيعتهما.',s:['نأخذ O(0 , 0) ، A(2 , 0) ، B(2 , 2) ، C(0 , 2).','AC→ = (0−2 , 2−0) = (−2 , 2) و OB→ = (2 , 2).','الجداء السلمي: (−2)×2 + 2×2 = −4 + 4 = 0.','إذن AC→ ⊥ OB→: قطرا المربع متعامدان ✓ (ومتساويان في الطول بطبيعة المربع).']},
{k:'h2',x:'5. التطبيقات: معادلة الدائرة ومجموعات النقط'},

{k:'law',t:'معادلة الدائرة — الصيغتان المكافئتان',m:'(x-a)^{2}+(y-b)^{2}=R^{2}\\;\\iff\\;x^{2}+y^{2}-2ax-2by+c=0',x:'الصيغة المركزة تُقرأ فورًا (المركز ونصف القطر)، والموسعة تُستعمل للتعرف على دائرة من معادلة موسعة بإكمال المربعات.'},
{k:'ex',t:'من المعادلة الموسعة إلى الدائرة',x:'نناقش x²+y²−4x+2y−4=0.\\n(1) نكمل المربعات: (x²−4x+4)+(y²+2y+1)−4−4−1=0 أي (x−2)²+(y+1)²=9.\\n(2) القراءة: دائرة مركزها (2 , −1) ونصف قطرها 3.\\n(3) فحص نقطة: M(2 , 2): (2−2)²+(2+1)²=9 ✓ — النقطة على الدائرة.'},
{k:'exer',n:'1',q:'A(1 , 0) و B(5 , 0). عيّن مجموعة النقط M(x , y) التي تحقق MA→·MB→=0 ثم استنتج معادلتهما.',s:['MA→·MB→=0 يعني المثلث MAB قائم في M: المجموع المطلوب هو دائرة قطرها [AB].','المركز منتصف [AB]: I(3 , 0) والنصف قطر IA=2.','المعادلة: (x−3)²+y²=4 — تحقق جبري ممكن بتوسيع MA→·MB→ بالمركبات.']},
{k:'warn',i:['الخلط بين الجداء السلمي (عدد) والجداء الاتجاهي/الحجمي — في 2AS السلمي فقط.','نسيان أن التعامد يكافئ انعدام الجداء لمتجهين غير صفريين (المتجه الصفري متعامد مع الجميع اصطلاحًا... تجنب الصياغة).','استعمال صيغة الإحداثيات في معلم غير متعامد — الصيغة تتطلب معلمًا متعامدًا ممنظمًا.','إهمال رفع النورم إلى المربع عند النقل بين |u→|² و |u→|.','استنتاج الزاوية من cos سالب دون التحقق أنها منفرجة (θ ∈ [0 , π]).']},
{k:'sum',i:['u→·v→ = |u→||v→|cos θ = xx′ + yy′ (تعريفان متكاملان).','التعامد ⟺ الجداء معدوم — أقوى أداة برهان في المستوي.','|u→|² = u→·u→ ومنه كل مسافة تصبح جداء سلمي.','علاقة المنصف: MA→·MB→ = MI² − IA² (I منتصف [AB]).','العلاقة الأساسية (الكوسينات) تعمم فيثاغورس على أي مثلث.']}
]});

CH_MATH.push({id:'ma10',title:'المتتالية العددية',icon:'🔢',sem:2,
desc:'تعريف المتتالية وطرق توليدها، التمثيل البياني والتقارب، المتتالية المحدودة، الرتابة، المتتاليات الحسابية والهندسية، والبرهنة بالتراكم.',
keys:['متتالية','حسابية','هندسية','أس','مجموع','رتابة','تراكم','استقراء'],
obj:'تتعامل مع المتتاليات المعرفة صراحة أو بالتراجع، تدرس رتابتها، تتقن الحسابية والهندسية (الحد العام والمجاميع)، وتبرهن بالتراكم.',
take:['حسابية: u_n = u_p + (n − p)r — الفرق بين حدين متتاليين ثابت.','هندسية: u_n = u_p q^(n−p) — النسبة بين حدين متتاليين ثابتة.','مجموع حسابية: (عدد الحدود) × (الأول + الأخير) ÷ 2.','مجموع هندسية: u_0(1 − q^(n+1))/(1 − q) لأول (n+1) حدًا.','البرهنة بالتراكم: تحقق عند n₀ + فرض عند n + إثبات عند n+1.'],
sections:[
{k:'h2',x:'1. المتتالية العددية: تعريف'},
{k:'def',t:'تعريف',x:'المتتالية العددية هي دالة u من ℕ (أو جزء منه من نمط ℕ) إلى ℝ. نرمز صورت العدد n بـ u_n بدل u(n) و نسمي u_n «الحد ذا الرتبة n». نكتب المتتالية (u_n) أو (u_n)_{n≥0}.'},
{k:'ul',i:['تعريف صريح: u_n معطاة بدلالة n مباشرة (مثل u_n = 2n + 1).','تعريف بالتراجع (recurrence): u_{n+1} معطاة بدلالة u_n وحد ابتدائي u_0 (مثل u_{n+1} = 0.5 u_n + 3 و u_0 = 1).','التعريف بالتراجع «يولد» الحدود واحدًا واحدًا، والتعريف الصريح يعطي أي حد مباشرة.']},
{k:'h2',x:'2. طرق توليد متتالية عددية'},
{k:'p',x:'المتتالية دالة معرفة على الأعداد الصحيحة: لكل عدد صحيح n نُسند له عددًا uₙ. لكن طريقة «تصنيع» هذه الأعداد هي التي تحدد كل شيء: هناك مصنعان أساسيان.'},
{k:'tbl',h:['الطريقة','المعطى','مثال','ميزتها'],r:[
['الصريحة','uₙ=f(n) مباشرة','uₙ=2n+1','نحسب u₁₀₀ فورًا دون حساب ما قبلها'],
['التراجعية','uₙ₊₁=g(uₙ) مع الحد الأول u₀','uₙ₊₁=2uₙ+3 و u₀=1','نتيجة كل حد من سابقه — نمط أسئلة البكالوريا']]},
{k:'h3',x:'البرهنة بالتراكم (مبدأ الاستقراء) — إثبات الصيغة الصريحة لمتتالية معرفة بالتراجع'},
{k:'note',t:'لماذا نحتاج التراكم؟',x:'المتتالية المعرفة بالتراجع لا تعطينا صيغة مباشرة لـ uₙ. البرهنة بالتراكم هي الأداة الرسمية لإثبات الصيغة الصريحة المتوقعة: نتحقق منها عند أول حد، ثم نبين أنها تنتقل من حد إلى الحد الموالي.'},
{k:'method',t:'خطوات البرهنة بالتراكم لخاصية P_n',i:['التحقق الأولي: برهن أن P_{n₀} صحيحة (غالبًا n₀ = 0 أو 1).','الفرض: افترض أن P_n صحيحة لعدد n ≥ n₀ معين.','الإثبات: برهن أن P_{n+1} صحيحة مستعملًا الفرض.','الخلاصة: بالتراكم، الخاصية صحيحة لكل n ≥ n₀.']},
{k:'ex',t:'مثال محلول كامل',x:'لتكن u_0 = 1 و u_{n+1} = 2u_n + 1. نبرهن أن u_n = 2^(n+1) − 1 لكل n ≥ 0.\nالتحقق عند n = 0: u_0 = 1 و 2^1 − 1 = 1 ✓.\nالفرض: u_n = 2^(n+1) − 1 لعدد n معين.\nالإثبات عند n+1: u_{n+1} = 2u_n + 1 = 2(2^(n+1) − 1) + 1 = 2^(n+2) − 2 + 1 = 2^(n+2) − 1 ✓ وهو المطلوب برتبة n+1.\nالخلاصة: بالتراكم، الصيغة صحيحة لكل n ≥ 0.∎'},
{k:'h2',x:'3. التمثيل البياني لمتتالية'},
{k:'p',x:'نرسم في معلم مستوي النقط (n , uₙ): على الأفقي رتبة الحد وعلى العمودي قيمته. الفرق الجوهري عن منحنيات الدوال: النقط منفصلة — سلّم درجات لا طريق مستمر.'},
{k:'svg',x:'<svg viewBox="0 0 340 200" width="340"><path class="ax" d="M45 15 V180"/><path class="ax" d="M45 15 l-5 10 m5 -10 l5 10"/><path class="ax" d="M35 175 H330"/><path class="ax" d="M330 175 l-10 -5 m10 5 l-10 5"/><path class="aux" d="M60 75 H330"/><text x="316" y="68">ℓ</text><path class="cv" d="M60 150 L100 125 L140 108 L180 96 L220 89 L260 85 L300 83"/><circle cx="60" cy="150" r="4" class="pt"/><circle cx="100" cy="125" r="4" class="pt"/><circle cx="140" cy="108" r="4" class="pt"/><circle cx="180" cy="96" r="4" class="pt"/><circle cx="220" cy="89" r="4" class="pt"/><circle cx="260" cy="85" r="4" class="pt"/><circle cx="300" cy="83" r="4" class="pt"/><text x="52" y="165">u₀</text><text x="94" y="142">u₁</text><text x="138" y="125">u₂</text><text x="300" y="200">n</text></svg>',cap:'النقط تصعد سلّمًا وتستقر قرب الخط المتقطع ℓ: هذا «معنى» التقارب uₙ→ℓ قبل أي رمز رياضي'},
{k:'note',t:'ماذا نقرأ من الرسم؟',x:['النقط تهبط نحو خط أفقي ℓ: نتوقع uₙ→ℓ (تقارب).','النقط تشرع صعودًا دون سقف: نتوقع uₙ→+∞ (تباعد).','الرسم «يقترح» والبرهان الرياضي «يحسم» — الحصر والمقاربة هما أدوات الحسم.']},
{k:'def',t:'متتالية متقاربة',x:'uₙ تتقارب نحو العدد ℓ إذا أصبحت قيمها قريبة من ℓ بقدر ما نريد كلما كبر n. نكتب: lim uₙ = ℓ أي uₙ→ℓ — هندسيًا: النقط تستقر قرب الخط الأفقي y=ℓ.'},
{k:'law',t:'الحدود المرجعية',m:'\\lim_{n\\to+\\infty}\\frac{1}{n}=0\\;\\;\\;;\\;\\;\\lim_{n\\to+\\infty}q^{n}=0\\;(0<q<1)\\;\\;\\;;\\;\\;\\lim_{n\\to+\\infty}q^{n}=+\\infty\\;(q>1)',x:'هذه الثلاثية هي «مفتاح» معظم النهايات في البكالوريا — مع عمليات النهايات نفسها التي درسناها في الدوال.'},
{k:'ex',t:'قراءة ثلاث متتاليات',x:'(1) uₙ=1/n: نقول 1/n→0 — المتتالية متقاربة نحو 0.\\n(2) uₙ=n²+1: النقط تنطلق صعودًا بلا سقف — متباعدة نحو +∞.\\n(3) uₙ=(1/2)ⁿ: 1 , 0,5 , 0,25 , 0,125 …: تسحق نحو 0 بسرعة مضاعفة — متقاربة نحو 0.'},
{k:'note',t:'الجسر مع محور النهايات',x:['حصر uₙ بين متتاليتين معلومتين النهاية يمنحها نهايتهما (مبرهنة الدركمي للمتتاليات).','كل ما درسناه من عمليات النهايات وحالات عدم التعيين في الدوال يسري هنا حرفيًا — المتتالية دالة على ℕ بكل الحقوق.']},
{k:'h2',x:'4. المتتالية المحدودة'},
{k:'p',x:'حتى الآن تكلمًا عن متتاليات «لانهائية» (كل n∈ℕ). لكن بعض الوضعيات تعطي عددًا منتهيًا من الحدود فقط: عدد الأشخاص في صف، نتائج فصل دراسي — تسمى متتالية محدودة.'},
{k:'def',t:'متتالية محدودة',x:'هي التي تُعرف فقط من الرتبة 0 (أو 1) إلى رتبة نهائية N: u₀ , u₁ , … , u_N — عدد حدودها N+1 وليس لمعنى للتحدث عن u_{N+1}.'},
{k:'ex',t:'مثالان',x:'(أ) محدودة: درجات 12 طالبًا مرتبة: 8 , 10 , 10 , 12 , 13 , 14 , 14 , 15 , 15 , 16 , 17 , 18 — من u₀ إلى u₁₁ فقط.\\n(ب) غير محدودة: uₙ=1/n لكل n≥1: لا آخر حد لها، وهذه التي تدرس نهاياتها وتقاربها.'},
{k:'h2',x:'5. الرتابة'},
{k:'def',t:'تعريف — التزايد والتناقص',x:'المتتالية (u_n) تزايدية من الرتبة n₀ إذا كان لكل n ≥ n₀: u_{n+1} ≥ u_n (صرامةً بال>`<). وتناقصية إذا u_{n+1} ≤ u_n. لدراسة الرتابة ندرس إشارة u_{n+1} − u_n (أو نسبة u_{n+1}/u_n إذا كانت الحدود موجبة).'},
{k:'ex',t:'مثال محلول',x:'u_n = n/(n+1) من أجل n ≥ 1:\nu_{n+1} − u_n = (n+1)/(n+2) − n/(n+1) = [(n+1)² − n(n+2)]/[(n+2)(n+1)] = 1/[(n+1)(n+2)] > 0.\nإذن المتتالية تزايدية صرامةً من الرتبة 1. (حيلة: عند الحدود الموجبة يمكن أيضًا مقارنة النسبة بـ 1.)'},
{k:'h2',x:'6. المتتاليات الحسابية'},
{k:'def',t:'تعريف',x:'المتتالية (u_n) حسابية بأساس r إذا كان لكل n: u_{n+1} − u_n = r (عدد ثابت). أي أن كل حد ينتج عن السابق بإضافة r.'},
{k:'law',t:'الحد العام لمتتالية حسابية',m:'u_{n}=u_{p}+(n-p)\\,r\\qquad\\qquad u_{n}=u_{0}+n\\,r',x:'الصيغة الأولى أعم (من أي حد معروف)، والثانية حالتها من n₀ = 0. مثال: إذا كان u_3 = 7 و u_8 = 22 فالأساس r = (22−7)/(8−3) = 3 ومنه u_n = u_3 + (n−3)×3 = 3n − 2.'},
{k:'law',t:'مجموع حدود متتالية حسابية',m:'S_{p\\to n}=(n-p+1)\\;\\frac{u_{p}+u_{n}}{2}',x:'حيلة غاوس الشهيرة: نجمع الحدود مرتين بترتيب معاكس فكل زوج يعطي المجموع نفسه. عدد الحدود من u_p إلى u_n هو (n − p + 1). مثال: 1 + 2 + ... + 100 = 100×(1+100)/2 = 5050.'},
{k:'ex',t:'مثال محلول',x:'متتالية حسابية: u_0 = 5 و r = −2. احسب u_20 ومجموع الحدود من u_0 إلى u_20.\nu_20 = 5 + 20×(−2) = −35.\nالمجموع: 21 حدًا (من 0 إلى 20): S = 21×(5 + (−35))/2 = 21×(−30)/2 = −315.'},
{k:'h2',x:'7. المتتاليات الهندسية'},
{k:'def',t:'تعريف',x:'المتتالية (u_n) هندسية بأساس q ≠ 0 إذا كان لكل n: u_{n+1} = q·u_n. أي أن كل حد ينتج عن السابق بالضرب في q.'},
{k:'law',t:'الحد العام لمتتالية هندسية',m:'u_{n}=u_{p}\\,q^{\\,n-p}\\qquad\\qquad u_{n}=u_{0}\\,q^{\\,n}',x:'بشرط q ≠ 0 وحدود غير صفرية. مثال: u_2 = 12 و u_5 = 96: q³ = 96/12 = 8 أي q = 2 ومنه u_n = u_2 × 2^(n−2) = 3×2^n.'},
{k:'law',t:'مجموع حدود متتالية هندسية (q ≠ 1)',m:'S_{n}=u_{0}\\,\\frac{1-q^{\\,n+1}}{1-q}=u_{0}\\,\\frac{q^{\\,n+1}-1}{q-1}',x:'مجموع أول (n+1) حدًا (من u_0 إلى u_n). لعدد أي من الحدود: اجعل الطرفين أول حد معروف وأسّه الصحيح. مثال: 1 + 2 + 4 + ... + 2^10 = (2^11 − 1)/(2 − 1) = 2047.'},
{k:'ex',t:'مثال محلول',x:'متتالية هندسية u_0 = 1000 و q = 1/2 (تقني: تفكيك دواء). احسب u_5 والمجموع S_5 = u_0 + ... + u_5.\nu_5 = 1000×(1/2)^5 = 31.25.\nS_5 = 1000×[1 − (1/2)^6]/(1 − 1/2) = 1000×(63/64)/(1/2) = 1000×63/32 = 1968.75.'},
{k:'exer',n:'1',q:'متتالية (v_n) حيث v_1 = 3 و v_{n+1} = v_n + 5. احسب v_n بدلالة n ثم مجموع أول 20 حدًا.',s:['حسابية بأساس r = 5 و أول حد v_1 = 3: v_n = 3 + (n−1)×5 = 5n − 2.','مجموع أول 20 حدًا: من v_1 إلى v_20: v_20 = 98.','S = 20×(3 + 98)/2 = 10×101 = 1010.']},
{k:'exer',n:'2',q:'متتالية (w_n) هندسية: w_3 = 8 و w_6 = 64. احسب الأساس q والحد الأول w_0.',s:['w_6 = w_3 × q³ أي 64 = 8q³ ومنه q³ = 8 أي q = 2.','w_3 = w_0 × q³ أي 8 = w_0 × 8 ومنه w_0 = 1.','تحقق: 1 ، 2 ، 4 ، 8 ✓ (وw_n = 2^n).']},
{k:'exer',n:'3',q:'ادرس رتابة المتتالية u_n = (2^n)/(n+1) من أجل n ≥ 0... تلميح: قارن النسبة بالواحد.',s:['الحدود موجبة: ندرس u_{n+1}/u_n = [2^(n+1)/(n+2)] × [(n+1)/2^n] = 2(n+1)/(n+2).','نقارن 2(n+1)/(n+2) مع 1: الفرق = [2n+2 − (n+2)]/(n+2) = n/(n+2) ≥ 0 دائمًا (بصرامة > 0 لـ n ≥ 1).','إذن النسبة ≥ 1 والمتتالية تزايدية من الرتبة 1 (نلاحظ u_0 = 1 و u_1 = 1 متساويان).']},
{k:'warn',i:['استعمال u_n = u_0 + nr من حد ليس u_0 دون تعديل الفرق (n−p) — الصيغة العامة u_n = u_p + (n−p)r.','الخلط بين أساس المتتالية الهندسية q (لا يكون صفرًا) والفرق r في الحسابية (قد يكون سالبًا أو كسريًا).','مقارنة u_{n+1}/u_n بالواحد دون التأكد أن كل الحدود موجبة.','إهمال خطوة التحقق الأولي في البرهنة بالتراكم — بدونها لا يبدأ السلم.']},
{k:'sum',i:['متتالية = دالة على ℕ؛ تعريف صريح أو بالتراجع.','الرتابة بإشارة u_{n+1} − u_n (أو النسبة مع 1 للحدود الموجبة).','حسابية: الفرق r ثابت، الحد العام خطي، المجموع بمتوسط الطرفين.','هندسية: النسبة q ثابتة، الحد العام أسّي، المجموع بصيغة القسمة.','التراكم: تحقق + فرض + إثبات — الهيكل الثلاثي الذي لا يسقط.']}
]});
